<script type="text/babel">
// =========================================================================
// 🤝 FILE: Tab_Affiliate.html
// CHỨC NĂNG: Quản trị Đối Soát Cộng Tác Viên (CTV) Chuẩn Royal V2 Google Sheet
// NGUYÊN TẮC VẬN HÀNH: 
// 1. Tiền thu COD qua GHN là tiền XƯỞNG thu về tài khoản công ty.
// 2. Dư nợ tách bạch rõ ràng:
//    - Số ÂM (-) / MÀU XANH: XƯỞNG NỢ CTV (Xưởng giữ thừa COD, trả hoa hồng cho CTV).
//    - Số DƯƠNG (+) / MÀU ĐỎ: CTV NỢ XƯỞNG (CTV tự thu trước tiền khách, cước hoàn, phụ phí).
// 3. Giao diện dạng Bảng (Table Data Grid) trực quan như Google Sheet cũ.
// 4. Cách ly 100% tài chính CTV, an toàn với Sổ quỹ chính.
// =========================================================================

function TabAffiliate({ orders, ctvFinance, pushDeltas, currentUser: propCurrentUser, triggerToast, userRole: propUserRole, hasPerm: propHasPerm, userConfigs, erpData, prodItems, configGiaLayout }) {
  const [selectedCTV, setSelectedCTV] = React.useState('');
  const [selectedMonth, setSelectedMonth] = React.useState(new Date().toISOString().substring(0, 7));
  const [viewMode, setViewMode] = React.useState('cards'); // 'cards' | 'table'
  const [statusFilter, setStatusFilter] = React.useState('ALL'); // 'ALL' | 'DELIVERED' | 'SHIPPING' | 'RETURNED' | 'UNRECONCILED' | 'RECONCILED'
  const [orderSearchQuery, setOrderSearchQuery] = React.useState('');
  
  // States cho giao dịch phụ phí & thanh toán
  const [showAddTx, setShowAddTx] = React.useState(false);
  const [txType, setTxType] = React.useState('PHÍ VẬN CHUYỂN');
  const [txAmount, setTxAmount] = React.useState('');
  const [txNote, setTxNote] = React.useState('');
  const [editingTxId, setEditingTxId] = React.useState(null);
  const [isProcessing, setIsProcessing] = React.useState(false);

  // States xem & chỉnh sửa đơn
  const [editingOrder, setEditingOrder] = React.useState(null);
  const [viewingHistoryOrder, setViewingHistoryOrder] = React.useState(null);
  const [viewingDetailOrder, setViewingDetailOrder] = React.useState(null);
  
  // State Sửa Nhanh Giá Xưởng & Thu COD
  const [quickEditOrder, setQuickEditOrder] = React.useState(null);
  const [quickRev, setQuickRev] = React.useState('');
  const [quickCod, setQuickCod] = React.useState('');
  const [quickPrePaid, setQuickPrePaid] = React.useState('');

  // Selected orders for bulk reconcile
  const [selectedOrderIds, setSelectedOrderIds] = React.useState([]);

  // States cho Modal Xác Nhận Thanh Toán Nhanh (Pop-up giữa màn hình)
  const [showQuickPayModal, setShowQuickPayModal] = React.useState(false);
  const [quickPayUser, setQuickPayUser] = React.useState('');
  const [quickPayType, setQuickPayType] = React.useState('CTV THANH TOÁN');
  const [quickPayAmount, setQuickPayAmount] = React.useState('');
  const [quickPayNote, setQuickPayNote] = React.useState('');
  const [quickPayAccount, setQuickPayAccount] = React.useState('');

  const currentRole = propUserRole || localStorage.getItem('rf_role') || '';
  const currentUser = propCurrentUser || localStorage.getItem('rf_user') || '';
  const isBoss = localStorage.getItem('rf_boss') === 'true' || currentRole === 'TỐI CAO' || currentUser.includes('Tiến');

  const hasPerm = React.useCallback((actionCode) => {
    if (isBoss || currentRole === 'TỐI CAO') return true;
    if (typeof propHasPerm === 'function') return propHasPerm(actionCode);
    if (typeof canUserDo === 'function') return canUserDo(actionCode, currentRole, currentUser);
    return isBoss;
  }, [propHasPerm, currentRole, currentUser, isBoss]);

  const userProfile = (Array.isArray(erpData?.Config_NhanSu) ? erpData.Config_NhanSu.find(u => (u['Tên Nhân Sự'] || u.name) === currentUser) : null)
      || (userConfigs?.raw ? userConfigs.raw.find(u => (u['Tên Nhân Sự'] || u.name) === currentUser) : null);
  const userTitle = String(userProfile?.['Chức Danh'] || userProfile?.title || userConfigs?.titles?.[currentUser] || '').toUpperCase();
  const isCTV = currentRole === 'CTV' || currentRole === 'CỘNG TÁC VIÊN' || userTitle.includes('CỘNG TÁC VIÊN') || userTitle.includes('CTV');
  const isAdminOrKetoan = isBoss || currentRole === 'TỐI CAO' || currentRole === 'KẾ TOÁN' || hasPerm('CTV_WITHDRAW_PAY') || hasPerm('CTV_CHANGE_COEFFICIENT');

  const ctvList = React.useMemo(() => {
      const set = new Set();
      const EXCLUDED_STAFF = ['Nguyễn Thị Diệu Hương', 'Diệu Hương', 'Admin', 'Tối Cao', 'Nguyễn Ngọc Tiến'];
      if (userConfigs && userConfigs.users && userConfigs.roles) {
          userConfigs.users.forEach(name => {
              if (EXCLUDED_STAFF.includes(name)) return;
              const r = String(userConfigs.roles[name] || '').toUpperCase();
              const p = Array.isArray(erpData?.Config_NhanSu) ? erpData.Config_NhanSu.find(u => (u['Tên Nhân Sự'] || u.name) === name) : null;
              const t = String(p?.['Chức Danh'] || '').toUpperCase();
              if (r === 'CTV' || r === 'CỘNG TÁC VIÊN' || t.includes('CỘNG TÁC VIÊN') || t.includes('CTV')) set.add(name);
          });
      }
      if (Array.isArray(erpData?.Config_NhanSu)) {
          erpData.Config_NhanSu.forEach(s => {
              const name = s['Tên Nhân Sự'] || s.name;
              if (!name || EXCLUDED_STAFF.includes(name)) return;
              const t = String(s['Chức Danh'] || '').toUpperCase();
              const r = String(s['Phân Quyền'] || '').toUpperCase();
              if (r === 'CTV' || r === 'CỘNG TÁC VIÊN' || t.includes('CỘNG TÁC VIÊN') || t.includes('CTV')) set.add(name);
          });
      }
      // Quét thêm từ các đơn hàng CTV đã có trong hệ thống để tìm thấy mọi CTV dù chưa có role trong Config_NhanSu
      (orders || []).forEach(o => {
          const ch = String(o.channel || '').toUpperCase();
          const code = String(o.orderCode || o.id || '').toUpperCase();
          const isDedicated = (ch.includes('CỘNG TÁC VIÊN') || ch === 'CTV' || code.startsWith('CTV')) && !ch.includes('BÁN SỈ');
          const hasCtvTag = o.note && (o.note.includes('[CTV:') || o.note.includes('ctv:'));
          if (isDedicated || hasCtvTag) {
              const resp = String(o.responsibleUser || '').trim();
              if (resp && !EXCLUDED_STAFF.includes(resp)) {
                  set.add(resp);
              }
              if (o.note && o.note.includes('[CTV:')) {
                  const m = o.note.match(/\[CTV:\s*([^\]]+)\]/i);
                  if (m && m[1] && !EXCLUDED_STAFF.includes(m[1].trim())) set.add(m[1].trim());
              }
          }
      });
      return Array.from(set);
  }, [userConfigs, orders]);

  React.useEffect(() => {
      if (isCTV) {
          setSelectedCTV(currentUser);
      } else if (!selectedCTV) {
          setSelectedCTV('ALL');
      }
  }, [isCTV, currentUser, ctvList]);

  // Lọc danh sách đơn hàng của CTV được chọn (hoặc TẤT CẢ CTV)
  const ctvOrders = React.useMemo(() => {
      if (!selectedCTV) return [];
      return (orders || []).filter(o => {
          const ch = String(o.channel || '').toUpperCase();
          const code = String(o.orderCode || o.id || '').toUpperCase();
          const orderMonth = (o.date || o.createdAt || '').substring(0, 7);
          const matchMonth = !selectedMonth || orderMonth === selectedMonth;
          const ctvClean = String(selectedCTV || '').toLowerCase().trim();
          const respClean = String(o.responsibleUser || '').toLowerCase().trim();
          const updatedClean = String(o.updatedBy || '').toLowerCase().trim();
          const createdClean = String(o.createdBy || '').toLowerCase().trim();
          const custClean = String(o.customer || '').toLowerCase().trim();
          const noteClean = String(o.note || '').toLowerCase();
          
          const isDedicatedCtv = (ch.includes('CỘNG TÁC VIÊN') || ch === 'CTV' || (!ch && code.startsWith('CTV'))) && !ch.includes('BÁN SỈ');
          const isCtvOwnedRetail = (ch.includes('BÁN LẺ') || ch.includes('BAN LE')) && (
              (respClean && ctvClean && (respClean === ctvClean || respClean.includes(ctvClean) || ctvClean.includes(respClean))) ||
              (noteClean && ctvClean && (noteClean.includes(`ctv: ${ctvClean}`) || noteClean.includes(`[ctv: ${ctvClean}`) || noteClean.includes(`ctv ${ctvClean}`)))
          );
          const isCtvChannel = isDedicatedCtv || isCtvOwnedRetail;
          
          const isMyOrder = (selectedCTV === 'ALL') ||
                            (respClean && (respClean === ctvClean || respClean.includes(ctvClean) || ctvClean.includes(respClean))) ||
                            (createdClean && createdClean === ctvClean) ||
                            (updatedClean && updatedClean === ctvClean) ||
                            (custClean && custClean === ctvClean) ||
                            (ctvClean && noteClean.includes(`ctv: ${ctvClean}`)) ||
                            (ctvClean && noteClean.includes(`[ctv: ${ctvClean}`)) ||
                            (ctvClean && noteClean.includes(`ctv ${ctvClean}`));
          
          // Loại bỏ đơn huỷ, BẢO LƯU ĐƠN HOÀN để tính phí ship hoàn & đối soát công nợ
          const isCancelled = typeof normalizeStatus === 'function' ? normalizeStatus(o.status) === 'Đơn Huỷ' : String(o.status || '').includes('Huỷ');
          
          return matchMonth && isCtvChannel && isMyOrder && !isCancelled;
      }).sort((a, b) => new Date(b.date || b.createdAt || 0) - new Date(a.date || a.createdAt || 0));
  }, [orders, selectedCTV, selectedMonth]);

  // Lọc danh sách giao dịch phụ phí CTV
  const ctvTxs = React.useMemo(() => {
      if (!selectedCTV) return [];
      return (ctvFinance || []).filter(t => {
          const txMonth = (t.date || '').substring(0, 7);
          const matchMonth = !selectedMonth || txMonth === selectedMonth;
          const matchUser = selectedCTV === 'ALL' || String(t.user || '').trim().toLowerCase() === String(selectedCTV || '').trim().toLowerCase();
          return matchUser && matchMonth;
      }).sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
  }, [ctvFinance, selectedCTV, selectedMonth]);

  // Lấy phụ phí gắn liền với đơn hàng cụ thể
  const getOrderExtraExpenses = React.useCallback((o) => {
      if (!ctvTxs || ctvTxs.length === 0 || !o) return 0;
      const code = String(o.orderCode || '').toLowerCase().trim();
      const id = String(o.id || '').toLowerCase().trim();
      
      return ctvTxs.filter(t => {
          const note = String(t.note || '').toLowerCase();
          const matchCode = (code && note.includes(code)) || (id && note.includes(id));
          if (!matchCode) return false;

          const type = String(t.type || '').toUpperCase().trim();
          // Bỏ qua các khoản thanh toán/kết chuyển (sẽ cấn trừ ở Sổ Kế Toán Tổng)
          if (type === 'THANH TOÁN' || type === 'CTV THANH TOÁN' || type === 'XƯỞNG THANH TOÁN' || type === 'SHOP THANH TOÁN' || type.includes('DƯ NỢ KỲ TRƯỚC')) {
              return false;
          }
          return true;
      }).reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
  }, [ctvTxs]);

  // =========================================================================
  // 📐 QUY TẮC TÍNH DƯ NỢ ĐƠN HÀNG (CHUẨN SHEET ANH KIÊN):
  // - ÂM (-)    = SHOP NỢ CTV / SHOP GIỮ DƯ (Do Thu COD > Đơn giá xưởng -> Shop trả tiền hoa hồng cho CTV)
  // - DƯƠNG (+) = CTV NỢ SHOP (Do Thu COD < Đơn giá xưởng hoặc COD = 0 vì CTV tự thu trước, hoặc đơn hoàn)
  // - 0         = HÒA / TẤT TOÁN
  // Công thức: Dư Nợ = Đơn Giá Xưởng + Phụ Phí Đơn - Thu COD - Khách Cọc
  // =========================================================================
  const getOrderDebtValue = React.useCallback((o) => {
      if (!o) return 0;
      const isCancelled = typeof normalizeStatus === 'function' ? normalizeStatus(o.status) === 'Đơn Huỷ' : String(o.status || '').includes('Huỷ');
      if (isCancelled) return 0;
      
      const rev = Number(o.revenue) || 0;
      const cod = Number(o.cod) || 0;
      const prePaid = Number(o.prePaid) || 0;
      const extraExp = getOrderExtraExpenses(o);
      
      return (rev + extraExp - cod - prePaid);
  }, [getOrderExtraExpenses]);

  // Trích xuất mô tả hàng hóa của đơn (Layout / Bể kính / Phụ kiện)
  const getOrderItemsSummary = React.useCallback((o) => {
      if (!o) return '—';
      // 1. Quét từ prodItems
      const oId = String(o.id || '').trim();
      const oCode = String(o.orderCode || '').trim();
      const matchedProds = (prodItems || []).filter(p => {
          const pOrd = String(p.orderId || '').trim();
          return pOrd && (pOrd === oId || pOrd === oCode);
      });
      if (matchedProds.length > 0) {
          return matchedProds.map(p => p.name || 'Layout Sản Xuất').join(', ');
      }
      // 2. Quét từ accessories
      let accs = [];
      try {
          if (Array.isArray(o.accessories)) accs = o.accessories;
          else if (typeof o.accessories === 'string' && o.accessories.trim().startsWith('[')) {
              accs = JSON.parse(o.accessories);
          }
      } catch(e) { accs = []; }
      if (accs.length > 0) {
          return accs.map(a => `${a.name || a.Name || 'Mặt hàng'} (x${a.quantity || 1})`).join(', ');
      }
      // 3. Fallback ghi chú hoặc mã đơn
      return o.note ? o.note.split('|')[0].trim() : 'Đơn hàng CTV';
  }, [prodItems]);

  // Trích xuất ảnh thumbnail của đơn hàng
  const getOrderThumbnail = React.useCallback((o) => {
      if (!o) return '';
      const oId = String(o.id || '').trim();
      const oCode = String(o.orderCode || '').trim();
      // Quét ảnh KCS hoặc khâu sản xuất
      const p = (prodItems || []).find(item => {
          const pOrd = String(item.orderId || '').trim();
          return pOrd && (pOrd === oId || pOrd === oCode);
      });
      if (p) {
          if (p.qc_front_photo) return p.qc_front_photo;
          if (p.p1_photo) return p.p1_photo;
          if (p.p2_photo) return p.p2_photo;
      }
      // Quét ảnh đóng gói
      const pk = (erpData?.Packings || []).find(pack => {
          const pOrd = String(pack.orderId || '').trim();
          return pOrd && (pOrd === oId || pOrd === oCode);
      });
      if (pk) {
          if (pk.photoBefore) return pk.photoBefore;
          if (pk.photo) {
              const parts = pk.photo.split('||');
              return parts[0];
          }
      }
      return '';
  }, [prodItems, erpData]);

  // =========================================================================
  // 📊 TÍNH TOÁN TỔNG DƯ NỢ CÔNG NỢ KỲ ĐỐI SOÁT (BÓC TÁCH ĐÃ ĐỐI SOÁT VS CHỜ ĐỐI SOÁT)
  // =========================================================================
  const debtStats = React.useMemo(() => {
      let orderDebt = 0;
      let totalOrderRevenue = 0;
      let totalOrderCOD = 0;
      let totalOrderExtraExp = 0;
      let totalReconciledOrders = 0;
      let totalUnreconciledOrders = 0;
      
      let reconciledOrderDebt = 0;
      let reconciledRevenue = 0;
      let reconciledCOD = 0;
      let reconciledExtraExp = 0;

      let unreconciledOrderDebt = 0;
      let unreconciledRevenue = 0;
      let unreconciledCOD = 0;
      let unreconciledExtraExp = 0;
      
      ctvOrders.forEach(o => {
          const isCancelled = typeof normalizeStatus === 'function' ? normalizeStatus(o.status) === 'Đơn Huỷ' : String(o.status || '').includes('Huỷ');
          if (isCancelled) return;
          const rev = Number(o.revenue) || 0;
          const cod = Number(o.cod) || 0;
          const extra = getOrderExtraExpenses(o);
          const debtVal = getOrderDebtValue(o);

          orderDebt += debtVal;
          totalOrderRevenue += rev;
          totalOrderCOD += cod;
          totalOrderExtraExp += extra;

          const s = String(o.status || '').toUpperCase();
          const isRec = o.isReconciled || Boolean(o.reconciledAt) || s.includes('ĐỐI SOÁT');
          if (isRec) {
              totalReconciledOrders++;
              reconciledOrderDebt += debtVal;
              reconciledRevenue += rev;
              reconciledCOD += cod;
              reconciledExtraExp += extra;
          } else {
              totalUnreconciledOrders++;
              unreconciledOrderDebt += debtVal;
              unreconciledRevenue += rev;
              unreconciledCOD += cod;
              unreconciledExtraExp += extra;
          }
      });

      let extraDebt = 0;
      let totalPaidByCTV = 0;
      let totalPaidByShop = 0;
      let totalSurcharges = 0;
      let totalShipFees = 0;
      let totalReturnFees = 0;
      let broughtForwardDebt = 0;
      
      ctvTxs.forEach(t => {
          const amt = Number(t.amount) || 0;
          const type = String(t.type || '').toUpperCase().trim();
          
          // Kiểm tra xem giao dịch đã tính vào phụ phí đơn chưa
          const note = String(t.note || '').toLowerCase();
          const isAttachedToOrder = ctvOrders.some(o => {
              const code = String(o.orderCode || '').toLowerCase();
              const id = String(o.id || '').toLowerCase();
              return (code && note.includes(code)) || (id && note.includes(id));
          });
          
          if (type === 'THANH TOÁN' || type === 'CTV THANH TOÁN') {
              // CTV chuyển tiền trả Shop -> Giảm nợ CTV (-)
              totalPaidByCTV += amt;
              extraDebt -= amt;
          } else if (type === 'DƯ NỢ KỲ TRƯỚC (SHOP NỢ)' || type === 'DƯ NỢ KỲ TRƯỚC (XƯỞNG NỢ)') {
              // Xưởng nợ từ kỳ trước -> Giảm nợ CTV (-)
              broughtForwardDebt -= amt;
              extraDebt -= amt;
          } else if (type === 'DƯ NỢ KỲ TRƯỚC (CTV NỢ)') {
              // CTV nợ từ kỳ trước -> Tăng nợ CTV (+)
              broughtForwardDebt += amt;
              extraDebt += amt;
          } else if (type === 'SHOP THANH TOÁN' || type === 'XƯỞNG THANH TOÁN') {
              // Xưởng chuyển khoản trả hoa hồng cho CTV -> Tăng số dư CTV nợ (+)
              totalPaidByShop += amt;
              extraDebt += amt;
          } else {
              // Các phụ phí độc lập ngoài đơn
              if (type.includes('VẬN CHUYỂN') || type.includes('SHIP')) totalShipFees += amt;
              else if (type.includes('HOÀN')) totalReturnFees += amt;
              totalSurcharges += amt;

              if (!isAttachedToOrder) {
                  extraDebt += amt;
              }
          }
      });

      const finalDebt = orderDebt + extraDebt;
      const reconciledFinalDebt = reconciledOrderDebt + extraDebt; // Dư nợ các đơn ĐÃ đối soát kèm chi phí phát sinh

      return { 
          finalDebt, 
          reconciledFinalDebt,
          orderDebt, 
          extraDebt, 
          totalOrderRevenue, 
          totalOrderCOD, 
          totalOrderExtraExp,
          totalPaidByCTV, 
          totalPaidByShop,
          totalSurcharges,
          totalShipFees,
          totalReturnFees,
          broughtForwardDebt,
          totalReconciledOrders,
          totalUnreconciledOrders,
          reconciledOrderDebt,
          reconciledRevenue,
          reconciledCOD,
          reconciledExtraExp,
          unreconciledOrderDebt,
          unreconciledRevenue,
          unreconciledCOD,
          unreconciledExtraExp
      };
  }, [ctvOrders, ctvTxs, getOrderDebtValue, getOrderExtraExpenses]);

  // Bóc tách công nợ chi tiết từng CTV trong kỳ (dành cho chế độ ALL & Modal thanh toán)
  const ctvDebtBreakdown = React.useMemo(() => {
      const statsByUser = {};
      const ensureCtv = (name) => {
          const clean = String(name || '').trim();
          if (!clean) return 'Cộng Tác Viên';
          if (!statsByUser[clean]) {
              statsByUser[clean] = { user: clean, orderDebt: 0, extraDebt: 0, ordersCount: 0, totalPaid: 0, finalDebt: 0 };
          }
          return clean;
      };

      (ctvList || []).forEach(name => ensureCtv(name));

      // Quét tất cả đơn hàng CTV trong tháng
      (orders || []).forEach(o => {
          const ch = String(o.channel || '').toUpperCase();
          const code = String(o.orderCode || o.id || '').toUpperCase();
          const orderMonth = (o.date || o.createdAt || '').substring(0, 7);
          if (selectedMonth && orderMonth !== selectedMonth) return;

          const isDedicatedCtv = (ch.includes('CỘNG TÁC VIÊN') || ch === 'CTV' || (!ch && code.startsWith('CTV'))) && !ch.includes('BÁN SỈ');
          const hasCtvTag = o.note && (o.note.includes('[CTV:') || o.note.includes('ctv:'));
          if (!isDedicatedCtv && !hasCtvTag) return;

          const isCancelled = typeof normalizeStatus === 'function' ? normalizeStatus(o.status) === 'Đơn Huỷ' : String(o.status || '').includes('Huỷ');
          if (isCancelled) return;

          let ctvName = String(o.responsibleUser || '').trim();
          if (!ctvName || !statsByUser[ctvName]) {
              const m = o.note && o.note.match(/\[CTV:\s*([^\]]+)\]/i);
              if (m && m[1]) ctvName = m[1].trim();
          }
          if (!ctvName) ctvName = 'Cộng Tác Viên';
          ensureCtv(ctvName);

          const debtVal = getOrderDebtValue(o);
          statsByUser[ctvName].orderDebt += debtVal;
          statsByUser[ctvName].ordersCount += 1;
      });

      // Quét ctvFinance trong tháng
      (ctvFinance || []).forEach(t => {
          const txMonth = (t.date || '').substring(0, 7);
          if (selectedMonth && txMonth !== selectedMonth) return;
          const u = String(t.user || '').trim();
          if (!u || u === 'ALL') return;
          ensureCtv(u);

          const amt = Number(t.amount) || 0;
          const type = String(t.type || '').toUpperCase().trim();
          if (type === 'THANH TOÁN' || type === 'CTV THANH TOÁN') {
              statsByUser[u].extraDebt -= amt;
              statsByUser[u].totalPaid += amt;
          } else if (type === 'DƯ NỢ KỲ TRƯỚC (SHOP NỢ)' || type === 'DƯ NỢ KỲ TRƯỚC (XƯỞNG NỢ)') {
              statsByUser[u].extraDebt -= amt;
          } else if (type === 'DƯ NỢ KỲ TRƯỚC (CTV NỢ)') {
              statsByUser[u].extraDebt += amt;

              }
          }

          const addr = String(o.address || '').replace(/,/g, ';').replace(/"/g, '""');

      });

          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.setAttribute('download', filename);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

                  { id: 'RETURNED', label: 'Hàng Hoàn', count: ctvOrders.filter(o => String(o.status || '').toUpperCase().includes('HOÀN')).length },

                  { id: 'RECONCILED', label: 'Đã Đối Soát', count: debtStats.totalReconciledOrders }

                  <button

                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex items-center gap-1.5 cursor-pointer ${
                          statusFilter === tab.id

                      <span>{tab.label}</span>
                      <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-mono font-black ${

                  <button

                              <i className="fas fa-check-double text-xs"></i>
                              <span>Chốt Đối Soát ({selectedOrderIds.length})</span>
                          </button>
                      )}

                      {selectedOrderIds.length > 0 && isAdminOrKetoan && (
                          <button
                              onClick={handleBulkConvertToRetail}

                              <span>Chuyển Về Bán Lẻ ({selectedOrderIds.length})</span>
                          </button>

                      <button

                          {selectedOrderIds.length === filteredOrders.length ? 'Bỏ chọn tất cả' : 'Chọn tất cả'}

                                              if (e.target.checked) setSelectedOrderIds(filteredOrders.map(o => o.id));
                                              else setSelectedOrderIds([]);

                                      </td>
                                  </tr>

                                      const thumb = getOrderThumbnail(o);

                                          if (mvd.toUpperCase().startsWith('GY') || mvd.toUpperCase().startsWith('GHN')) {
                                              trackingUrl = `https://donhang.ghn.vn/?order_code=${mvd}`;
                                          } else if (mvd.toUpperCase().startsWith('L')) {
                                              trackingUrl = `https://spx.vn/track?bill_no=${mvd}`;
                                          }
                                      }

                                      const s = String(o.status || '').toUpperCase().trim();
                                      const isReconciled = o.isReconciled || Boolean(o.reconciledAt) || s.includes('ĐỐI SOÁT');
                                      const isHandedOver = s === 'ĐÃ BÀN GIAO' || s === 'ĐÃ GIAO';
                                      const isReturned = s.includes('HOÀN');
                                      const isSelected = selectedOrderIds.includes(o.id);

                                                      type="checkbox"
                                                      checked={isSelected}
                                                      onChange={(e) => {
                                                          if (e.target.checked) setSelectedOrderIds([...selectedOrderIds, o.id]);

                                                      className="cursor-pointer rounded accent-[#d4af37]"

                                                      <div 
                                                          onClick={() => setViewingDetailOrder(o)}
                                                          className="w-10 h-10 rounded-lg bg-zinc-800/80 border border-white/10 flex items-center justify-center text-zinc-500 mx-auto text-xs cursor-pointer"
                                                      >
                                                          <i className="fas fa-cube"></i>
                                                      </div>

                                                          onClick={() => {

                                                          className="text-zinc-500 hover:text-[#d4af37]" 
                                                          title="Copy mã đơn"
                                                      >
                                                          <i className="fas fa-copy text-[10px]"></i>
                                                      </button>
                                                  </div>
                                                  {mvd && (
                                                      <div className="flex items-center gap-1 mt-0.5">

                                                              <a href={trackingUrl} target="_blank" rel="noreferrer" className="text-[10px] text-sky-400 hover:underline" title="Tra cứu GHN">
                                                                  <i className="fas fa-external-link-alt text-[8px]"></i>
                                                              </a>
                                                          )}
                                                      </div>
                                                  )}

                                                      {o.date || o.createdAt?.slice(0, 10) || ''}

                                                           CTV: {o.responsibleUser || (o.note?.match(/\[CTV:\s*([^\]]+)\]/i)?.[1]) || 'Cộng Tác Viên'}

                                                           </span>
                                                       )}

                                                  )}

                                                      <div className="text-[10px] text-zinc-400 italic truncate max-w-[200px] mt-0.5" title={o.note}>

                                                      </div>

                                              </td>

                                                      <div className="text-[10px] text-sky-400 font-mono mt-0.5">
                                                          Cọc: {formatMoney(o.prePaid)}đ
                                                      </div>

                                              {/* Thu COD - Click Sửa Nhanh */}

                                                      onClick={() => handleOpenQuickEdit(o)}
                                                      className="font-mono font-bold text-amber-400 hover:text-amber-300 transition-colors cursor-pointer group flex items-center justify-end gap-1 ml-auto"

                                                      <span>{formatMoney(o.cod)}đ</span>
                                                      <i className="fas fa-pen text-[9px] opacity-0 group-hover:opacity-100 text-amber-400"></i>

                                                  <div className="text-[9px] font-bold mt-0.5">
                                                      {orderDebtVal > 0 ? (
                                                          <span className="text-rose-400 bg-rose-500/10 px-1 py-0.2 rounded border border-rose-500/20">CTV Nợ</span>
                                                      ) : (orderDebtVal < 0 ? (
                                                          <span className="text-emerald-400 bg-emerald-500/10 px-1 py-0.2 rounded border border-emerald-500/20">Shop Trả</span>

                                                      ))}
                                                  </div>
                                              </td>

                                                          isReconciled 
                                                              ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30' 
                                                              : (isReturned 
                                                                  ? 'bg-rose-500/15 text-rose-400 border-rose-500/30' 
                                                                  : (isHandedOver ? 'bg-sky-500/15 text-sky-400 border-sky-500/30' : 'bg-amber-500/15 text-amber-400 border-amber-500/30'))
                                                      }`}>
                                                          {isReconciled ? 'Đã Đối Soát' : (isReturned ? 'Hàng Hoàn' : (isHandedOver ? 'Đã Giao' : (o.status || 'Chờ SX')))}
                                                      </span>

                                                      {/* Nút bấm chuyển trạng thái đối soát */}
                                                      {isAdminOrKetoan && (
                                                          <button
                                                              onClick={() => handleToggleReconcileOrder(o)}
                                                              disabled={isProcessing}
                                                              className={`text-[9px] font-bold px-1.5 py-0.5 rounded transition-all cursor-pointer ${
                                                                  isReconciled 
                                                                      ? 'text-zinc-400 hover:text-amber-400 bg-white/5' 
                                                                      : 'text-emerald-400 hover:bg-emerald-500/20 bg-emerald-500/10 border border-emerald-500/20'
                                                              }`}
                                                              title={isReconciled ? 'Bấm để hủy chốt đối soát' : 'Bấm để chốt đối soát đơn này'}
                                                          >
                                                              {isReconciled ? 'Mở lại' : 'Chốt đối soát'}
                                                          </button>

                                              </td>

                                              {/* Cột Thao Tác */}

                                                          <i className="fas fa-eye text-xs"></i>
                                                      </button>

                                                      <button
                                                          onClick={() => setEditingOrder(o)}

                                                          title="Chỉnh sửa toàn bộ đơn hàng"
                                                      >
                                                          <i className="fas fa-edit text-xs"></i>
                                                      </button>

                                                      {isAdminOrKetoan && (
                                                          <button
                                                              onClick={() => handleSingleConvertToRetail(o)}
                                                              className="w-7 h-7 rounded-lg bg-blue-500/15 hover:bg-blue-500 text-blue-400 hover:text-white flex items-center justify-center transition-all cursor-pointer shadow-sm"
                                                              title="Chuyển đơn này về kênh Bán Lẻ nội bộ"
                                                          >
                                                              <i className="fas fa-store text-xs"></i>
                                                          </button>
                                                      )}

                                                      {isAdminOrKetoan && (
                                                          <button

              {/* Danh sách bóc tách công nợ từng CTV trong kỳ (Hiện khi có từ 1 CTV trở lên có phát sinh) */}

                <div className="bg-[#18181b] border border-white/[0.08] rounded-2xl p-3.5 space-y-2.5 shadow-inner">
                  <div className="flex items-center justify-between border-b border-white/[0.06] pb-2">
                    <span className="text-[11px] font-black uppercase tracking-wider text-zinc-300 flex items-center gap-1.5">

                      <span>DƯ NỢ TỪNG CTV KỲ {selectedMonth} ({ctvDebtBreakdown.length})</span>
                    </span>

                  </div>

                  <div className="max-h-40 overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
                    {ctvDebtBreakdown.map((item) => {
                      const isSelected = quickPayUser === item.user;
                      const isDebt = item.finalDebt > 0;
                      const isSurplus = item.finalDebt < 0;

                      return (
                        <div
                          key={item.user}
                          onClick={() => {
                            setQuickPayUser(item.user);
                            setQuickPayAmount(String(Math.abs(item.finalDebt)));
                            setQuickPayType(item.finalDebt >= 0 ? 'CTV THANH TOÁN' : 'XƯỞNG THANH TOÁN');
                          }}
                          className={`p-2.5 rounded-xl border transition-all cursor-pointer flex items-center justify-between gap-2 ${
                            isSelected
                              ? 'bg-[#d4af37]/15 border-[#d4af37]/50 shadow-sm'
                              : 'bg-[#121214] border-white/[0.05] hover:border-white/20'
                          }`}
                        >
                          <div className="min-w-0 flex items-center gap-2">
                            <span className={`w-2 h-2 rounded-full shrink-0 ${isDebt ? 'bg-rose-400' : (isSurplus ? 'bg-emerald-400' : 'bg-zinc-600')}`}></span>
                            <div className="truncate">
                              <span className="font-bold text-white text-xs">{item.user}</span>
                              <span className="text-[10px] text-zinc-400 ml-1.5 font-mono">({item.ordersCount} đơn)</span>
                            </div>
                          </div>

                          <div className="flex items-center gap-2 shrink-0">
                            <span className={`font-mono font-black text-xs ${isDebt ? 'text-rose-400' : (isSurplus ? 'text-emerald-400' : 'text-zinc-400')}`}>
                              {isDebt ? `+${formatMoney(item.finalDebt)}đ` : (isSurplus ? `-${formatMoney(Math.abs(item.finalDebt))}đ` : '0đ')}
                            </span>
                            <button
                              type="button"
                              className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase transition-all ${
                                isSelected ? 'bg-[#d4af37] text-black' : 'bg-white/[0.08] text-zinc-300 hover:bg-white/[0.15]'
                              }`}
                            >
                              {isSelected ? 'Đang chọn' : 'Chọn'}
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Form Chi Tiết Thanh Toán */}

                {/* 1. Chọn CTV */}

                  <label className="text-[11px] font-black uppercase text-zinc-300 tracking-wider mb-1.5 flex items-center justify-between">
                    <span>1. Cộng Tác Viên Thanh Toán <b className="text-rose-400">*</b></span>
                    {quickPayUser && (
                      <span className="text-[10px] text-[#d4af37] font-normal">
                        Số dư kỳ: <b>{formatMoney(ctvDebtBreakdown.find(c => c.user === quickPayUser)?.finalDebt || 0)}đ</b>
                      </span>
                    )}
                  </label>
                  <select
                    value={quickPayUser}
                    onChange={(e) => {
                      const u = e.target.value;
                      setQuickPayUser(u);
                      const found = ctvDebtBreakdown.find(c => c.user === u);
                      if (found && found.finalDebt !== 0) {
                        setQuickPayAmount(String(Math.abs(found.finalDebt)));
                        setQuickPayType(found.finalDebt >= 0 ? 'CTV THANH TOÁN' : 'XƯỞNG THANH TOÁN');
                      }
                    }}
                    className="w-full bg-[#18181b] border border-white/[0.12] rounded-xl px-3 py-2.5 text-xs font-bold text-white outline-none focus:border-[#d4af37] cursor-pointer"
                  >
                    <option value="" className="bg-[#121214] text-zinc-400">-- Vui lòng chọn CTV --</option>
                    {ctvList.map(c => {
                      const found = ctvDebtBreakdown.find(b => b.user === c);
                      const debtStr = found ? (found.finalDebt > 0 ? ` (Nợ: +${formatMoney(found.finalDebt)}đ)` : (found.finalDebt < 0 ? ` (Dư: -${formatMoney(Math.abs(found.finalDebt))}đ)` : ' (Hòa 0đ)')) : '';
                      return (
                        <option key={c} value={c} className="bg-[#121214] text-white">
                          CTV: {c} {debtStr}
                        </option>
                      );
                    })}
                  </select>
                </div>

                {/* 2. Loại Giao Dịch */}
                <div>
                  <label className="text-[11px] font-black uppercase text-zinc-300 tracking-wider mb-1.5 block">
                    2. Hướng Thanh Toán <b className="text-rose-400">*</b>
                  </label>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={() => setQuickPayType('CTV THANH TOÁN')}
                      className={`p-2.5 rounded-xl border text-left transition-all cursor-pointer flex items-center gap-2 ${
                        quickPayType === 'CTV THANH TOÁN'
                          ? 'bg-rose-500/20 border-rose-500 text-rose-300 shadow-md font-bold'
                          : 'bg-[#18181b] border-white/[0.08] text-zinc-400 hover:text-white'
                      }`}
                    >
                      <i className="fas fa-money-bill-transfer text-rose-400"></i>
                      <div className="min-w-0">
                        <div className="text-[11px] font-bold">CTV Trả Cho Xưởng</div>
                        <div className="text-[9px] text-zinc-400">Giảm số nợ của CTV (-)</div>
                      </div>
                    </button>

                    <button
                      type="button"
                      onClick={() => setQuickPayType('XƯỞNG THANH TOÁN')}
                      className={`p-2.5 rounded-xl border text-left transition-all cursor-pointer flex items-center gap-2 ${
                        quickPayType === 'XƯỞNG THANH TOÁN'
                          ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300 shadow-md font-bold'
                          : 'bg-[#18181b] border-white/[0.08] text-zinc-400 hover:text-white'
                      }`}
                    >
                      <i className="fas fa-credit-card text-emerald-400"></i>
                      <div className="min-w-0">
                        <div className="text-[11px] font-bold">Xưởng Trả Cho CTV</div>
                        <div className="text-[9px] text-zinc-400">Trả hoa hồng / thừa COD (+)</div>
                      </div>
                    </button>
                  </div>
                </div>

                {/* 3. Số Tiền Thanh Toán */}
                <div>
                  <label className="text-[11px] font-black uppercase text-zinc-300 tracking-wider mb-1.5 flex items-center justify-between">
                    <span>3. Số Tiền Quyết Toán (VNĐ) <b className="text-rose-400">*</b></span>
                    {quickPayUser && (
                      <button
                        type="button"
                        onClick={() => {
                          const found = ctvDebtBreakdown.find(c => c.user === quickPayUser);
                          if (found) setQuickPayAmount(String(Math.abs(found.finalDebt)));
                        }}
                        className="text-[10px] text-[#d4af37] hover:underline font-bold"
                      >
                        Điền tất toán đủ số dư
                      </button>
                    )}
                  </label>
                  <div className="relative">
                    <input
                      type="text"
                      value={quickPayAmount ? Number(quickPayAmount.replace(/[^\d]/g, '')).toLocaleString('vi-VN') : ''}
                      onChange={(e) => setQuickPayAmount(e.target.value.replace(/[^\d]/g, ''))}
                      placeholder="Nhập số tiền..."
                      className="w-full bg-[#18181b] border border-amber-500/40 rounded-xl px-3.5 py-3 text-base font-mono font-black text-amber-400 outline-none focus:border-amber-400 shadow-inner"
                    />
                    <span className="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-bold text-zinc-500">VNĐ</span>
                  </div>
                </div>

                {/* 4. Tài Khoản Quỹ (Tùy Chọn Liên Kết Sổ Quỹ) */}
                {Array.isArray(erpData?.Accounts) && erpData.Accounts.length > 0 && (
                  <div>
                    <label className="text-[11px] font-black uppercase text-zinc-400 tracking-wider mb-1.5 flex items-center justify-between">
                      <span>4. Tài Khoản Quỹ / Ngân Hàng (Tùy chọn)</span>
                      <span className="text-[9px] text-zinc-500">Tự động ghi Sổ Quỹ</span>
                    </label>
                    <select
                      value={quickPayAccount}
                      onChange={(e) => setQuickPayAccount(e.target.value)}
                      className="w-full bg-[#18181b] border border-white/[0.1] rounded-xl px-3 py-2 text-xs font-medium text-zinc-200 outline-none focus:border-[#d4af37] cursor-pointer"
                    >
                      <option value="">-- Chỉ ghi nhận Sổ CTV (Không ghi Sổ Quỹ chính) --</option>
                      {erpData.Accounts.map(acc => (
                        <option key={acc.id} value={acc.accountName || acc.id}>
                          {acc.accountName || acc.id} ({formatMoney(acc.balance || 0)}đ)
                        </option>
                      ))}
                    </select>
                  </div>
                )}

                {/* 5. Ghi Chú */}
                <div>
                  <label className="text-[11px] font-black uppercase text-zinc-400 tracking-wider mb-1.5 block">
                    5. Ghi Chú Quyết Toán
                  </label>
                  <input
                    type="text"
                    value={quickPayNote}
                    onChange={(e) => setQuickPayNote(e.target.value)}
                    placeholder="Nhập ghi chú giao dịch..."
                    className="w-full bg-[#18181b] border border-white/[0.1] rounded-xl px-3 py-2 text-xs text-zinc-200 outline-none focus:border-[#d4af37]"
                  />
                </div>
              </div>
            </div>

            {/* Footer Modal */}
            <div className="p-3.5 sm:p-4 border-t border-white/[0.08] bg-[#121214] flex items-center justify-end gap-2.5 shrink-0">
              <button
                type="button"
                onClick={() => setShowQuickPayModal(false)}
                className="px-4 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white text-xs font-bold transition-all cursor-pointer"
              >
                Hủy Bỏ
              </button>

              <button
                type="button"
                onClick={handleConfirmQuickPayment}
                disabled={isProcessing || !quickPayUser || Number(quickPayAmount) <= 0}
                className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-[#d4af37] to-amber-500 hover:from-amber-400 hover:to-amber-500 text-black font-black text-xs uppercase tracking-wider flex items-center gap-2 shadow-lg active:scale-95 transition-all cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
              >
                {isProcessing ? (
                  <>
                    <i className="fas fa-spinner fa-spin"></i>
                    <span>Đang Ghi Sổ...</span>
                  </>
                ) : (
                  <>
                    <i className="fas fa-check-circle"></i>
                    <span>Xác Nhận & Ghi Sổ Ngay</span>
                  </>
                )}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// =========================================================================
// 🔍 COMPONENT: MODAL XEM TOÀN BỘ THÔNG TIN & TRẠNG THÁI ĐƠN HÀNG
// =========================================================================
function AffiliateOrderDetailModal({ order, onClose, onEdit, prodItems, packings, ctvTxs, getOrderExtraExpenses, getOrderDebtValue, formatMoney, triggerToast, userConfigs }) {
    const [selectedPhoto, setSelectedPhoto] = React.useState(null);

    if (!order) return null;

    const extraExp = getOrderExtraExpenses(order);
    const orderDebtVal = getOrderDebtValue(order);

    // Trích xuất mã vận đơn
    const fullText = `${order.accessories || ''} ${order.note || ''} ${order.orderCode || ''} ${order.shippingCode || ''}`;
    const mvdMatch = fullText.match(/(GY[0-9A-Z]{5,12}|GHN[0-9A-Z]{4,12}|L[0-9A-Z]{6,15}|0[0-9]{9,10})/i);
    const mvd = mvdMatch ? mvdMatch[0] : (order.shippingCode || '');

    // Link tra cứu
    let trackingUrl = '';
    if (mvd) {
        if (mvd.toUpperCase().startsWith('GY') || mvd.toUpperCase().startsWith('GHN')) {
            trackingUrl = `https://donhang.ghn.vn/?order_code=${mvd}`;
        } else if (mvd.toUpperCase().startsWith('L')) {
            trackingUrl = `https://spx.vn/track?bill_no=${mvd}`;
        }
    }

    // Chuẩn hóa trạng thái
    const s = String(order.status || '').toUpperCase().trim();
    const isReconciled = order.isReconciled || Boolean(order.reconciledAt) || s.includes('ĐỐI SOÁT');
    const isHandedOver = s === 'ĐÃ BÀN GIAO' || s === 'ĐÃ GIAO';
    const isReturned = s.includes('HOÀN');
    const isCanceled = s.includes('HUỶ') || s.includes('HỦY');

    let badgeClass = 'bg-[#27272a] text-zinc-300 border-white/[0.08]';
    let badgeText = order.status || 'Chờ Sản Xuất';
    let badgeIcon = 'fa-clock';

    if (isReconciled) {
        badgeClass = 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30';
        badgeText = 'Đối Soát Thành Công';
        badgeIcon = 'fa-check-double';
    } else if (isHandedOver) {
        badgeClass = 'bg-sky-500/15 text-sky-400 border-sky-500/30';
        badgeText = 'Đã Bàn Giao';
        badgeIcon = 'fa-truck-fast';
    } else if (isReturned) {
        badgeClass = 'bg-rose-500/15 text-rose-400 border-rose-500/30';
        badgeText = 'Hàng Hoàn';
        badgeIcon = 'fa-rotate-left';
    } else if (isCanceled) {
        badgeClass = 'bg-zinc-800 text-zinc-400 border-white/10';
        badgeText = 'Đơn Huỷ';
        badgeIcon = 'fa-ban';
    }

    // Sản phẩm sản xuất
    const relatedProds = (prodItems || []).filter(p => {
        const pOrd = String(p.orderId || '').trim();
        const oId = String(order.id || '').trim();
        const oCode = String(order.orderCode || '').trim();
        return pOrd && (pOrd === oId || pOrd === oCode);
    });

    // Phụ kiện
    let parsedAccessories = [];
    try {
        if (Array.isArray(order.accessories)) parsedAccessories = order.accessories;
        else if (typeof order.accessories === 'string' && order.accessories.trim().startsWith('[')) {
            parsedAccessories = JSON.parse(order.accessories);
        }
    } catch (e) {
        parsedAccessories = [];
    }

    // Đóng gói
    const relatedPackings = (packings || []).filter(p => {
        const pOrd = String(p.orderId || '').trim();
        const oId = String(order.id || '').trim();
        const oCode = String(order.orderCode || '').trim();
        return pOrd && (pOrd === oId || pOrd === oCode);
    });

    // Giao dịch phụ phí gắn đơn
    const code = String(order.orderCode || '').toLowerCase();
    const cust = String(order.customer || '').toLowerCase();
    const id = String(order.id || '').toLowerCase();
    const relatedTxs = (ctvTxs || []).filter(t => {
        const note = String(t.note || '').toLowerCase();
        return (code && note.includes(code)) || (id && note.includes(id)) || (cust && note.includes(cust));
    });

    const copyText = (txt, label) => {
        if (!txt) return;
        navigator.clipboard.writeText(txt).then(() => {
            if (triggerToast) triggerToast(`Đã copy ${label || ''}: ${txt}`, 'fa-copy', 'success');
        });
    };

    return (
        <div className="fixed inset-0 bg-black/80 z-[99999] flex items-center justify-center p-2.5 sm:p-4 backdrop-blur-md animate-fade-in">
            <div className="bg-[#121214] border border-white/[0.1] w-full max-w-3xl max-h-[92vh] rounded-2xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden text-white relative">
                
                {/* 1. MODAL HEADER */}
                <div className="p-4 sm:p-5 border-b border-white/[0.08] flex items-center justify-between bg-gradient-to-r from-[#18181b] to-[#121214] shrink-0">
                    <div className="flex items-center gap-3 min-w-0">
                        <div className="w-10 h-10 rounded-xl bg-[#d4af37]/15 border border-[#d4af37]/30 flex items-center justify-center text-[#d4af37] shrink-0 text-base shadow-sm">
                            <i className="fas fa-file-invoice"></i>
                        </div>
                        <div className="min-w-0">
                            <div className="flex items-center gap-2 flex-wrap">
                                <h2 className="text-sm sm:text-base font-black text-white truncate">
                                    {order.customer || 'Khách Hàng'}
                                </h2>
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md border flex items-center gap-1 ${badgeClass}`}>
                                    <i className={`fas ${badgeIcon} text-[9px]`}></i>
                                    <span>{badgeText}</span>
                                </span>
                            </div>
                            <div className="text-[11px] text-zinc-400 font-mono flex items-center gap-2 mt-0.5">
                                <span>Mã: <b className="text-zinc-200">{order.orderCode || order.id}</b></span>
                                <button onClick={() => copyText(order.orderCode || order.id, 'Mã đơn')} className="text-zinc-500 hover:text-[#d4af37]">
                                    <i className="fas fa-copy text-[10px]"></i>
                                </button>
                                {mvd && (
                                    <>
                                        <span>•</span>
                                        <span>MVĐ: <b className="text-amber-400">{mvd}</b></span>
                                        <button onClick={() => copyText(mvd, 'Mã vận đơn')} className="text-zinc-500 hover:text-amber-400">
                                            <i className="fas fa-copy text-[10px]"></i>
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>

                    <button
                        onClick={onClose}
                        className="w-8 h-8 rounded-full bg-white/[0.05] hover:bg-white/[0.1] text-zinc-400 hover:text-white flex items-center justify-center transition-all cursor-pointer shrink-0"

                        <i className="fas fa-times text-sm"></i>
                    </button>
                </div>

                {/* 2. MODAL BODY */}
                <div className="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-5 space-y-4 text-xs">
                    
                    {/* BENTO ROW 1: TỔNG QUAN TÀI CHÍNH & DƯ NỢ */}
                    <div className={`p-4 rounded-2xl border transition-all ${

                            </span>
                            <div className={`text-sm sm:text-base font-black font-mono ${
                                orderDebtVal > 0 ? 'text-rose-400' : (orderDebtVal < 0 ? 'text-emerald-400' : 'text-zinc-400')

                    </div>

                    {/* BENTO ROW 2: THÔNG TIN GIAO HÀNG & KHÁCH HÀNG */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div className="bg-[#121214] border border-white/[0.08] rounded-2xl p-3.5 space-y-2">
                            <div className="text-[11px] font-black uppercase tracking-wider text-zinc-400 flex items-center gap-1.5 border-b border-white/[0.08] pb-1.5">

                                <div>
                                    <span className="text-zinc-400 block mb-0.5">Địa chỉ:</span>
                                    <div className="text-zinc-200 bg-[#121214] p-2 rounded-lg border border-white/[0.08] leading-relaxed">
                                        {order.address || 'Không có địa chỉ cụ thể'}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-[#121214] border border-white/[0.08] rounded-2xl p-3.5 space-y-2">
                            <div className="text-[11px] font-black uppercase tracking-wider text-zinc-400 flex items-center gap-1.5 border-b border-white/[0.08] pb-1.5">
                                <i className="fas fa-truck-fast text-amber-400"></i> Vận Chuyển & Giao Vận
                            </div>
                            <div className="space-y-1.5 text-[11px]">
                                <div className="flex justify-between">
                                    <span className="text-zinc-400">Phương thức:</span>
                                    <span className="font-bold text-zinc-100">{order.shippingMethod || 'Gửi GHN / Tiêu Chuẩn'}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-zinc-400">Mã vận đơn:</span>
                                    {mvd ? (
                                        <div className="flex items-center gap-1.5">
                                            <span className="font-mono font-bold text-amber-400 bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-500/20">{mvd}</span>
                                            {trackingUrl && (
                                                <a href={trackingUrl} target="_blank" rel="noreferrer" className="text-xs text-sky-400 hover:text-sky-300" title="Tra cứu hành trình">
                                                    <i className="fas fa-external-link-alt"></i>
                                                </a>
                                            )}
                                        </div>
                                    ) : <span className="text-zinc-500 italic">Chưa có MVĐ</span>}
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-zinc-400">Ngày đặt:</span>
                                    <span className="font-mono text-zinc-200">{order.date || order.createdAt || 'Chưa rõ'}</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-zinc-400">Đối soát:</span>
                                    <span className={`font-semibold ${order.isReconciled ? 'text-emerald-400' : 'text-zinc-400'}`}>
                                        {order.isReconciled ? `Đã đối soát ${order.reconciledAt ? `(${order.reconciledAt})` : ''}` : 'Chưa đối soát'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* BENTO ROW 3: TIẾN ĐỘ SẢN XUẤT */}
                    {relatedProds.length > 0 && (
                        <div className="bg-[#121214] border border-white/[0.08] rounded-2xl p-3.5 space-y-3">
                            <div className="text-[11px] font-black uppercase tracking-wider text-zinc-400 flex items-center justify-between border-b border-white/[0.08] pb-2">
                                <span className="flex items-center gap-1.5">
                                    <i className="fas fa-hammer text-[#d4af37]"></i> Tiến Độ Sản Xuất & Kiểm Định ({relatedProds.length})
                                </span>
                            </div>

                            <div className="space-y-3">
                                {relatedProds.map((p, idx) => (
                                    <div key={p.id || idx} className="bg-[#121214] border border-white/[0.08] rounded-xl p-3 space-y-2.5">
                                        <div className="flex items-center justify-between">
                                            <span className="font-bold text-white text-xs">{p.name || 'Layout Sản Xuất'}</span>
                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                                                p.status === 'Done' || p.status === 'Hoàn Kho Đạt' ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/15 text-amber-400 border border-amber-500/30'
                                            }`}>
                                                {p.status || 'Chờ SX'}
                                            </span>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-[10px]">
                                            <div className="bg-[#121214] p-2 rounded-lg border border-white/[0.08] space-y-1">
                                                <div className="font-bold text-zinc-300 flex justify-between">
                                                    <span>Khâu 1 (Khung/Phôi)</span>
                                                    <span className={p.p1_status === 'Done' ? 'text-emerald-400' : 'text-zinc-500'}>{p.p1_status || 'Pending'}</span>
                                                </div>
                                                <div className="text-zinc-400">Thợ: <b className="text-zinc-200">{p.p1_user || '—'}</b></div>
                                                {p.p1_photo && (
                                                    <img 
                                                        src={p.p1_photo} 
                                                        alt="Ảnh K1" 
                                                        className="w-full h-16 object-cover rounded border border-white/10 mt-1 cursor-pointer hover:opacity-80 transition-opacity"
                                                        onClick={() => setSelectedPhoto(p.p1_photo)}
                                                    />
                                                )}
                                            </div>

                                            <div className="bg-[#121214] p-2 rounded-lg border border-white/[0.08] space-y-1">
                                                <div className="font-bold text-zinc-300 flex justify-between">
                                                    <span>Khâu 2 (Gắn rêu)</span>
                                                    <span className={p.p2_status === 'Done' ? 'text-emerald-400' : 'text-zinc-500'}>{p.p2_status || 'Pending'}</span>
                                                </div>
                                                <div className="text-zinc-400">Thợ: <b className="text-zinc-200">{p.p2_user || '—'}</b></div>
                                                {p.p2_photo && (
                                                    <img 
                                                        src={p.p2_photo} 
                                                        alt="Ảnh K2" 
                                                        className="w-full h-16 object-cover rounded border border-white/10 mt-1 cursor-pointer hover:opacity-80 transition-opacity"
                                                        onClick={() => setSelectedPhoto(p.p2_photo)}
                                                    />
                                                )}
                                            </div>

                                            <div className="bg-[#121214] p-2 rounded-lg border border-white/[0.08] space-y-1">
                                                <div className="font-bold text-zinc-300 flex justify-between">
                                                    <span>KCS Kiểm Định</span>
                                                    <span className={p.qc_status === 'Passed' || p.qc_status === 'Done' ? 'text-emerald-400' : 'text-zinc-500'}>{p.qc_status || 'Chờ'}</span>
                                                </div>
                                                <div className="text-zinc-400 truncate">Note: {p.qc_note || '—'}</div>
                                                {(p.qc_front_photo || p.qc_side_photo) && (
                                                    <div className="flex gap-1 mt-1">
                                                        {p.qc_front_photo && <img src={p.qc_front_photo} alt="KCS Mặt" className="w-1/2 h-16 object-cover rounded border border-white/10 cursor-pointer" onClick={() => setSelectedPhoto(p.qc_front_photo)} />}
                                                        {p.qc_side_photo && <img src={p.qc_side_photo} alt="KCS Hông" className="w-1/2 h-16 object-cover rounded border border-white/10 cursor-pointer" onClick={() => setSelectedPhoto(p.qc_side_photo)} />}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* BENTO ROW 4: ĐÓNG GÓI */}
                    {relatedPackings.length > 0 && (
                        <div className="bg-[#121214] border border-white/[0.08] rounded-2xl p-3.5 space-y-3">
                            <div className="text-[11px] font-black uppercase tracking-wider text-zinc-400 flex items-center justify-between border-b border-white/[0.08] pb-2">
                                <span className="flex items-center gap-1.5">
                                    <i className="fas fa-box-open text-sky-400"></i> Đóng Gói & Xuất Kho ({relatedPackings.length})
                                </span>
                            </div>

                            <div className="space-y-2">
                                {relatedPackings.map((pk, i) => {
                                    const pStr = pk.photo || '';
                                    const parts = pStr.includes('||') ? pStr.split('||') : [pStr];
                                    const goodsImg = pk.photoBefore || parts[0];
                                    const boxImg = parts.length > 1 ? parts[1] : (pk.photoBefore ? pk.photo : '');

                                    return (
                                        <div key={pk.id || i} className="bg-[#121214] border border-white/[0.08] p-3 rounded-xl space-y-2">
                                            <div className="flex items-center justify-between text-[11px]">
                                                <span>Nhân sự đóng: <b className="text-white">{pk.user || 'Nhân sự'}</b></span>
                                                <span className="text-emerald-400 font-bold bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                                                    {pk.status || 'Đã đóng gói'}
                                                </span>
                                            </div>
                                            {(goodsImg || boxImg) && (
                                                <div className="grid grid-cols-2 gap-2 pt-1">
                                                    {goodsImg && (
                                                        <img 
                                                            src={goodsImg} 
                                                            alt="Ảnh bọc hàng" 
                                                            className="w-full h-24 object-cover rounded-lg border border-white/10 cursor-pointer hover:opacity-80" 
                                                            onClick={() => setSelectedPhoto(goodsImg)}
                                                        />
                                                    )}
                                                    {boxImg && (
                                                        <img 
                                                            src={boxImg} 
                                                            alt="Ảnh thùng hàng" 
                                                            className="w-full h-24 object-cover rounded-lg border border-white/10 cursor-pointer hover:opacity-80" 
                                                            onClick={() => setSelectedPhoto(boxImg)}
                                                        />
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>

                {/* 3. MODAL FOOTER */}
                <div className="p-3.5 sm:p-4 border-t border-white/[0.08] bg-[#121214] flex items-center justify-between gap-2 shrink-0">
                    <div className="flex items-center gap-2">
                        {onEdit && (
                            <button
                                onClick={() => { onClose(); onEdit(order); }}
                                className="px-3 py-1.5 rounded-xl bg-[#27272a] hover:bg-zinc-700 text-zinc-200 text-xs font-bold flex items-center gap-1.5 transition-all cursor-pointer"
                            >
                                <i className="fas fa-edit text-[10px]"></i> Chỉnh Sửa
                            </button>
                        )}
                    </div>
                    <button
                        onClick={onClose}
                        className="px-4 py-1.5 rounded-xl bg-white/[0.08] hover:bg-white/[0.15] text-white text-xs font-bold transition-all cursor-pointer"
                    >
                        Đóng
                    </button>
                </div>

                {/* PHOTO FULLSCREEN PREVIEW MODAL */}
                {selectedPhoto && (
                    <div className="fixed inset-0 bg-black/95 z-[100000] flex items-center justify-center p-4 backdrop-blur-xl animate-fade-in" onClick={() => setSelectedPhoto(null)}>
                        <div className="relative max-w-4xl max-h-[90vh] flex flex-col items-center">
                            <img src={selectedPhoto} alt="Xem ảnh phóng to" className="max-w-full max-h-[85vh] object-contain rounded-xl border border-white/20 shadow-2xl" />
                            <button onClick={() => setSelectedPhoto(null)} className="mt-3 px-3 py-1 bg-rose-500/20 hover:bg-rose-500 text-rose-300 hover:text-white rounded-lg text-xs font-bold">
                                Đóng ảnh
                            </button>
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
}

if (typeof window !== 'undefined') {
    window.TabAffiliate = TabAffiliate;
}
</script>
