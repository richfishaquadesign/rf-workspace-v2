<script type="text/babel">
    // =========================================================================
    // 📦 FILE: Modals_Orders.txt
    // CHỨC NĂNG: Các khối giao diện phức tạp dành riêng cho nghiệp vụ Đơn Hàng
    // BAO GỒM: Trạm bơm Excel, Form Tạo đơn thông minh, Thẻ hiển thị đơn hàng (OrderCard)
    // =========================================================================

    const showCopyModal = (msg) => {
        const overlay = document.createElement('div');
        overlay.className = 'fixed inset-0 bg-black/80 z-[99999] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in';

        const box = document.createElement('div');
        box.className = 'bg-[#141414] border border-[#333] w-full max-w-sm rounded-[24px] p-5 shadow-2xl flex flex-col gap-4 text-center';

        const icon = document.createElement('div');
        icon.className = 'w-12 h-12 mx-auto bg-blue-500/20 text-blue-500 rounded-full flex items-center justify-center text-xl mb-1';
        icon.innerHTML = '<i class="fas fa-paper-plane"></i>';

        const text = document.createElement('div');
        text.className = 'text-[13px] text-gray-200 bg-[#0a0a0a] border border-[#222] p-4 rounded-xl leading-relaxed text-left';
        text.innerText = msg;

        const btn = document.createElement('button');
        btn.className = 'w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl uppercase tracking-wider transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95 text-[12px]';
        btn.innerHTML = '📋 COPY ĐỂ GỬI KHÁCH';

        btn.onclick = () => {
            navigator.clipboard.writeText(msg).then(() => {
                btn.innerHTML = '✅ Đã Copy!';
                btn.className = 'w-full py-3 bg-emerald-500 text-white font-black rounded-xl uppercase tracking-wider transition-all flex items-center justify-center gap-2 shadow-lg text-[12px]';
                setTimeout(() => {
                    if (document.body.contains(overlay)) document.body.removeChild(overlay);
                }, 1500);
            }).catch(err => {
                alert('Lỗi copy: ' + err);
            });
        };

        const closeBtn = document.createElement('button');
        closeBtn.className = 'absolute top-3 right-3 w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-white flex items-center justify-center';
        closeBtn.innerHTML = '<i class="fas fa-times"></i>';
        closeBtn.onclick = () => document.body.removeChild(overlay);

        box.style.position = 'relative';
        box.appendChild(closeBtn);
        box.appendChild(icon);
        box.appendChild(text);
        box.appendChild(btn);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
    };
    const parseCoverFromNote = (noteStr) => {
        if (!noteStr || noteStr.indexOf('Cover:') === -1) return { coverUrl: null, cleanNote: noteStr || '' };
        const parts = noteStr.split('|');
        const cleanParts = [];
        let coverUrl = null;
        for (let k = 0; k < parts.length; k++) {
            const p = parts[k].trim();
            if (p.indexOf('Cover:') === 0) {
                coverUrl = p.replace('Cover:', '').trim();
            } else if (p) {
                cleanParts.push(p);
            }
        }
        return { coverUrl, cleanNote: cleanParts.join(' | ').trim() };
    };

    function SafeCoverImagePreview({ file, fallbackUrl }) {
        const [previewUrl, setPreviewUrl] = React.useState('');

        React.useEffect(() => {
            if (file && typeof URL !== 'undefined' && URL.createObjectURL) {
                const url = URL.createObjectURL(file);
                setPreviewUrl(url);
                return () => {
                    try { URL.revokeObjectURL(url); } catch (e) {}
                };
            } else {
                setPreviewUrl(fallbackUrl || '');
            }
        }, [file, fallbackUrl]);

        if (!previewUrl) return null;

        return (
            <div className="mt-1 w-12 h-12 rounded bg-black overflow-hidden border border-[#10b981]/50">
                <img src={previewUrl} className="w-full h-full object-cover" alt="Cover Preview" />
            </div>
        );
    }

    // ==========================================
    // 0. CÁC HÀM TRA CỨU & PHÂN LOẠI NGHIỆP VỤ ĐƠN HÀNG DÙNG CHUNG TOÀN HỆ THỐNG
    // ==========================================
    
    // RULE: Exact Match Status theo yêu cầu 
    const mapOrderStatusExact = (raw) => {
        if (!raw) return null;
        const s = String(raw).trim().toLowerCase();
        if (s === 'hoàn thành' || s === 'đã hoàn thành' || s === 'completed') return 'Đối Soát Thành Công';
        if (s === 'đã giao' || s === 'đã giao thành công' || s === 'delivered' || s.includes('người mua xác nhận đã nhận được hàng') || s.includes('đã nhận được hàng')) return 'Đã Bàn Giao';
        if (s === 'hoàn trả' || s === 'trả hàng' || s === 'trả hàng/hoàn tiền' || s === 'trả hàng / hoàn tiền' || s === 'hàng hoàn' || s === 'returned' || s === 'return/refund' || s.includes('giao hàng thất bại') || s.includes('giao hàng không thành công') || s.includes('từ chối nhận')) return 'Hàng Hoàn';
        if (s === 'đã hủy' || s === 'đã huỷ' || s === 'cancelled' || s === 'canceled') return 'Đơn Huỷ';
        return null; // Mọi trạng thái khác (Default) => rơi xuống fallback
    };
    if (typeof window !== 'undefined') window.mapOrderStatusExact = mapOrderStatusExact;

    // RULE: Phân loại chính xác mặt hàng Sản Xuất (CHỈ BỂ KÍNH và LAYOUT thành phẩm là hàng sản xuất, KHO NGUYÊN LIỆU & PHỤ KIỆN là phụ kiện/hàng hoá bán lẻ)
    const checkProductionItemType = (item, catalogProducts) => {
        if (!item || !item.name) return { isProd: false, isGlass: false, isLayout: false, isBeLeSize: false, type: 'Phụ Kiện', matchedProd: null };
        
        const normName = (s) => String(s || '').trim().toLowerCase().replace(/[\u2010-\u2015\u2212-]/g, '-').replace(/\s+/g, ' ');
        const targetNorm = normName(item.name);
        let matchedItem = item.matchedProd || (catalogProducts || []).find(p => normName(p.name) === targetNorm);
        if (!matchedItem && item.sku) {
            const targetSku = String(item.sku).trim().toUpperCase();
            const targetClean = targetSku.replace(/[^A-Z0-9]/g, '');
            matchedItem = (catalogProducts || []).find(p => {
                const pSku = String(p.sku || '').trim().toUpperCase();
                if (pSku && pSku === targetSku) return true;
                const pClean = pSku.replace(/[^A-Z0-9]/g, '');
                if (pClean && targetClean && pClean === targetClean) return true;
                return false;
            });
        }
        
        if (matchedItem) {
            const cat = String(matchedItem.category || '').toUpperCase().trim();
            const subCat = String(matchedItem.sub_category || '').toUpperCase().trim();
            
            // 1. RÀO CHẮN TUYỆT ĐỐI (POKA-YOKE): Nhóm Nguyên Liệu, Vật Tư, Phụ Kiện, Hàng Hoá -> 100% là Phụ Kiện, KHÔNG BAO GIỜ là Sản Xuất
            const isRawMaterialOrAccessory = 
                cat === 'DANH MỤC SẢN XUẤT' || cat === 'NGUYÊN LIỆU' || cat === 'VẬT TƯ SẢN XUẤT' || cat === 'PHỤ KIỆN' || cat === 'HÀNG HOÁ' ||
                subCat === 'NGUYÊN LIỆU LAYOUT' || subCat === 'NGUYÊN LIỆU BỂ KÍNH' || subCat === 'NGUYÊN LIỆU ĐÓNG GÓI' || subCat === 'VẬT TƯ SẢN XUẤT' ||
                ['CÁT, PHÂN NỀN', 'BƠM LỌC', 'VẬT LIỆU LỌC', 'ĐÈN LED', 'THỨC ĂN', 'PHỤ KIỆN KHÁC'].includes(subCat);
            
            if (isRawMaterialOrAccessory) {
                return {
                    isProd: false,
                    isGlass: false,
                    isLayout: false,
                    isBeLeSize: false,
                    type: 'Phụ Kiện',
                    matchedProd: matchedItem
                };
            }

            // 2. Kiểm tra BỂ KÍNH Thành Phẩm
            const isGlassCat = cat === 'BỂ KÍNH' || subCat === 'BỂ KÍNH' || ['BỂ MINI', 'TERRARIUM', 'BÁN CẠN', 'BỂ BETTA', 'BỂ NÂNG ĐÁY', 'BỂ LẺ SIZE', 'BE LE SIZE'].includes(subCat) ||
                String(matchedItem.name || '').toLowerCase().includes('bể kính') || String(matchedItem.name || '').toLowerCase().includes('hồ kính') ||
                String(matchedItem.sku || '').toUpperCase().startsWith('BK-') || String(matchedItem.sku || '').toUpperCase().startsWith('BE');
            const isBeLeSize = subCat === 'BỂ LẺ SIZE' || subCat === 'BE LE SIZE' || String(matchedItem.name || '').toUpperCase().includes('BỂ LẺ SIZE') || (cat === 'BỂ KÍNH' && (!subCat || subCat === 'KHÁC' || subCat === 'BỂ LẺ SIZE'));
            if (isGlassCat) {
                return {
                    isProd: true,
                    isGlass: true,
                    isLayout: false,
                    isBeLeSize: isBeLeSize,
                    type: 'Bể Kính',
                    matchedProd: matchedItem
                };
            }

            // 3. Kiểm tra LAYOUT Thành Phẩm
            const isLayoutCat = (cat === 'LAYOUT' || cat === 'THÀNH PHẨM' || cat.includes('LAYOUT') || cat.includes('RỪNG')) ||
                ['LINH THÚ', 'VÁCH SUỐI', 'HẺM NÚI', 'NATURE', 'NHẤT TRỤ', 'TRĂNG', 'BONSAI', 'CẦU VỒNG', 'BIOTOP CUỘI', 'HANG ĐỘNG', 'RỪNG', 'ĐẢO BAY', 'CỔNG VÒM', 'COVER'].includes(subCat) ||
                String(matchedItem.name || '').toLowerCase().includes('layout') || String(matchedItem.name || '').toLowerCase().includes('rừng') ||
                String(matchedItem.sku || '').toUpperCase().startsWith('LAY-') ||
                String(matchedItem.sku || '').toUpperCase().startsWith('RUN-') || String(matchedItem.sku || '').toUpperCase().startsWith('NAT-') ||
                String(matchedItem.sku || '').toUpperCase().startsWith('SAN-') || String(matchedItem.sku || '').toUpperCase().startsWith('CV-');
            if (isLayoutCat) {
                return {
                    isProd: true,
                    isGlass: false,
                    isLayout: true,
                    isBeLeSize: false,
                    type: 'Layout',
                    matchedProd: matchedItem
                };
            }
        }

        // FALLBACK QUÉT TỪ KHÓA: Chỉ khi mặt hàng KHÔNG CÓ trong CSDL Products
        const lname = String(item.name || '').toLowerCase();
        
        // A. Loại trừ ngay nếu có từ khóa quy cách / phụ kiện / nguyên liệu
        const isExclusion = 
            /\b(1kg|2kg|3kg|5kg|10kg|500g|200g|100g|50g|10g|kg|gam|gram|gr|ml|lít|bao|túi|bịch|gói|chai|lọ|hộp|cuộn|tuýp|vỉ)\b/i.test(lname) ||
            lname.includes('đá cuội') || lname.includes('đá tai mèo') || lname.includes('đá vỉa') || lname.includes('đá đen') || lname.includes('đá kẹp kem') || lname.includes('đá tiger') || lname.includes('đá trầm tích') || lname.includes('đá nham thạch') ||
            lname.includes('sạn suối') || lname.includes('cát nắng vàng') || lname.includes('cát trắng') || lname.includes('phân nền') || lname.includes('rễ rừng') ||
            lname.includes('lũa san đá') || lname.includes('lũa nhọ nồi') || lname.includes('lũa hải sơn') || lname.includes('lũa linh sam') || lname.includes('lũa xương chùm') || lname.includes('lũa vụn') || lname.includes('lũa lẻ') ||
            lname.includes('lọc') || lname.includes('bơm') || lname.includes('đèn') || lname.includes('keo') || lname.includes('bông') || lname.includes('vi sinh') || lname.includes('khử clo') || lname.includes('thức ăn') || lname.includes('sứ lọc') || lname.includes('matrix') || lname.includes('purigen') || lname.includes('rêu giả') || lname.includes('cây nhựa') || lname.includes('sưởi') || lname.includes('decan') || lname.includes('decal') || lname.includes('bột xốp');
        
        // Poka-Yoke Rào chắn tuyệt đối: Nếu là phụ kiện / tiêu hao / nguyên liệu rời thì 100% là Phụ Kiện, kể cả khi tên có chữ "layout" hoặc "bể cá"
        const isPureAccessory = lname.includes('đèn') || lname.includes('lọc') || lname.includes('bơm') || lname.includes('rêu giả') || lname.includes('bột xốp') || lname.includes('decan') || lname.includes('decal') || lname.includes('keo') || lname.includes('sưởi') || lname.includes('thức ăn') || lname.includes('vi sinh') || lname.includes('khử clo') || /\b(1kg|2kg|3kg|5kg|500g|200g|100g|gói|túi|bịch|chai|lọ|cuộn)\b/i.test(lname);
        
        if (isPureAccessory || (isExclusion && !lname.includes('khung layout') && !lname.includes('bộ layout') && !lname.includes('layout thủy sinh'))) {
            return {
                isProd: false,
                isGlass: false,
                isLayout: false,
                isBeLeSize: false,
                type: 'Phụ Kiện',
                matchedProd: matchedItem || null
            };
        }

        // B. Quét từ khóa BỂ KÍNH Thành Phẩm
        const glassKeywords = ['bể kính', 'bể đúc', 'bể dán', 'bể siêu trong', 'hồ kính', 'hồ siêu trong', 'bể mini', 'bể betta', 'hồ bán cạn', 'bán cạn', 'terrarium', 'bể nâng đáy', 'bể lẻ size', 'bể cá', 'hồ cá'];
        const cleanLname = lname.replace(/[\-–—|_]+/g, ' ').replace(/\s+/g, ' ');
        const isGlassMatch = glassKeywords.some(kw => cleanLname.includes(kw)) || 
            (cleanLname.includes('bể') && (cleanLname.includes('nâng đáy') || cleanLname.includes('đáy') || cleanLname.includes('kích thước') || cleanLname.includes('mini') || cleanLname.includes('cm')));
        if (isGlassMatch) {
            const isBeLeSize = cleanLname.includes('bể lẻ size') || cleanLname.includes('lẻ size');
            return {
                isProd: true,
                isGlass: true,
                isLayout: false,
                isBeLeSize: isBeLeSize,
                type: 'Bể Kính',
                matchedProd: matchedItem || null
            };
        }

        // C. Quét từ khóa LAYOUT Thành Phẩm (Bắt buộc phải có chữ 'layout' hoặc 'khung layout' hoặc 'cover' hoặc 'ver')
        const layoutExplicitKeywords = ['layout', 'khung layout', 'bộ layout', 'cover lọc', 'tiểu cảnh bán cạn', 'ver.'];
        if (layoutExplicitKeywords.some(kw => lname.includes(kw))) {
            return {
                isProd: true,
                isGlass: false,
                isLayout: true,
                isBeLeSize: false,
                type: 'Layout',
                matchedProd: matchedItem || null
            };
        }

        return {
            isProd: false,
            isGlass: false,
            isLayout: false,
            isBeLeSize: false,
            type: 'Phụ Kiện',
            matchedProd: matchedItem || null
        };
    };
    if (typeof window !== 'undefined') window.checkProductionItemType = checkProductionItemType;

    // ==========================================
    // 1. MODAL BƠM ĐƠN EXCEL (TÍCH HỢP AI QUÉT KHO & BƠM LỆNH XƯỞNG + CHỐNG CRASH)
    // ==========================================
    function BulkImportModal({ onClose, pushDeltas, existingOrders, products, existingProdItems }) {
        const [preview, setPreview] = React.useState([]);
        const [isSubmitting, setIsSubmitting] = React.useState(false);
        const [isDragging, setIsDragging] = React.useState(false);
        const [fileName, setFileName] = React.useState('');
        const [isProcessing, setIsProcessing] = React.useState(false);
        const [progress, setProgress] = React.useState(0);

        const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate().replace('T', ' ') : new Date().toISOString().slice(0, 16).replace('T', ' ');

        const catalogIndex = React.useMemo(() => {
            const list = products || [];
            const skuExactMap = new Map();
            const skuCleanMap = new Map();
            const nameExactMap = new Map();
            const nameCleanMap = new Map();
            const sortedProds = [...list].sort((a, b) => String(b.name || '').length - String(a.name || '').length);

            // Pre-index cho từng sản phẩm (tính toán 1 lần duy nhất, tránh tính lại hàng triệu lần trong loop)
            const indexedProds = list.map(p => {
                const pSku = String(p.sku || '').trim().toUpperCase();
                const pName = String(p.name || '').trim().toUpperCase();
                const pSkuClean = pSku.replace(/[^A-Z0-9]/g, '');
                const pNameClean = pName.replace(/[^A-Z0-9]/g, '');
                const pFull = `${pSku.toLowerCase()} ${pName.toLowerCase()}`;
                const pClean = pFull.replace(/[^a-z0-9]/g, '');
                const normPName = pName.toLowerCase().replace(/[^a-z0-9àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ\s]/gi, ' ').replace(/\s+/g, ' ');

                if (pSku) {
                    skuExactMap.set(pSku, p);
                    if (pSkuClean) skuCleanMap.set(pSkuClean, p);
                }
                if (pName) {
                    nameExactMap.set(pName, p);
                    if (pNameClean) nameCleanMap.set(pNameClean, p);
                }

                return {
                    product: p,
                    pSku: pSku.toLowerCase(),
                    pName: pName.toLowerCase(),
                    pFull,
                    pClean,
                    normPName
                };
            });

            return { skuExactMap, skuCleanMap, nameExactMap, nameCleanMap, sortedProds, indexedProds };
        }, [products]);

        const matchProductFromCatalog = React.useCallback((targetSku, rawFullName, pName, pVar, parentSku) => {
            if (!products || !Array.isArray(products) || products.length === 0) return null;

            // 0. TRA CỨU NHANH TỪ BẢNG NHỚ ÁNH XẠ SKU (SKU ALIAS MEMORY)
            try {
                const rawAliases = localStorage.getItem('rf_sku_alias_map');
                if (rawAliases) {
                    const aliasMap = JSON.parse(rawAliases);
                    const searchKeys = [targetSku, parentSku, pVar, pName, rawFullName].filter(Boolean);
                    for (const k of searchKeys) {
                        const cleanK = String(k).trim();
                        const mappedSkuOrName = aliasMap[cleanK] || aliasMap[cleanK.toUpperCase()];
                        if (mappedSkuOrName) {
                            const found = (products || []).find(p => p.sku === mappedSkuOrName || p.name === mappedSkuOrName || (p.sku && p.sku.toUpperCase() === String(mappedSkuOrName).toUpperCase()));
                            if (found) return found;
                        }
                    }
                }
            } catch (e) { }

            // 1. TẬP HỢP TẤT CẢ SKU ỨNG VIÊN THEO THỨ TỰ ƯU TIÊN CAO ĐẾN THẤP
            const candidateSkus = [];

            const pushCandidate = (val) => {
                if (!val) return;
                const s = String(val).trim();
                if (!s || ['n/a', 'none', 'null', '-', 'undefined'].includes(s.toLowerCase())) return;
                if (!candidateSkus.includes(s)) candidateSkus.push(s);
            };

            const addCandidate = (val) => {
                if (!val) return;
                const s = String(val).trim();
                if (!s || ['n/a', 'none', 'null', '-', 'undefined'].includes(s.toLowerCase())) return;
                pushCandidate(s);

                // TỰ ĐỘNG CHUẨN HOÁ SANG HỆ SKU MỚI CỦA XƯỞNG (KHÔNG ĐỆ QUY)
                const normUpper = s.toUpperCase().replace(/\s+/g, '');
                
                // A. Nhóm Layout: RUN020-402325, BON01, NAT-011, CV202020, TRA-001... -> LAY-RUN020-402325, LAY-BON001-302020, LAY-STD001-202020-ST-02
                const layMatch = normUpper.match(/^(?:LAY[-_]?)?(BON|RUN|CAU|HAN|VAC|DAO|NAT|TRU|HEM|VOM|CV|TRA|STD)[-_]?0*(\d{1,3})?[-_]?(\d{5,6})?$/i);
                if (layMatch) {
                    const code = layMatch[1];
                    const ver = layMatch[2] ? ('000' + parseInt(layMatch[2], 10)).slice(-3) : '';
                    const size = layMatch[3] || '';
                    if (code === 'CV') {
                        if (size) pushCandidate(`LAY-CV-${size}`);
                        pushCandidate(`LAY-CV`);
                    } else if (code === 'TRA') {
                        if (ver && size) pushCandidate(`LAY-TRA${ver}-${size}`);
                        if (ver) pushCandidate(`LAY-TRA${ver}`);
                        if (size) pushCandidate(`LAY-STD001-${size}-ST-02`);
                        pushCandidate(`LAY-STD001-202020-ST-02`);
                    } else {
                        if (ver && size) pushCandidate(`LAY-${code}${ver}-${size}`);
                        if (ver) pushCandidate(`LAY-${code}${ver}`);
                    }
                }

                // B. Nhóm Bể kính (Hỗ trợ cả kích thước 5 chữ số: 20208 -> 20x20x8 và 6 chữ số: 302020, 202008):
                // Dạng 1: BEND301818, BEND20208, BETTA201012, TERA121221, BC301422, BEDUC301720, BE302020, BE20208
                const beMatch = normUpper.match(/^(?:BE[-_]?)?(ND|BETTA|TERA|BC|MINI|STD|DUC)?[-_]?(\d{5,6})$/i);
                if (beMatch) {
                    const explicitSub = beMatch[1] ? beMatch[1].toUpperCase() : null;
                    const sizeRaw = beMatch[2];
                    let sizePad = sizeRaw;
                    let d = '', r = '', c = '';
                    if (sizeRaw.length === 5) {
                        d = sizeRaw.substring(0, 2);
                        r = sizeRaw.substring(2, 4);
                        c = sizeRaw.substring(4);
                        sizePad = `${d}${r}0${c}`;
                    } else if (sizeRaw.length === 6) {
                        d = sizeRaw.substring(0, 2);
                        r = sizeRaw.substring(2, 4);
                        c = sizeRaw.substring(4, 6);
                    }
                    const sizeClean = (c && c.startsWith('0') && parseInt(c, 10) < 10) ? `${d}${r}${parseInt(c, 10)}` : sizeRaw;

                    // Phân luồng chính xác: Bể Nâng Đáy (ND) vs Bể Thường (MINI, STD, BC, TERA...)
                    let candidateSubs = [];
                    if (explicitSub === 'ND') {
                        candidateSubs = ['ND'];
                    } else if (explicitSub) {
                        candidateSubs = [explicitSub, 'MINI', 'STD', 'BC', 'TERA', 'DUC', 'BETTA'];
                    } else {
                        // Bể thường không có tiền tố ND: ưu tiên MINI (chuẩn ERP bể <= 40cm), STD, BC, TERA, DUC, BETTA. Tuyệt đối không sinh mã ND!
                        candidateSubs = ['MINI', 'STD', 'BC', 'TERA', 'DUC', 'BETTA'];
                    }

                    candidateSubs.forEach(st => {
                        pushCandidate(`BE-${st}-${sizePad}`);
                        pushCandidate(`BE-${st}-${sizeClean}`);
                        if (d && r && c) pushCandidate(`BE-${st}-${d}X${r}X${parseInt(c, 10)}`);
                    });
                    const subSuffix = explicitSub || 'STD';
                    pushCandidate(`BE${sizeRaw}${subSuffix}`);
                    pushCandidate(`BE${sizePad}${subSuffix}`);
                    pushCandidate(`BE${sizeClean}${subSuffix}`);
                }

                // Dạng 2: BE301818ND, BE20208ND, BE202008ND, BE201012BETTA, BE121221TERA, BE301422BC, BE301720DUC
                const beMatch2 = normUpper.match(/^(?:BE[-_]?)?(\d{5,6})[-_]?(ND|BETTA|TERA|BC|MINI|STD|DUC)$/i);
                if (beMatch2) {
                    const sizeRaw = beMatch2[1];
                    const explicitSub2 = beMatch2[2] ? beMatch2[2].toUpperCase() : null;
                    let sizePad = sizeRaw;
                    let d = '', r = '', c = '';
                    if (sizeRaw.length === 5) {
                        d = sizeRaw.substring(0, 2);
                        r = sizeRaw.substring(2, 4);
                        c = sizeRaw.substring(4);
                        sizePad = `${d}${r}0${c}`;
                    } else if (sizeRaw.length === 6) {
                        d = sizeRaw.substring(0, 2);
                        r = sizeRaw.substring(2, 4);
                        c = sizeRaw.substring(4, 6);
                    }
                    const sizeClean = (c && c.startsWith('0') && parseInt(c, 10) < 10) ? `${d}${r}${parseInt(c, 10)}` : sizeRaw;

                    let candidateSubs = [];
                    if (explicitSub2 === 'ND') {
                        candidateSubs = ['ND'];
                    } else if (explicitSub2) {
                        candidateSubs = [explicitSub2, 'MINI', 'STD', 'BC', 'TERA', 'DUC', 'BETTA'];
                    } else {
                        candidateSubs = ['MINI', 'STD', 'BC', 'TERA', 'DUC', 'BETTA'];
                    }

                    candidateSubs.forEach(st => {
                        pushCandidate(`BE-${st}-${sizePad}`);
                        pushCandidate(`BE-${st}-${sizeClean}`);
                        if (d && r && c) pushCandidate(`BE-${st}-${d}X${r}X${parseInt(c, 10)}`);
                    });
                    const subSuffix = explicitSub2 || 'STD';
                    pushCandidate(`BE${sizeRaw}${subSuffix}`);
                    pushCandidate(`BE${sizePad}${subSuffix}`);
                    pushCandidate(`BE${sizeClean}${subSuffix}`);
                }

                // C. Nhóm Phụ kiện & Nguyên vật liệu: XBL500, DALONGVU, AKADAMA, CLEARWATER, CAMCA-18G, BANGDINHXOP, SANM...
                const cleanSlug = s.toUpperCase().replace(/^(?:PK[-_]|NL[-_]|VT[-_]|DG[-_]|SP[-_]|PRD[-_])+/i, '').replace(/[^A-Z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
                if (cleanSlug && cleanSlug.length >= 2) {
                    ['PK-LOC-', 'PK-VLL-', 'PK-NEN-', 'PK-XLN-', 'PK-AN-', 'PK-KHAC-', 'VT-', 'DG-', 'NL-LAY-', 'NL-BE-'].forEach(pfx => {
                        pushCandidate(`${pfx}${cleanSlug}`);
                    });
                    const alphaNumMatch = cleanSlug.match(/^([A-Z]+)(\d+|[A-Z])$/);
                    if (alphaNumMatch) {
                        const splitSlug = `${alphaNumMatch[1]}-${alphaNumMatch[2]}`;
                        ['PK-LOC-', 'PK-VLL-', 'PK-NEN-', 'PK-XLN-', 'PK-AN-', 'PK-KHAC-', 'VT-', 'DG-', 'NL-LAY-', 'NL-BE-'].forEach(pfx => {
                            pushCandidate(`${pfx}${splitSlug}`);
                        });
                        pushCandidate(splitSlug);
                    }
                }
            };

            // Ưu tiên 1: Target SKU / Cột R (SKU Reference No. / Mã SKU phân loại hàng từ Excel)
            addCandidate(targetSku);

            // Ưu tiên 1b: Trích xuất SKU trong dấu ngoặc vuông [...] từ Tên phân loại hoặc Tên sản phẩm Shopee
            const textToScan = [pVar, pName, rawFullName].filter(Boolean);
            textToScan.forEach(txt => {
                const bracketMatches = String(txt).match(/\[(.*?)\]/g);
                if (bracketMatches) {
                    bracketMatches.forEach(bStr => {
                        const content = bStr.replace(/[\[\]]/g, '').trim();
                        const parts = content.split(/\s+/).filter(Boolean);
                        for (let k = parts.length - 1; k >= 0; k--) {
                            addCandidate(parts[k]);
                        }
                        addCandidate(content);
                    });
                }
                const regexSkuMatches = String(txt).match(/\b[A-Z0-9]{2,10}[-_][A-Z0-9]+([-_][A-Z0-9]+)*\b/gi);
                if (regexSkuMatches) {
                    regexSkuMatches.forEach(rSku => addCandidate(rSku));
                }
            });

            // Ưu tiên 2: Parent SKU / SKU sản phẩm cha (Cột P từ 'Parent SKU Reference No.' hoặc 'Mã SKU người bán')
            addCandidate(parentSku);

            // 2. TRA CỨU KHỚP TUYỆT ĐỐI THEO SKU ỨNG VIÊN (O(1) Fast Map Lookup)
            for (const cand of candidateSkus) {
                const candUpper = String(cand).trim().toUpperCase();
                if (catalogIndex.skuExactMap.has(candUpper)) {
                    return catalogIndex.skuExactMap.get(candUpper);
                }
                const candClean = candUpper.replace(/[^A-Z0-9]/g, '');
                if (candClean.length >= 3 && catalogIndex.skuCleanMap.has(candClean)) {
                    return catalogIndex.skuCleanMap.get(candClean);
                }
            }

            // 3. BÓC TÁCH MÃ LAYOUT / MÃ SẢN PHẨM & QUY CÁCH KÍCH THƯỚC (POKA-YOKE)
            const fullText = (rawFullName || '').trim().toLowerCase();
            const varText = (pVar || '').trim().toLowerCase();
            const comboText = `${fullText} ${varText}`;

            // Bóc tách kích thước 3 chiều D x R x C (VD: 20x20x8cm, 20x20x8, 30x20x20, 40x23x25) hoặc Cubic (Cubic 20, Cubic 30...)
            let targetDimVariants = [];
            const dimMatch = comboText.match(/(\d{1,3})\s*[*xX×_]\s*(\d{1,3})\s*[*xX×_]\s*(\d{1,3})/);
            if (dimMatch) {
                const d = dimMatch[1];
                const r = dimMatch[2];
                const c = dimMatch[3];
                const dPad = d.padStart(2, '0');
                const rPad = r.padStart(2, '0');
                const cPad = c.padStart(2, '0');
                targetDimVariants = [
                    `${dPad}${rPad}${cPad}`,       // 202008 / 302020
                    `${d}${r}${c}`,               // 20208 / 302020
                    `${d}x${r}x${c}`,             // 20x20x8
                    `${dPad}x${rPad}x${cPad}`,     // 20x20x08
                    `${d}*${r}*${c}`
                ];
            } else {
                const cubicMatch = comboText.match(/\bcubic\s*(\d{1,3})\b/i);
                if (cubicMatch) {
                    const cVal = cubicMatch[1];
                    const cPad = cVal.padStart(2, '0');
                    targetDimVariants = [
                        `${cPad}${cPad}${cPad}`,       // 202020 / 303030
                        `${cVal}${cVal}${cVal}`,
                        `${cVal}x${cVal}x${cVal}`,
                        `${cPad}x${cPad}x${cPad}`,
                        `${cVal}*${cVal}*${cVal}`
                    ];
                }
            }

            const detectSizeClass = (str) => {
                const s = String(str || '').toLowerCase();
                // Chỉ nhận diện Size M/S/L/XL khi KHÔNG có 3 chiều kích thước dị biệt đi kèm (như 20x20x8)
                if (/\b(402325|40x23x25|40\s*23\s*25|size\s*l|ไซส์\s*l|ขนาด\s*l|[\-_]l\b)/i.test(s) || (/\b40x23\b/i.test(s) && !/40x23x/i.test(s))) return 'L';
                if (/\b(302020|30x20x20|30\s*20\s*20|size\s*m|ไซส์\s*m|ขนาด\s*m|[\-_]m\b)/i.test(s) || (/\b30x20\b/i.test(s) && !/30x20x/i.test(s))) return 'M';
                if (/\b(202020|20x20x20|20\s*20\s*20|cubic\s*20|size\s*s|ไซส์\s*s|ขนาด\s*s|[\-_]s\b)/i.test(s) || (/\b20x20\b/i.test(s) && !/20x20x/i.test(s))) return 'S';
                if (/\b(503030|50x30x30|50\s*30\s*30|size\s*xl|ไซส์\s*xl|ขนาด\s*xl|[\-_]xl\b)/i.test(s) || (/\b50x30\b/i.test(s) && !/50x30x/i.test(s))) return 'XL';
                if (/\b(603036|60x30x36|60\s*30\s*36)\b/i.test(s)) return '603036';
                if (/\b(604040|60x40x40|60\s*40\s*40)\b/i.test(s)) return '604040';
                if (/\b(804040|80x40x40|80\s*40\s*40)\b/i.test(s)) return '804040';
                if (/\b(904545|90x45x45|90\s*45\s*45)\b/i.test(s)) return '904545';
                if (/\b(1005050|100x50x50|100\s*50\s*50)\b/i.test(s)) return '1005050';
                if (/\b(1205050|120x50x50|120\s*50\s*50)\b/i.test(s)) return '1205050';
                return null;
            };

            const targetSizeClass = (!dimMatch && targetDimVariants.length === 0) ? detectSizeClass(comboText) : null;

            // Bóc tách Version và Model (VD: "RUN-020-402325" hoặc "Ver.20" -> Code: RUN, Ver: 20)
            let detectedVer = null;
            const verMatch = (candidateSkus.join(' ') + ' ' + comboText).match(/(?:ver\.?|v|run[-_]?|nat[-_]?|cv[-_]?)\s*0*(\d+)/i);
            if (verMatch) detectedVer = parseInt(verMatch[1], 10);

            // Bóc tách Category / Family (Rừng, Nature, Bể kính, Nâng đáy, Bán cạn, Trăng...)
            const isRunFamily = /(run|rừng|rung|เค้าโครงป่า)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isNatFamily = /(nat|nature|tự nhiên)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isTraFamily = /(trang|trăng|tra[-_]|layout\s*trăng)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isBkFamily = /(bk|be|bể|kính|hồ kính|hồ cá|tู้ปลา)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isNdFamily = /(?:nâng\s*đáy|nang\s*day|[\-_]nd\b|\bnd\b)/i.test(comboText);
            const isBettaFamily = /(betta|xiêm|chọi)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isTeraFamily = /(tera|terrarium|bán\s*cạn|ban\s*can|bc)/i.test(candidateSkus.join(' ') + ' ' + comboText);
            const isCvFamily = /(cv|cover)/i.test(candidateSkus.join(' ') + ' ' + comboText);

            // Tìm sản phẩm khớp theo Family + Ver + Size qua indexedProds (siêu tốc, không sort lại)
            let bestProduct = null;
            let highestScore = 0;

            for (let i = 0; i < catalogIndex.indexedProds.length; i++) {
                const item = catalogIndex.indexedProds[i];
                let score = 0;

                // Match version
                if (detectedVer !== null) {
                    const pVerMatch = item.pFull.match(/(?:ver\.?|v|run[-_]?|nat[-_]?|cv[-_]?)\s*0*(\d+)/i) || item.pFull.match(/\b0*(\d+)\b/);
                    if (pVerMatch && parseInt(pVerMatch[1], 10) === detectedVer) {
                        score += 50;
                    }
                }

                // Match family
                if (isRunFamily && (item.pFull.includes('rừng') || item.pFull.includes('run'))) score += 30;
                if (isNatFamily && (item.pFull.includes('nature') || item.pFull.includes('nat'))) score += 30;
                if (isTraFamily && (item.pFull.includes('trăng') || item.pFull.includes('trang') || item.pFull.includes('tra'))) score += 45;
                if (isBkFamily && (item.pFull.includes('bể') || item.pFull.includes('kính') || item.pFull.includes('bk') || item.pFull.includes('be'))) score += 30;
                
                const itemIsNd = item.pFull.includes('nâng đáy') || /\b(nd|nđ)\b/i.test(item.pFull) || item.pSku.includes('-nd-') || item.pSku.startsWith('be-nd-');
                if (isNdFamily) {
                    if (itemIsNd) score += 50;
                    else score -= 40;
                } else {
                    if (itemIsNd) score -= 50; // Đơn bể thường nhưng sản phẩm là nâng đáy -> trừ điểm mạnh
                }

                if (isBettaFamily && (item.pFull.includes('betta'))) score += 40;
                if (isTeraFamily && (item.pFull.includes('tera') || item.pFull.includes('bán cạn') || item.pFull.includes('bc'))) score += 40;
                if (isCvFamily && (item.pFull.includes('cover') || item.pFull.includes('cv'))) score += 30;

                // Match size / dimensions chính xác
                if (targetDimVariants.length > 0) {
                    const matchedDim = targetDimVariants.some(dv => item.pFull.includes(dv.toLowerCase()) || item.pClean.includes(dv.toLowerCase().replace(/[^a-z0-9]/g, '')));
                    if (matchedDim) {
                        score += 80;
                    }
                } else if (targetSizeClass) {
                    const pSize = detectSizeClass(item.pFull);
                    if (pSize === targetSizeClass) score += 40;
                }

                // Candidate SKU substring match
                for (const cand of candidateSkus) {
                    const candClean = cand.toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (candClean.length >= 3 && item.pClean.includes(candClean)) {
                        score += 60;
                    }
                    if (cand.toLowerCase() === item.pSku) {
                        score += 100;
                    }
                }

                if (score > highestScore && score >= 50) {
                    highestScore = score;
                    bestProduct = item.product;
                }
            }

            if (bestProduct) {
                return bestProduct;
            }

            // 4. NẾU KHÔNG CÓ SKU NÀO KHỚP -> DÙNG THUẬT TOÁN TÊN SẢN PHẨM (FALLBACK)
            let augmentedText = fullText;
            if (!dimMatch && targetDimVariants.length === 0) {
                if (/\bsize\s*s\b|\bs\b|ไซส์\s*s/i.test(fullText) && !fullText.includes('20x20x20')) augmentedText += ' 20x20x20 20x20x20cm';
                if (/\bsize\s*m\b|\bm\b|ไซส์\s*m/i.test(fullText) && !fullText.includes('30x20x20')) augmentedText += ' 30x20x20 30x20x20cm';
                if (/\bsize\s*l\b|\bl\b|ไซส์\s*l/i.test(fullText) && !fullText.includes('40x23x25')) augmentedText += ' 40x23x25 40x23x25cm';
            }
            if (comboText.match(/\bcubic\s*20\b/i) && !augmentedText.includes('20x20x20')) augmentedText += ' 20x20x20 20x20x20cm';
            if (comboText.match(/\bcubic\s*25\b/i) && !augmentedText.includes('25x25x25')) augmentedText += ' 25x25x25 25x25x25cm';
            if (comboText.match(/\bcubic\s*30\b/i) && !augmentedText.includes('30x30x30')) augmentedText += ' 30x30x30 30x30x30cm';
            if (comboText.match(/\bcubic\s*40\b/i) && !augmentedText.includes('40x40x40')) augmentedText += ' 40x40x40 40x40x40cm';

            // Khớp chính xác tên 100% (qua nameExactMap)
            const cleanFullUpper = fullText.toUpperCase();
            if (catalogIndex.nameExactMap.has(cleanFullUpper)) {
                return catalogIndex.nameExactMap.get(cleanFullUpper);
            }

            // Khớp chuỗi con qua sortedProds đã cache
            const normFullText = augmentedText.replace(/[^a-z0-9àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ\s]/gi, ' ').replace(/\s+/g, ' ');
            for (let i = 0; i < catalogIndex.sortedProds.length; i++) {
                const p = catalogIndex.sortedProds[i];
                const pNameStr = String(p.name || '').trim().toLowerCase();
                if (!pNameStr || pNameStr.length < 3) continue;
                if (augmentedText === pNameStr || fullText === pNameStr) return p;
                const normPName = pNameStr.replace(/[^a-z0-9àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ\s]/gi, ' ').replace(/\s+/g, ' ');
                if (normPName && normFullText.includes(normPName)) {
                    return p;
                }
            }

            return null;
        }, [products, catalogIndex]);

        const cleanProductTitle = React.useCallback((rawStr) => {
            if (!rawStr) return 'SP Không tên';
            let str = String(rawStr).trim();
            // 1. Dịch từ khoá danh mục tiếng Thái sang Tiếng Việt
            str = str.replace(/เค้าโครงป่า/gi, 'Layout Rừng');
            str = str.replace(/เค้าโครง/gi, 'Layout');
            str = str.replace(/ตู้ปลา/gi, 'Bể Kính');
            str = str.replace(/ไซส์\s*l|ขนาด\s*l/gi, 'Size L (40x23x25)');
            str = str.replace(/ไซส์\s*m|ขนาด\s*m/gi, 'Size M (30x20x20)');
            str = str.replace(/ไซส์\s*s|ขนาด\s*s/gi, 'Size S (20x20x20)');
            str = str.replace(/ไซส์\s*xl|ขนาด\s*xl/gi, 'Size XL (50x30x30)');
            str = str.replace(/ไซส์/gi, 'Size');
            
            // 2. Loại bỏ các cụm từ marketing rác tiếng Thái / Anh / Việt
            str = str.replace(/aquascape\s*thủy\s*sinh\s*đa\s*dạng\s*kích\s*thước\s*được\s*chế\s*tác\s*thủ\s*công/gi, '');
            str = str.replace(/ศิลปะแห่งภูมิทัศน์ธรรมชาติรับประทาน/gi, '');
            str = str.replace(/พิพิธภัณฑ์สัตว์น้ำ\s*rf/gi, '');
            str = str.replace(/พิพิธภัณฑ์สัตว์น้ำ/gi, '');
            str = str.replace(/ไฮไลท์ตู้ปลา/gi, '');
            str = str.replace(/ไฮไลท์/gi, '');
            str = str.replace(/ธรรมชาติรับประทาน/gi, '');
            str = str.replace(/chế\s*tác\s*thủ\s*công/gi, '');
            str = str.replace(/rf\s*aquarium/gi, '');
            str = str.replace(/thủy\s*sinh/gi, '');
            str = str.replace(/aquascape/gi, '');
            str = str.replace(/chính\s*hãng/gi, '');
            str = str.replace(/cao\s*cấp/gi, '');

            // 3. Chuẩn hoá dấu phân cách sạch sẽ, giữ nguyên khoảng trắng giữa các từ
            str = str.replace(/\s*\|\s*/g, ' - ');
            str = str.replace(/\s*[-–—]{2,}\s*/g, ' - ');
            str = str.replace(/\s+/g, ' ').trim();
            str = str.replace(/^[-–—\s|]+|[-–—\s|]+$/g, '').trim();
            return str || rawStr;
        }, []);

        const handleItemLink = (orderIdx, itemIdx, prodName) => {
            setPreview(prev => {
                const next = [...prev];
                const targetOrder = { ...next[orderIdx] };
                const targetItems = [...targetOrder.items];
                const matched = (products || []).find(p => p.name === prodName);
                const currentItem = targetItems[itemIdx];
                targetItems[itemIdx] = {
                    ...currentItem,
                    name: prodName,
                    matchedProd: matched || null,
                    sku: matched && matched.sku ? matched.sku : targetItems[itemIdx].sku
                };
                targetOrder.items = targetItems;
                next[orderIdx] = targetOrder;

                // GHI NHỚ ÁNH XẠ VĨNH VIỄN (SKU Alias Memory)
                if (matched) {
                    try {
                        const aliasMap = JSON.parse(localStorage.getItem('rf_sku_alias_map') || '{}');
                        if (currentItem.sku) {
                            aliasMap[currentItem.sku] = matched.sku || matched.name;
                            aliasMap[String(currentItem.sku).toUpperCase()] = matched.sku || matched.name;
                        }
                        if (currentItem.name && currentItem.name !== prodName) {
                            aliasMap[currentItem.name] = matched.sku || matched.name;
                        }
                        localStorage.setItem('rf_sku_alias_map', JSON.stringify(aliasMap));
                    } catch (err) { }
                }

                return next;
            });
        };

        const handleDateChange = (orderIdx, newDate) => {
            setPreview(prev => {
                const next = [...prev];
                next[orderIdx] = { ...next[orderIdx], rawDate: newDate };
                return next;
            });
        };

        // RULE: mapOrderStatusExact & checkProductionItemType đã được nâng cấp lên global/module scope (đầu file) để toàn bộ Modal truy cập an toàn

        const processExcelData = (rows) => {
            if (!rows || rows.length < 2) { 
                setPreview([]); 
                setIsProcessing(false); 
                setProgress(0);
                alert("⚠️ Tệp Excel này không có dòng dữ liệu đơn hàng nào (Tệp rỗng hoặc 0 đơn).\n\nLưu ý: Trên Shopee, nếu hiện tại gian hàng không có đơn nào ở mục 'Chờ vận chuyển' (To ship), sàn sẽ tự động xuất ra một tệp trắng 0 đơn. Vui lòng kiểm tra lại trên Kênh Người Bán!");
                return; 
            }
            setIsProcessing(true); setProgress(0);
            let headerIdx = 0;
            for (let i = 0; i < Math.min(15, rows.length); i++) {
                const rowStr = (rows[i] || []).join(' ').toLowerCase();
                if (
                    rowStr.includes('mã đơn hàng') || rowStr.includes('mã đơn') || 
                    rowStr.includes('order id') || rowStr.includes('order sn') || rowStr.includes('order no') ||
                    rowStr.includes('หมายเลขคำสั่งซื้อ') || rowStr.includes('pesanan') || rowStr.includes('tracking') ||
                    rowStr.includes('mã vận đơn')
                ) { 
                    headerIdx = i; 
                    break; 
                }
            }
            const headers = (rows[headerIdx] || []).map(h => String(h || '').toLowerCase().replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim());
            const findCol = (keys) => {

                        exchangeRate = 440; // 1 PHP ≈ 440 VNĐ
                    }

                    // Tự động quy đổi ngoại tệ sang VNĐ cho tất cả các sàn quốc tế
                    if (exchangeRate !== 1) {
                        rowRevenue = Math.round(rowRevenue * exchangeRate);
                        rowFeeFixed = Math.round(rowFeeFixed * exchangeRate);
                        rowFeeService = Math.round(rowFeeService * exchangeRate);
                        rowFeePayment = Math.round(rowFeePayment * exchangeRate);
                        rowFeeAffiliate = Math.round(rowFeeAffiliate * exchangeRate);
                        rowShopVoucher = Math.round(rowShopVoucher * exchangeRate);
                    } else {
                        rowRevenue = Math.round(rowRevenue);
                        rowFeeFixed = Math.round(rowFeeFixed);
                        rowFeeService = Math.round(rowFeeService);
                        rowFeePayment = Math.round(rowFeePayment);
                        rowFeeAffiliate = Math.round(rowFeeAffiliate);
                        rowShopVoucher = Math.round(rowShopVoucher);
                    }

                    let customerNote = (iNote >= 0 && cols[iNote]) ? String(cols[iNote]).trim() : '';

                    if (!orderMap[oCode]) {
                        orderMap[oCode] = {
                            orderCode: finalOrderCode,
                            channel: rowChannel,
                            customer: customerName,
                            note: customerNote,
                            isDuplicate: false,
                            isUpdate: false,
                            existingId: null,
                            revenue: rowRevenue,
                            feeFixed: rowFeeFixed,
                            feeService: rowFeeService,
                            feePayment: rowFeePayment,
                            feeAffiliate: rowFeeAffiliate,
                            shopVoucher: rowShopVoucher,
                            rawStatus: rawStatus,
                            rawDate: (() => {
                                if (iDate < 0 || cols[iDate] === undefined || cols[iDate] === null || cols[iDate] === '') return safeDateFull;
                                let rawVal = cols[iDate];
                                if (typeof rawVal === 'number' || (!isNaN(rawVal) && Number(rawVal) > 30000 && Number(rawVal) < 60000)) {
                                    try {
                                        const serial = Number(rawVal);
                                        const utcDays = Math.floor(serial - 25569);
                                        const dateInfo = new Date(utcDays * 86400 * 1000);
                                        const fractionalDay = serial - Math.floor(serial) + 0.0000001;
                                        let totalSeconds = Math.floor(86400 * fractionalDay);
                                        const seconds = totalSeconds % 60;
                                        totalSeconds -= seconds;
                                        const hours = Math.floor(totalSeconds / 3600);
                                        const minutes = Math.floor((totalSeconds % 3600) / 60);
                                        return `${dateInfo.getFullYear()}-${String(dateInfo.getMonth() + 1).padStart(2, '0')}-${String(dateInfo.getDate()).padStart(2, '0')} ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                                    } catch (e) { }
                                }
                                let dStr = String(rawVal).trim();
                                if (!dStr) return safeDateFull;
                                let parts = dStr.split(' ');
                                let dPart = parts[0];
                                let tPart = parts[1] || '12:00:00';
                                if (dPart.includes('/')) {
                                    let dParts = dPart.split('/');
                                    if (dParts.length >= 3) {
                                        if (dParts[2].length === 4) {
                                            dPart = `${dParts[2]}-${dParts[1].padStart(2, '0')}-${dParts[0].padStart(2, '0')}`;
                                        } else if (dParts[0].length === 4) {
                                            dPart = `${dParts[0]}-${dParts[1].padStart(2, '0')}-${dParts[2].padStart(2, '0')}`;
                                        }
                                    }
                                } else if (dPart.includes('-')) {
                                    let dParts = dPart.split('-');
                                    if (dParts.length >= 3 && dParts[0].length !== 4 && dParts[2].length === 4) {
                                        dPart = `${dParts[2]}-${dParts[1].padStart(2, '0')}-${dParts[0].padStart(2, '0')}`;
                                    }
                                }
                                return `${dPart} ${tPart}`;
                            })(),
                            items: []
                        };
                    } else {
                        if (customerNote && !orderMap[oCode].note) {
                            orderMap[oCode].note = customerNote;
                        }
                        if (orderMap[oCode].customer === 'Khách' && customerName !== 'Khách') {
                            orderMap[oCode].customer = customerName;
                        }
                        if (tCode && !orderMap[oCode].orderCode.includes(' | MVĐ: ')) {
                            orderMap[oCode].orderCode = `${oCode} | MVĐ: ${tCode}`;
                        }
                        // [REMOVED] Không cộng dồn rawStatus để Exact Match luôn chính xác với dòng đầu tiên của sản phẩm
                        const isItemLevel = ['đơn giá', 'deal price', 'giá bán deal', 'giá bán', 'original price'].some(k => headers[iRevenue] && headers[iRevenue].includes(k));
                        if (isItemLevel) {
                            orderMap[oCode].revenue += rowRevenue;
                            // Đối với phí sàn: Nếu các dòng phụ có cùng mức phí với dòng chính thì là phí cấp đơn bị lặp, dùng Math.max chống nhân khống phí
                            orderMap[oCode].feeFixed = (rowFeeFixed > 0 && rowFeeFixed === orderMap[oCode].feeFixed) ? orderMap[oCode].feeFixed : (orderMap[oCode].feeFixed + rowFeeFixed);
                            orderMap[oCode].feeService = (rowFeeService > 0 && rowFeeService === orderMap[oCode].feeService) ? orderMap[oCode].feeService : (orderMap[oCode].feeService + rowFeeService);
                            orderMap[oCode].feePayment = (rowFeePayment > 0 && rowFeePayment === orderMap[oCode].feePayment) ? orderMap[oCode].feePayment : (orderMap[oCode].feePayment + rowFeePayment);
                            orderMap[oCode].feeAffiliate = (rowFeeAffiliate > 0 && rowFeeAffiliate === orderMap[oCode].feeAffiliate) ? orderMap[oCode].feeAffiliate : (orderMap[oCode].feeAffiliate + rowFeeAffiliate);
                            orderMap[oCode].shopVoucher = (rowShopVoucher > 0 && rowShopVoucher === orderMap[oCode].shopVoucher) ? orderMap[oCode].shopVoucher : (orderMap[oCode].shopVoucher + rowShopVoucher);
                        } else {
                            orderMap[oCode].revenue = Math.max(orderMap[oCode].revenue || 0, rowRevenue);
                            orderMap[oCode].feeFixed = Math.max(orderMap[oCode].feeFixed || 0, rowFeeFixed);
                            orderMap[oCode].feeService = Math.max(orderMap[oCode].feeService || 0, rowFeeService);
                            orderMap[oCode].feePayment = Math.max(orderMap[oCode].feePayment || 0, rowFeePayment);
                            orderMap[oCode].feeAffiliate = Math.max(orderMap[oCode].feeAffiliate || 0, rowFeeAffiliate);
                            orderMap[oCode].shopVoucher = Math.max(orderMap[oCode].shopVoucher || 0, rowShopVoucher);
                        }
                    }

                    let pName = iProd >= 0 && cols[iProd] ? String(cols[iProd]).trim() : 'SP Không tên';
                    let pVar = iVar >= 0 && cols[iVar] ? String(cols[iVar]).trim() : '';
                    let rawFullName = pName + (pVar ? ' - ' + pVar : '');
                    let matchedProd = matchProductFromCatalog(varSku, rawFullName, pName, pVar, parentSku);

                    // Tên sản phẩm theo Tên Chuẩn Trong Kho ERP (Nếu khớp) hoặc tên gốc
                    let finalProdName = (matchedProd && matchedProd.name) ? matchedProd.name : rawFullName;
                    let qty = (iQty >= 0 && parseInt(cols[iQty])) ? parseInt(cols[iQty]) : 1;
                    // Mã SKU Chuẩn Mới của xưởng
                    const effectiveSku = (matchedProd && matchedProd.sku) ? matchedProd.sku : targetSku;

                    // KIỂM TRA TRÙNG LẶP & CỘNG DỒN SỐ LƯỢNG
                    const existingItemIndex = orderMap[oCode].items.findIndex(item => item.name === finalProdName);
                    if (existingItemIndex !== -1) {
                        // Nếu đã có hàng hóa này trong đơn, chỉ cần cộng dồn số lượng
                        orderMap[oCode].items[existingItemIndex].qty += qty;
                    } else {
                        // Nếu chưa có, đẩy thành một dòng mới
                        orderMap[oCode].items.push({ name: finalProdName, qty, sku: effectiveSku, matchedProd });
                    }
                }

                currentIndex = endIndex;
                const denom = Math.max(1, totalRows - headerIdx - 1);
                setProgress(Math.min(Math.floor(((currentIndex - headerIdx - 1) / denom) * 100), 100));
                if (currentIndex < totalRows) { setTimeout(processBatch, 10); }
                else {
                    const result = Object.values(orderMap).map(o => {
                        let baseCode = o.orderCode;
                        let tCode = '';
                        if (o.orderCode.includes(' | MVĐ: ')) {
                            const parts = o.orderCode.split(' | MVĐ: ');
                            baseCode = parts[0].trim();
                            tCode = parts[1].trim();
                        } else if (o.orderCode.includes('|')) {
                            const parts = o.orderCode.split('|');
                            baseCode = parts[0].trim();
                            tCode = parts[1].replace(/^(?:MVĐ|MVD|Tracking)[\s:]*/i, '').trim();
                        }

                        const existing = findExistingOrder(baseCode, tCode);
                        if (existing) {
                            let existingTrack = '';
                            if (existing.shippingCode && String(existing.shippingCode).trim()) {
                                existingTrack = cleanRawCode(existing.shippingCode);
                            } else if (existing.orderCode && existing.orderCode.includes('|')) {
                                const parts = existing.orderCode.split('|');
                                existingTrack = cleanRawCode(parts[1].replace(/^(?:MVĐ|MVD|Tracking)[\s:]*/i, ''));
                            }
                            const cleanT = cleanRawCode(tCode);
                            const hasNewTrack = Boolean(cleanT && (!existingTrack || toAlphaNum(cleanT) !== toAlphaNum(existingTrack)));
                            const existingCustomer = existing.customer || '';
                            const existingRevenue = Number(existing.revenue || 0);

                            const hasNewCustomer = (o.customer && o.customer !== 'Khách') && (!existingCustomer || existingCustomer === 'Khách');
                            const hasNewRevenue = o.revenue > 0 && existingRevenue === 0;

                            const existingFeeFixed = Number(existing.feeFixed || 0);
                            const existingFeeService = Number(existing.feeService || 0);
                            const existingFeePayment = Number(existing.feePayment || 0);
                            const existingFeeAffiliate = Number(existing.feeAffiliate || 0);
                            const existingShopVoucher = Number(existing.shopVoucher || 0);
                            const hasNewFees = (o.feeFixed !== 0 && o.feeFixed !== existingFeeFixed) ||
                                (o.feeService !== 0 && o.feeService !== existingFeeService) ||
                                (o.feePayment !== 0 && o.feePayment !== existingFeePayment) ||
                                (o.feeAffiliate !== 0 && o.feeAffiliate !== existingFeeAffiliate) ||
                                (o.shopVoucher !== 0 && o.shopVoucher !== existingShopVoucher) ||
                                (o.revenue !== existingRevenue);

                            const mappedStatus = mapOrderStatusExact(o.rawStatus);
                            // Cập nhật trạng thái nếu file import có trạng thái dứt điểm khác với trạng thái cũ
                            const hasNewStatus = mappedStatus !== null && existing.status !== mappedStatus;
                            const hasNewNote = Boolean(o.note && String(o.note).trim() !== String(existing.note || '').trim());
                            o.mappedStatus = mappedStatus; // Truyền xuống function submit

                            if (hasNewTrack || hasNewCustomer || hasNewRevenue || hasNewStatus || hasNewFees || hasNewNote) {
                                const updatedOrderCode = cleanT ? `${cleanRawCode(baseCode)} | MVĐ: ${cleanT}` : o.orderCode;
                                return {
                                    ...o,
                                    orderCode: updatedOrderCode,
                                    shippingCode: cleanT || existingTrack || '',
                                    isDuplicate: false,
                                    isUpdate: true,
                                    existingId: existing.id,
                                    existingRecord: existing,
                                    hasNewTrack: hasNewTrack
                                };
                            } else {
                                return {
                                    ...o,
                                    isDuplicate: true,
                                    isUpdate: false,
                                    existingId: existing.id
                                };
                            }
                        }
                        return {
                            ...o,
                            shippingCode: cleanRawCode(tCode),
                            isDuplicate: false,
                            isUpdate: false
                        };
                    });
                    if (result.length === 0) {
                        setPreview([]); 
                        setIsProcessing(false); 
                        setProgress(0);
                        alert("⚠️ Tệp Excel này không chứa đơn hàng nào hợp lệ (0 đơn). Vui lòng kiểm tra lại nội dung bên trong tệp!");
                        return;
                    }
                    setPreview(result.slice(0, 150)); setIsProcessing(false); setProgress(100);
                    if (result.length > 150) setTimeout(() => { alert(`File có ${result.length} đơn. Hệ thống hiển thị 150 đơn đầu tiên để tránh đơ. Toàn bộ vẫn được xử lý khi bấm CHỐT.`); }, 300);
                }
                } catch (batchErr) {
                    console.error("Lỗi phân tích batch:", batchErr);
                    setIsProcessing(false);
                    alert("Lỗi khi xử lý dữ liệu đơn hàng: " + (batchErr.message || batchErr));
                }
            };
            setTimeout(processBatch, 50);
        };

        const handleCancel = () => {
            setIsProcessing(false);
            setFileName('');
            setProgress(0);
            setPreview([]);
            onClose();
        };

        // TỰ ĐỘNG NẠP THƯ VIỆN XLSX VÀ ĐỌC FILE LINH HOẠT (ARRAY BUFFER + BINARY FALLBACK)
        // TỰ ĐỘNG NẠP THƯ VIỆN XLSX VÀ ĐỌC FILE LINH HOẠT (ARRAY BUFFER + BINARY FALLBACK)
        const handleFileUpload = async (file) => {
            if (!file) return;
            setFileName(file.name); setIsProcessing(true); setProgress(15); setPreview([]);
            try {
                if (typeof window.ensureXLSXLoaded === 'function') {
                    setProgress(25);
                    await window.ensureXLSXLoaded();
                } else if (!window.XLSX) {
                    throw new Error("Thư viện xử lý Excel chưa sẵn sàng. Vui lòng tải lại trang.");
                }
                setProgress(45);

                let buffer = null;
                // 1. Ưu tiên đọc trực tiếp qua Web API file.arrayBuffer() của trình duyệt hiện đại
                if (typeof file.arrayBuffer === 'function') {
                    try {
                        buffer = await file.arrayBuffer();
                    } catch (abErr) {
                        console.warn("file.arrayBuffer lỗi, chuyển sang FileReader:", abErr);
                    }
                }

                // 2. Fallback sang FileReader nếu file.arrayBuffer không khả dụng
                if (!buffer) {
                    buffer = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onerror = (err) => {
                            reject(new Error("Không thể truy cập tệp tin. Có thể file đang được mở trong Microsoft Excel hoặc ứng dụng khác. Vui lòng đóng Excel và thử chọn lại file!"));
                        };
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsArrayBuffer(file);
                    });
                }

                setProgress(65);
                let wb;
                const data = new Uint8Array(buffer);
                try {
                    wb = window.XLSX.read(data, { type: 'array' });
                } catch (errArr) {
                    console.warn("Lỗi đọc array buffer, fallback binary:", errArr);
                    const binData = await new Promise((resolve, reject) => {
                        const binReader = new FileReader();
                        binReader.onerror = (binErr) => reject(new Error("Không thể đọc tệp tin theo định dạng nhị phân."));
                        binReader.onload = (be) => resolve(be.target.result);
                        binReader.readAsBinaryString(file);
                    });
                    wb = window.XLSX.read(binData, { type: 'binary' });
                }

                let sheetName = wb.SheetNames.find(s => s.toLowerCase().trim() === 'orders');
                if (!sheetName) sheetName = wb.SheetNames[0];

                const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
                setProgress(80);
                processExcelData(rows);
            } catch (error) {
                console.error("Lỗi đọc file Excel:", error);
                alert(error.message || "Lỗi đọc file Excel! Vui lòng đảm bảo file không bị khóa bởi ứng dụng khác và đúng định dạng.");
                setFileName(''); 
                setIsProcessing(false); 
                setProgress(0);
            }
        };

        // LƯU Ý: Phải luôn có từ khóa "async" ở đây
        const submit = async () => {
            const validOrders = preview.filter(p => !p.isDuplicate);
            if (validOrders.length === 0) return alert('Không có đơn hàng MỚI nào để chốt!');

            setIsSubmitting(true);
            const activeUser = localStorage.getItem('rf_user') || 'Hệ thống';
            try {
                let newOrders = [];
                let newProdItems = [];
                let deleteProdIds = [];
                let d = new Date(); d.setDate(d.getDate() + 2); d.setHours(12, 0, 0, 0);
                const defaultDeadline = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

                // Tạo bộ đếm tồn kho ảo tạm thời cho toàn bộ lượt import
                let importStockMap = {};

                validOrders.forEach((o, oIdx) => {
                    let calculatedStatus = o.mappedStatus || mapOrderStatusExact(o.rawStatus);

                    let targetOrderId = o.isUpdate ? o.existingId : ('ORD_' + Date.now() + '_' + oIdx);
                    let accessories = [];
                    let orderStatus = calculatedStatus || (o.isUpdate ? (o.existingRecord.status || 'Chờ Sản Xuất') : 'Chờ Sản Xuất');
                    let orderHasProductionNeeded = false;
                    let calculatedOrderCogs = 0;

                    const existingOrderProds = (existingProdItems || []).filter(p => {
                        if (!p || !p.orderId) return false;
                        const pOrd = String(p.orderId).trim();
                        return pOrd === targetOrderId || pOrd.startsWith(targetOrderId + '_') || pOrd.split('|').map(x => x.trim()).includes(targetOrderId);
                    });
                    const hasExistingProds = o.isUpdate && existingOrderProds.length > 0;
                    const isExistingTerminal = o.isUpdate && o.existingRecord && ['Đã Bàn Giao', 'Đối Soát Thành Công', 'Hoàn Thành', 'Hàng Hoàn', 'Đơn Huỷ'].includes(o.existingRecord.status);

                    let currentOrderProdItems = [];

                    // Nếu là đơn mới HOẶC đơn cập nhật chưa hoàn thành: Cho phép phân tích lại sản phẩm và cập nhật lệnh sản xuất
                    if (!isExistingTerminal) {
                        o.items.forEach((item, itemIdx) => {
                            const prodInfo = checkProductionItemType(item, products);
                            let matchedItem = prodInfo.matchedProd;
                            let realStockQty = matchedItem ? Number(matchedItem.quantity || 0) : 0;

                            // TÍNH TOÁN GIÁ VỐN (COGS) TỪNG SẢN PHẨM THEO BẢNG PRODUCTS & ĐỊNH MỨC XƯỞNG
                            let itemUnitCost = 0;
                            if (matchedItem && Number(matchedItem.costPrice || 0) > 0) {
                                itemUnitCost = Number(matchedItem.costPrice);
                            } else if (prodInfo.isGlass) {
                                const nameToMatch = String(item.name || '').toLowerCase();
                                const dimMatch = nameToMatch.match(/(\d{1,3})\s*[*xX×_]\s*(\d{1,3})\s*[*xX×_]\s*(\d{1,3})/);
                                if (dimMatch) {
                                    const L = parseFloat(dimMatch[1]) / 100;
                                    const W = parseFloat(dimMatch[2]) / 100;
                                    const H = parseFloat(dimMatch[3]) / 100;
                                    const S = (L * W + 2 * L * H + 2 * W * H) * 1.1;
                                    const P = (L + W) * 2;
                                    itemUnitCost = Math.round((S * 180000) + (P * 25000) + 30000);
                                } else {
                                    itemUnitCost = 85000;
                                }
                            } else if (prodInfo.isLayout) {
                                const nameToMatch = String(item.name || '').toLowerCase();
                                if (nameToMatch.includes('40x23x25') || nameToMatch.includes('size l') || nameToMatch.includes('50x30x30')) {
                                    itemUnitCost = 145000;
                                } else if (nameToMatch.includes('30x20x20') || nameToMatch.includes('size m')) {
                                    itemUnitCost = 95000;
                                } else if (nameToMatch.includes('20x20x20') || nameToMatch.includes('size s')) {
                                    itemUnitCost = 65000;
                                } else {
                                    itemUnitCost = 90000;
                                }
                            } else if (matchedItem && Number(matchedItem.price || 0) > 0) {
                                itemUnitCost = Math.round(Number(matchedItem.price) * 0.55);
                            }
                            calculatedOrderCogs += itemUnitCost * Number(item.qty || 1);

                            if (!prodInfo.isProd) {
                                accessories.push({ name: item.name, quantity: item.qty, price: 0, costPrice: itemUnitCost, hasProduction: false, sku: item.sku });
                            } else {
                                accessories.push({ name: item.name, quantity: item.qty, price: 0, costPrice: itemUnitCost, hasProduction: true, sku: item.sku });
                                const isPastOrder = ['Đã Bàn Giao', 'Đối Soát Thành Công', 'Hoàn Thành', 'Hàng Hoàn', 'Đơn Huỷ'].includes(calculatedStatus);
                                const orderQty = Number(item.qty || 1);
                                const isGlass = prodInfo.isGlass;

                                if (isPastOrder) {
                                    for (let q = 0; q < orderQty; q++) {
                                        const prodId = 'PROD_' + Date.now() + Math.random().toString(36).substr(2, 5) + '_' + oIdx + '_' + itemIdx + '_' + q;
                                        currentOrderProdItems.push({
                                            id: prodId, orderId: targetOrderId,
                                            type: isGlass ? 'Bể Kính' : 'Layout',
                                            name: item.name,
                                            note: `Lịch sử đơn hàng: ${calculatedStatus}`,
                                            status: 'Hoàn Kho Đạt', fulfilledFromStock: true,
                                            phases: isGlass ?
                                                { phase1: { name: 'Cắt Dán', status: 'Done' }, phase2: { name: 'Gọt Keo', status: 'Done' } } :
                                                { phase1: { name: 'Dựng Khung', status: 'Done' }, phase2: { name: 'Gia Cố', status: 'Done' } },
                                            deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : defaultDeadline
                                        });
                                    }
                                } else {
                                    const workerPhases = isGlass ?
                                        { phase1: { name: 'Cắt Dán', status: 'Pending' }, phase2: { name: 'Gọt Keo', status: 'Pending' } } :
                                        { phase1: { name: 'Dựng Khung', status: 'Pending' }, phase2: { name: 'Gia Cố', status: 'Pending' } };

                                    let currentAvailable = importStockMap[item.name] !== undefined ? importStockMap[item.name] : realStockQty;
                                    const chanUpper = String(o.channel || '').toUpperCase();
                                    const isExportChan = chanUpper.includes('SHOPEE SG') || chanUpper.includes('SHOPEE MY') || chanUpper.includes('SHOPEE MA') ||
                                        chanUpper.includes('SHOPEE TH') || chanUpper.includes('SHOPEE PH') || chanUpper.includes('SHOPEE TW') ||
                                        chanUpper.includes('XUẤT KHẨU') || chanUpper.includes('EXPORT') || chanUpper.includes('QUỐC TẾ');

                                    const stockPhases = isGlass ?
                                        { phase1: { name: 'Cắt Dán', status: 'Done', user: '' }, phase2: { name: 'Gọt Keo', status: 'Done', user: '' } } :
                                        { phase1: { name: 'Dựng Khung', status: 'Done', user: '' }, phase2: { name: 'Gia Cố', status: 'Done', user: '' } };

                                    const orderCustomerNote = String(o.note || (o.existingRecord ? o.existingRecord.note : '') || '').trim();

                                    // Nếu là BỂ LẺ SIZE: Chỉ tạo DUY NHẤT 1 lệnh sản xuất gom chung số lượng cho đơn
                                    if (prodInfo.isBeLeSize) {
                                        const prodId = 'PROD_' + Date.now() + Math.random().toString(36).substr(2, 5) + '_' + oIdx + '_' + itemIdx + '_0';
                                        if (currentAvailable >= orderQty && !isExportChan) {
                                            currentOrderProdItems.push({
                                                id: prodId, orderId: targetOrderId,
                                                type: 'Bể Kính',
                                                name: item.name,
                                                note: orderCustomerNote ? (orderCustomerNote + ' | Lấy từ tồn kho có sẵn') : 'Lấy từ tồn kho có sẵn',
                                                status: 'Hoàn Kho Đạt', fulfilledFromStock: true,
                                                phases: stockPhases,
                                                qc_status: 'Đã Duyệt',
                                                deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : defaultDeadline
                                            });
                                            currentAvailable -= orderQty;
                                        } else {
                                            orderHasProductionNeeded = true;
                                            currentOrderProdItems.push({
                                                id: prodId, orderId: targetOrderId,
                                                type: 'Bể Kính',
                                                name: item.name,
                                                note: orderCustomerNote,
                                                status: 'Pending', fulfilledFromStock: false,
                                                phases: workerPhases,
                                                deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline(o.channel) : defaultDeadline
                                            });
                                            currentAvailable = Math.max(0, currentAvailable - orderQty);
                                        }
                                    } else {
                                        for (let q = 0; q < orderQty; q++) {
                                            const prodId = 'PROD_' + Date.now() + Math.random().toString(36).substr(2, 5) + '_' + oIdx + '_' + itemIdx + '_' + q;

                                            if (currentAvailable > 0 && !isExportChan) {
                                                currentOrderProdItems.push({
                                                    id: prodId, orderId: targetOrderId,
                                                    type: isGlass ? 'Bể Kính' : 'Layout',
                                                    name: item.name,
                                                    note: orderCustomerNote ? (orderCustomerNote + ' | Lấy từ tồn kho có sẵn') : 'Lấy từ tồn kho có sẵn',
                                                    status: 'Hoàn Kho Đạt', fulfilledFromStock: true,
                                                    phases: stockPhases,
                                                    qc_status: 'Đã Duyệt',
                                                    deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : defaultDeadline
                                                });
                                                currentAvailable--;
                                            } else {
                                                orderHasProductionNeeded = true;
                                                currentOrderProdItems.push({
                                                    id: prodId, orderId: targetOrderId,
                                                    type: isGlass ? 'Bể Kính' : 'Layout',
                                                    name: item.name,
                                                    note: orderCustomerNote,
                                                    status: 'Pending', fulfilledFromStock: false,
                                                    phases: workerPhases,
                                                    deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline(o.channel) : defaultDeadline
                                                });
                                            }
                                        }
                                    }
                                    importStockMap[item.name] = currentAvailable;
                                }
                            }
                        });

                        // NẾU CẬP NHẬT ĐƠN CŨ: TÁI SỬ DỤNG ID LỆNH SẢN XUẤT CŨ ĐỂ GHI ĐÈ THAY THẾ CHÍNH XÁC
                        if (o.isUpdate && hasExistingProds) {
                            for (let k = 0; k < currentOrderProdItems.length; k++) {
                                if (existingOrderProds[k]) {
                                    currentOrderProdItems[k].id = existingOrderProds[k].id;
                                }
                            }
                            if (existingOrderProds.length > currentOrderProdItems.length) {
                                for (let k = currentOrderProdItems.length; k < existingOrderProds.length; k++) {
                                    deleteProdIds.push(existingOrderProds[k].id);
                                }
                            }
                        }

                        currentOrderProdItems.forEach(p => newProdItems.push(p));

                        if (!calculatedStatus && orderHasProductionNeeded && !o.isUpdate) {
                            orderStatus = 'Chờ Sản Xuất';
                        }
                    } else {
                        // Đơn đã hoàn tất trong quá khứ -> Giữ nguyên phụ kiện cũ
                        accessories = [];
                        if (o.existingRecord && o.existingRecord.accessories) {
                            try { accessories = JSON.parse(o.existingRecord.accessories); } catch (e) { }
                        }
                        // Vẫn bổ sung tính giá vốn COGS cho đơn nếu đơn cũ chưa có
                        if (!o.existingRecord || !o.existingRecord.cogs || Number(o.existingRecord.cogs) <= 0) {
                            o.items.forEach(item => {
                                const prodInfo = checkProductionItemType(item, products);
                                let matchedItem = prodInfo.matchedProd;
                                let itemUnitCost = (matchedItem && Number(matchedItem.costPrice || 0) > 0) ? Number(matchedItem.costPrice) : (prodInfo.isGlass ? 85000 : (prodInfo.isLayout ? 90000 : 0));
                                calculatedOrderCogs += itemUnitCost * Number(item.qty || 1);
                            });
                        }
                    }

                    const finalOrderCustomerNote = String(o.note || (o.existingRecord ? o.existingRecord.note : '') || '').trim();

                    // Xác định giá vốn chuẩn của đơn hàng
                    const finalOrderCogs = calculatedOrderCogs > 0 
                        ? calculatedOrderCogs 
                        : (o.existingRecord && Number(o.existingRecord.cogs) > 0 
                            ? Number(o.existingRecord.cogs)
