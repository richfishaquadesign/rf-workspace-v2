    // HELPER: IN HOÁ ĐƠN BÁN LẺ / CỘNG TÁC VIÊN KHỔ NHIỆT K58 (58MM THERMAL RECEIPT)
    // ==========================================
    function printOrderInvoiceK58({ order, prods = [], accessories = [], erpProducts = [] }) {
        if (!order) return;
        let mainCode = order.orderCode || order.id || '';
        let trackingCode = order.shippingCode || '';
        if (!trackingCode && (mainCode.includes('MVĐ:') || mainCode.includes('|'))) {
            const parts = mainCode.split(/\|\s*MVĐ:\s*|\||MVĐ:\s*/i);
            mainCode = parts[0] || mainCode;
            trackingCode = parts[1] || '';
        } else if (trackingCode) {
            if (mainCode.includes(trackingCode)) mainCode = mainCode.replace(trackingCode, '');
            if (mainCode.includes('|')) mainCode = mainCode.split('|')[0];
            if (mainCode.includes('MVĐ:')) mainCode = mainCode.split('MVĐ:')[0];
        }
        mainCode = mainCode.replace(/[|/\\]+$/, '').trim();
        trackingCode = trackingCode.replace(/^MVĐ:\s*/i, '').trim();

        const orderChannel = String(order.channel || '').trim();
        const isCTVOrder = orderChannel.toUpperCase().includes('CỘNG TÁC VIÊN') || 
                           orderChannel.toUpperCase() === 'CTV' || 
                           String(mainCode).toUpperCase().startsWith('CTV');

        const itemsList = [];
        (prods || []).forEach(p => {
            let pPrice = Number(p.price || 0);
            if (!isCTVOrder && !pPrice && Array.isArray(erpProducts)) {
                const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(p.name || p.type || '').trim().toLowerCase());
                if (match && Number(match.price)) pPrice = Number(match.price);
            }
            itemsList.push({ name: p.name || p.type || (isCTVOrder ? 'Sản phẩm CTV' : 'Sản phẩm xưởng'), price: pPrice, qty: 1 });
        });
        (accessories || []).forEach(a => {
            let aPrice = Number(a.price || 0);
            if (!isCTVOrder && !aPrice && Array.isArray(erpProducts)) {
                const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(a.name || '').trim().toLowerCase());
                if (match && Number(match.price)) aPrice = Number(match.price);
            }
            itemsList.push({ name: a.name || 'Phụ kiện', price: aPrice, qty: Number(a.quantity || 1) });
        });

        const totalQty = itemsList.reduce((sum, i) => sum + (i.qty || 1), 0);
        const knownSum = itemsList.reduce((sum, i) => sum + (i.price * (i.qty || 1)), 0);
        const orderRevenue = Number(order.revenue || 0);
        if (orderRevenue > 0 && totalQty > 0) {
            if (isCTVOrder || knownSum === 0) {
                const avgUnitPrice = Math.round(orderRevenue / totalQty);
                itemsList.forEach(i => { i.price = avgUnitPrice; });
            }
        }

        const subtotal = itemsList.reduce((sum, i) => sum + (i.price * (i.qty || 1)), 0);
        let discount = isCTVOrder ? 0 : Number(order.discount || 0);
        if (!isCTVOrder && subtotal > orderRevenue && discount === 0) {
            discount = subtotal - orderRevenue;
        }
        const prePaid = Number(order.prePaid || 0);
        const codRemain = Math.max(0, orderRevenue - prePaid);
        const createdTimeStr = order.createdAt ? new Date(order.createdAt).toLocaleString('vi-VN') : (order.date || new Date().toLocaleString('vi-VN'));

        const ctvOwner = order.responsibleUser || 'Cộng Tác Viên';
        const clerk = (order.updatedBy && order.updatedBy !== ctvOwner) ? order.updatedBy : (order.createdBy && order.createdBy !== ctvOwner ? order.createdBy : '');

        let itemsHtml = itemsList.map(it => `
            <div style="margin-bottom: 4px; padding-bottom: 3px; border-bottom: 0.5px dotted #ccc;">
                <div style="font-weight: 700; word-break: break-word; line-height: 1.25; font-size: 11px;">${it.name}</div>
                <div style="display: flex; justify-content: space-between; font-size: 10.5px; color: #111; margin-top: 1px;">
                    <span>${it.qty} x ${it.price > 0 ? it.price.toLocaleString('vi-VN') + 'đ' : '---'}</span>
                    <span style="font-weight: 700;">${it.price > 0 ? (it.price * it.qty).toLocaleString('vi-VN') + 'đ' : '---'}</span>
                </div>
            </div>
        `).join('');

        const printContent = `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="utf-8">
                <title>In Hoá Đơn K58 - ${mainCode}</title>
                <style>
                    @page { margin: 0; size: 58mm auto; }

                        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

                    .title { font-size: 15px; font-weight: 900; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
                    .sub-title { font-size: 9px; color: #333; margin-bottom: 3px; }
                    .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
                    .info-label { font-size: 10px; color: #444; }
                    .info-val { font-weight: 700; word-break: break-word; text-align: right; max-width: 65%; }
                </style>
            </head>
            <body>
                <div class="text-center bold title">RF AQUARIUM</div>
                <div class="text-center sub-title">30 Lương Thế Vinh, Thống Nhất, Phú Thọ</div>
                <div class="border-dashed"></div>
                <div class="text-center bold" style="font-size: 13px; margin: 3px 0; text-transform: uppercase;">
                    ${isCTVOrder ? 'HÓA ĐƠN CỘNG TÁC VIÊN' : 'HÓA ĐƠN BÁN LẺ'}
                </div>
                <div class="border-dashed"></div>
                <div class="row"><span class="info-label">Số HĐ:</span><span class="info-val">${mainCode}</span></div>
                ${trackingCode ? `<div class="row"><span class="info-label">Mã VĐ:</span><span class="info-val">${trackingCode}</span></div>` : ''}
                <div class="row"><span class="info-label">ĐVVC:</span><span class="info-val">${order.shippingMethod || order.carrier || (order.channel?.includes('Shopee') ? 'SHOPEE' : 'GỬI GHN')}</span></div>
                <div class="row"><span class="info-label">Kênh bán:</span><span class="info-val">${order.channel || 'RF Aquarium'}</span></div>
                ${isCTVOrder ? `
                    <div class="row"><span class="info-label">CTV bán hàng:</span><span class="info-val bold text-emerald-700">${ctvOwner}</span></div>
                    ${clerk ? `<div class="row"><span class="info-label">NV lên hộ:</span><span class="info-val bold">${clerk}</span></div>` : ''}
                    <div class="row"><span class="info-label">Khách nhận:</span><span class="info-val">${order.customer || 'Khách CTV'}</span></div>
                ` : `
                    ${(order.responsibleUser || order.updatedBy) ? `<div class="row"><span class="info-label">NV bán:</span><span class="info-val bold">${order.responsibleUser || order.updatedBy}</span></div>` : ''}

                `}
                ${order.phone ? `<div class="row"><span class="info-label">Điện thoại:</span><span class="info-val">${order.phone}</span></div>` : ''}
                ${order.address ? `<div class="row" style="align-items: flex-start;"><span class="info-label" style="flex-shrink:0;">Địa chỉ:</span><span class="info-val" style="font-size:10px;">${order.address}</span></div>` : ''}
                <div class="row"><span class="info-label">Thời gian:</span><span class="info-val" style="font-size:10px;">${createdTimeStr}</span></div>
                
                <div class="border-dashed"></div>
                <div style="font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px;">
                    ${isCTVOrder ? 'Mặt hàng xuất cho CTV' : 'Chi tiết sản phẩm'}
                </div>
                ${itemsHtml || '<div style="text-align:center; color:#666;">Không có mặt hàng</div>'}
                
                <div class="border-dashed"></div>
                <div class="row"><span>${isCTVOrder ? 'Tổng tiền xuất xưởng:' : 'Tổng tiền hàng:'}</span><span class="bold">${subtotal.toLocaleString('vi-VN')}đ</span></div>
                ${discount > 0 ? `<div class="row"><span>Giảm giá:</span><span>-${discount.toLocaleString('vi-VN')}đ</span></div>` : ''}
                <div class="row" style="font-size: 12px; margin-top: 2px;">
                    <span class="bold">${isCTVOrder ? 'TỔNG TIỀN XƯỞNG THU:' : 'TỔNG THANH TOÁN:'}</span>
                    <span class="bold" style="font-size: 13px;">${orderRevenue.toLocaleString('vi-VN')}đ</span>
                </div>
                ${prePaid > 0 ? `<div class="row"><span>Đã thanh toán:</span><span class="bold">${prePaid.toLocaleString('vi-VN')}đ</span></div>` : ''}
                <div class="row" style="margin-top: 2px;">
                    <span class="bold">THU TIỀN (COD):</span>
                    <span class="bold" style="font-size: 12px; color: ${codRemain > 0 ? '#000' : '#444'};">${codRemain.toLocaleString('vi-VN')}đ</span>
                </div>
                
                ${order.note ? `
                    <div class="border-dashed"></div>
                    <div style="font-size: 10px;"><span class="bold">Ghi chú:</span> ${order.note}</div>
                ` : ''}
                
                <div class="border-dashed"></div>
                <div class="text-center" style="font-size: 10px; font-style: italic; margin-top: 6px;">
                    ${isCTVOrder ? 'Đơn xuất xưởng cho Cộng Tác Viên<br>🐠 RF AQUARIUM ✨' : 'Cảm ơn quý khách đã tin tưởng & ủng hộ!<br>🐠 RF AQUARIUM ✨'}
                </div>
            </body>
            </html>
        `;
        const win = window.open('', '_blank');
        if (win) {
            win.document.write(printContent);
            win.document.close();
            win.focus();
            setTimeout(() => { win.print(); win.close(); }, 600);
        } else {
            alert('Trình duyệt đang chặn cửa sổ bật lên. Vui lòng cho phép popup để in hoá đơn K58!');

    // ==========================================
    // COMPONENT XEM / TẠO ẢNH HOÁ ĐƠN BÁN LẺ & CTV & IN PHIẾU K58
    // ==========================================
    function OrderInvoiceModal({ order, prods, accessories, erpProducts, onClose, triggerToast }) {
        const [receiptImageUrl, setReceiptImageUrl] = React.useState('');
        const [isGeneratingImg, setIsGeneratingImg] = React.useState(false);
        const printRef = React.useRef();

        if (!order) return null;

        let mainCode = order.orderCode || order.id || '';
        let trackingCode = order.shippingCode || '';
        if (!trackingCode && (mainCode.includes('MVĐ:') || mainCode.includes('|'))) {
            const parts = mainCode.split(/\|\s*MVĐ:\s*|\||MVĐ:\s*/i);
            mainCode = parts[0] || mainCode;
            trackingCode = parts[1] || '';
        } else if (trackingCode) {
            if (mainCode.includes(trackingCode)) mainCode = mainCode.replace(trackingCode, '');
            if (mainCode.includes('|')) mainCode = mainCode.split('|')[0];
            if (mainCode.includes('MVĐ:')) mainCode = mainCode.split('MVĐ:')[0];
        }
        mainCode = mainCode.replace(/[|/\\]+$/, '').trim();
        trackingCode = trackingCode.replace(/^MVĐ:\s*/i, '').trim();

        const orderChannel = String(order.channel || '').trim();
        const isCTVOrder = orderChannel.toUpperCase().includes('CỘNG TÁC VIÊN') || 
                           orderChannel.toUpperCase() === 'CTV' || 
                           String(mainCode).toUpperCase().startsWith('CTV');

        const ctvOwner = order.responsibleUser || 'Cộng Tác Viên';
        const clerk = (order.updatedBy && order.updatedBy !== ctvOwner) ? order.updatedBy : (order.createdBy && order.createdBy !== ctvOwner ? order.createdBy : '');

        const generateReceiptCanvas = React.useCallback(() => {
            setIsGeneratingImg(true);
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const width = 380;
                
                const itemsList = [];
                (prods || []).forEach(p => {
                    let pPrice = Number(p.price || 0);
                    if (!isCTVOrder && !pPrice && Array.isArray(erpProducts)) {
                        const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(p.name || p.type || '').trim().toLowerCase());
                        if (match && Number(match.price)) pPrice = Number(match.price);
                    }
                    itemsList.push({ name: p.name || p.type || (isCTVOrder ? 'Sản phẩm CTV' : 'Sản phẩm'), price: pPrice, qty: 1 });
                });
                (accessories || []).forEach(a => {
                    let aPrice = Number(a.price || 0);
                    if (!isCTVOrder && !aPrice && Array.isArray(erpProducts)) {
                        const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(a.name || '').trim().toLowerCase());
                        if (match && Number(match.price)) aPrice = Number(match.price);
                    }
                    itemsList.push({ name: a.name || 'Phụ kiện', price: aPrice, qty: Number(a.quantity || 1) });
                });

                // Phân bổ giá bán thông minh từ Tổng Doanh Thu nếu là đơn CTV hoặc chưa có giá riêng
                const totalQty = itemsList.reduce((sum, i) => sum + (i.qty || 1), 0);
                const knownSum = itemsList.reduce((sum, i) => sum + (i.price * (i.qty || 1)), 0);
                const orderRevenue = Number(order.revenue || 0);
                if (orderRevenue > 0 && totalQty > 0) {
                    if (isCTVOrder || knownSum === 0) {
                        const avgUnitPrice = Math.round(orderRevenue / totalQty);
                        itemsList.forEach(i => { i.price = avgUnitPrice; });
                    }
                }

                // Tính toán chiều cao linh hoạt
                let estimatedHeight = 350;
                ctx.font = '12px Arial, sans-serif';
                itemsList.forEach(item => {
                    const words = item.name.split(' ');
                    let line = '';
                    let lineCount = 1;
                    for (let w = 0; w < words.length; w++) {
                        if (ctx.measureText(line + words[w] + ' ').width > 200) {
                            lineCount++;
                            line = words[w] + ' ';
                        } else {
                            line += words[w] + ' ';
                        }
                    }
                    estimatedHeight += (lineCount * 18) + 16;
                });

                const noteText = order.note || '';
                if (noteText) {
                    estimatedHeight += Math.ceil(noteText.length / 32) * 18 + 10;
                }

                canvas.width = width;
                canvas.height = Math.max(500, Math.min(1600, estimatedHeight));

                // Nền trắng
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let y = 35;
                ctx.fillStyle = '#000000';
                
                // Tiêu đề HÓA ĐƠN
                ctx.textAlign = 'center';
                ctx.font = 'bold 20px "Courier New", monospace, Arial';
                ctx.fillText(isCTVOrder ? 'HÓA ĐƠN CỘNG TÁC VIÊN' : 'HÓA ĐƠN BÁN LẺ', width / 2, y);
                y += 30;

                // Các dòng thông tin đơn hàng
                ctx.textAlign = 'left';
                ctx.font = '12px Arial, sans-serif';

                const drawInfoLine = (label, val, boldVal = false) => {
                    if (!val && val !== 0 && val !== '0') return;
                    ctx.font = 'bold 12px Arial, sans-serif';
                    ctx.fillText(label, 15, y);
                    const labelWidth = ctx.measureText(label).width;
                    ctx.font = boldVal ? 'bold 12px Arial, sans-serif' : '12px Arial, sans-serif';
                    
                    const maxValW = width - 30 - labelWidth;
                    const valStr = String(val);
                    if (ctx.measureText(valStr).width > maxValW) {
                        const words = valStr.split(' ');
                        let line = '';
                        let isFirst = true;
                        for (let w = 0; w < words.length; w++) {
                            if (ctx.measureText(line + words[w] + ' ').width > maxValW) {
                                ctx.fillText(line.trim(), isFirst ? 15 + labelWidth : 15, y);
                                y += 18;
                                line = words[w] + ' ';
                                isFirst = false;
                            } else {
                                line += words[w] + ' ';
                            }
                        }
                        if (line.trim()) {
                            ctx.fillText(line.trim(), isFirst ? 15 + labelWidth : 15, y);
                            y += 18;
                        }
                    } else {
                        ctx.fillText(valStr, 15 + labelWidth, y);
                        y += 18;
                    }
                };

                drawInfoLine('Số HĐ: ', mainCode, true);
                if (trackingCode) drawInfoLine('Mã VĐ: ', trackingCode);
                drawInfoLine('ĐVVC: ', order.shippingMethod || order.carrier || (order.channel?.includes('Shopee') ? 'SHOPEE' : 'GỬI GHN'));
                drawInfoLine('Kênh bán: ', order.channel || 'RF Aquarium');
                
                if (isCTVOrder) {
                    drawInfoLine('CTV bán hàng: ', ctvOwner, true);
                    if (clerk) drawInfoLine('NV lên đơn hộ: ', clerk, true);
                    drawInfoLine('Khách nhận: ', order.customer || 'Khách CTV');
                } else {
                    if (order.responsibleUser || order.updatedBy) drawInfoLine('NV bán: ', order.responsibleUser || order.updatedBy, true);
                    drawInfoLine('Khách hàng: ', order.customer || 'Khách lẻ');
                }
                
                if (order.phone) drawInfoLine('Số điện thoại: ', order.phone);
                if (order.note) drawInfoLine('Ghi chú: ', order.note);

                // Đường kẻ phân cách
                y += 5;
                ctx.font = '12px monospace';
                ctx.fillText('----------------------------------------------------', 10, y);
                y += 18;

                // Tiêu đề bảng hàng hóa
                ctx.font = 'bold 12px Arial, sans-serif';
                ctx.fillText(isCTVOrder ? 'Mặt hàng xuất CTV' : 'Tên hàng hóa', 15, y);
                ctx.textAlign = 'right';
                ctx.fillText('Đ. giá', 300, y);
                ctx.fillText('SL', 365, y);
                y += 14;

                ctx.textAlign = 'left';
                ctx.font = '12px monospace';
                ctx.fillText('----------------------------------------------------', 10, y);
                y += 18;

                // In từng dòng sản phẩm
                itemsList.forEach(item => {
                    ctx.font = 'bold 12px Arial, sans-serif';
                    const words = item.name.split(' ');
                    let line = '';
                    for (let w = 0; w < words.length; w++) {
                        if (ctx.measureText(line + words[w] + ' ').width > 220) {
                            ctx.fillText(line.trim(), 15, y);
                            y += 18;
                            line = words[w] + ' ';
                        } else {
                            line += words[w] + ' ';
                        }
                    }
                    if (line.trim()) {
                        ctx.fillText(line.trim(), 15, y);
                    }

                    // Giá & SL
                    ctx.font = '12px Arial, sans-serif';
                    ctx.textAlign = 'right';
                    const priceText = item.price > 0 ? item.price.toLocaleString('vi-VN') : '---';
                    ctx.fillText(priceText, 300, y);
                    ctx.fillText(String(item.qty), 365, y);

                    ctx.textAlign = 'left';
                    y += 22;
                });

                // Đường kẻ phân cách
                ctx.font = '12px monospace';
                ctx.fillText('----------------------------------------------------', 10, y);
                y += 22;

                // Khung tổng tiền
                const drawTotalRow = (label, valStr, isBold = false) => {
                    ctx.font = isBold ? 'bold 13px Arial, sans-serif' : '12px Arial, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(label, 15, y);
                    ctx.textAlign = 'right';
                    ctx.fillText(valStr, 365, y);
                    y += 22;
                };

                const subtotal = itemsList.reduce((sum, i) => sum + (i.price * (i.qty || 1)), 0);
                const orderDiscount = isCTVOrder ? 0 : Number(order.discount || 0);
                let calculatedDiscount = orderDiscount;
                if (!isCTVOrder && subtotal > orderRevenue && orderDiscount === 0) {
                    calculatedDiscount = subtotal - orderRevenue;
                }

                const subtotalStr = subtotal.toLocaleString('vi-VN');
                const discountStr = calculatedDiscount > 0 ? calculatedDiscount.toLocaleString('vi-VN') : '0';
                const revStr = orderRevenue.toLocaleString('vi-VN');
                const paidStr = Number(order.prePaid || 0) > 0 ? Number(order.prePaid).toLocaleString('vi-VN') : '---';
                const codRemain = Math.max(0, orderRevenue - Number(order.prePaid || 0));
                const codStr = codRemain.toLocaleString('vi-VN');
                const createdTimeStr = order.createdAt || order.date || new Date().toLocaleString('vi-VN');

                drawTotalRow(isCTVOrder ? 'Tổng tiền xuất xưởng:' : 'Tổng tiền hàng:', subtotalStr, true);
                if (!isCTVOrder) drawTotalRow('Giảm giá:', discountStr);
                drawTotalRow(isCTVOrder ? 'TỔNG TIỀN XƯỞNG THU:' : 'Tổng thanh toán:', revStr, true);
                drawTotalRow('Đã thanh toán:', paidStr);
                drawTotalRow('THU TIỀN (COD):', codStr, true);
                drawTotalRow('Thời gian tạo:', createdTimeStr);

                // Đường kẻ kéo cắt ở cuối
                y += 5;
                ctx.font = '12px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('✂--------------------------------------------------', 10, y);

                const dataUrl = canvas.toDataURL('image/png');
                canvas.width = 1;
                canvas.height = 1;
                setReceiptImageUrl(dataUrl);
            } catch (err) {
                console.error("Lỗi tạo ảnh hoá đơn:", err);
            } finally {
                setIsGeneratingImg(false);
            }
        }, [order, prods, accessories, mainCode, isCTVOrder, ctvOwner, clerk]);

        React.useEffect(() => {
            generateReceiptCanvas();
            return () => {
                setReceiptImageUrl('');
            };
        }, [generateReceiptCanvas]);

        const handleDownloadImage = () => {
            if (!receiptImageUrl) return;
            const a = document.createElement('a');
            a.href = receiptImageUrl;
            a.download = `HoaDon_${mainCode}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            if (typeof triggerToast === 'function') {
                triggerToast('Đã tải ảnh hoá đơn về máy thành công!', 'fa-download', 'success');
            } else {
                alert('Đã tải ảnh hoá đơn về máy thành công!');
            }
        };

        const handleCopyImage = () => {
            if (!receiptImageUrl) return;
            fetch(receiptImageUrl)
                .then(res => res.blob())
                .then(blob => {
                    if (navigator.clipboard && window.ClipboardItem) {
                        return navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                    } else {
                        throw new Error('Trình duyệt chưa hỗ trợ sao chép ảnh trực tiếp, tự động chuyển sang tải ảnh.');

        const handlePrintDirectK58 = () => {

        const handleCopySummary = () => {
            const formattedRevenue = Number(order.revenue || 0).toLocaleString('vi-VN');
            const formattedPrePaid = Number(order.prePaid || 0).toLocaleString('vi-VN');
            const codRemain = Math.max(0, Number(order.revenue || 0) - Number(order.prePaid || 0));
            const formattedCodRemain = codRemain.toLocaleString('vi-VN');

            let text = isCTVOrder 
                ? `📄 HÓA ĐƠN CỘNG TÁC VIÊN - RF AQUARIUM\n`

            text += `------------------------------------\n`;
            text += `Số HĐ: ${mainCode}\n`;
            if (trackingCode) text += `Mã VĐ: ${trackingCode}\n`;
            text += `Kênh bán: ${order.channel || 'Cộng Tác Viên'}\n`;
            if (isCTVOrder) {
                text += `CTV bán hàng: ${ctvOwner}\n`;
                if (clerk) text += `NV lên đơn hộ: ${clerk}\n`;

            } else {

            }
            if (order.phone) text += `SĐT: ${order.phone}\n`;
            text += `------------------------------------\n`;
            text += `DANH SÁCH MẶT HÀNG:\n`;
            
            let count = 1;
            (prods || []).forEach(p => { text += `${count++}. ${p.name || p.type} (x1)\n`; });
            (accessories || []).forEach(a => { text += `${count++}. ${a.name} (x${a.quantity || 1})\n`; });
            
            let subtotal = 0;
            (prods || []).forEach(p => {
                let pPrice = Number(p.price || 0);
                if (!isCTVOrder && !pPrice && Array.isArray(erpProducts)) {
                    const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(p.name || p.type || '').trim().toLowerCase());
                    if (match && Number(match.price)) pPrice = Number(match.price);
                }
                subtotal += pPrice;
            });
            (accessories || []).forEach(a => {
                let aPrice = Number(a.price || 0);
                if (!isCTVOrder && !aPrice && Array.isArray(erpProducts)) {
                    const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(a.name || '').trim().toLowerCase());
                    if (match && Number(match.price)) aPrice = Number(match.price);
                }
                subtotal += aPrice * Number(a.quantity || 1);
            });
            const totalQty = (prods || []).length + (accessories || []).reduce((sum, a) => sum + Number(a.quantity || 1), 0);
            if ((isCTVOrder || subtotal === 0) && Number(order.revenue || 0) > 0 && totalQty > 0) {
                subtotal = Number(order.revenue || 0);
            }
            let calculatedDiscount = isCTVOrder ? 0 : Number(order.discount || 0);
            if (!isCTVOrder && subtotal > Number(order.revenue || 0) && calculatedDiscount === 0) {
                calculatedDiscount = subtotal - Number(order.revenue || 0);
            }

            text += `------------------------------------\n`;
            text += `${isCTVOrder ? 'Tổng tiền xuất xưởng:' : 'Tổng tiền hàng:'} ${subtotal.toLocaleString('vi-VN')}đ\n`;
            if (!isCTVOrder && calculatedDiscount > 0) text += `Giảm giá: ${calculatedDiscount.toLocaleString('vi-VN')}đ\n`;
            text += `${isCTVOrder ? 'TỔNG TIỀN XƯỞNG THU:' : 'Tổng thanh toán:'} ${formattedRevenue}đ\n`;
            if (Number(order.prePaid) > 0) text += `Đã thanh toán: ${formattedPrePaid}đ\n`;
            text += `Còn lại thu (COD): ${formattedCodRemain}đ\n`;
            if (order.note) text += `Ghi chú: ${order.note}\n`;
            text += `------------------------------------\n`;
            text += isCTVOrder 
                ? `Đơn xuất xưởng cho Cộng Tác Viên - RF AQUARIUM! 🐠✨` 
                : `Cảm ơn quý khách đã ủng hộ RF AQUARIUM! 🐠✨`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
            } else {
                const el = document.createElement('textarea');
                el.value = text; document.body.appendChild(el); el.select();
                document.execCommand('copy'); document.body.removeChild(el);
            }

            if (typeof triggerToast === 'function') {
                triggerToast('Đã sao chép nội dung văn bản hoá đơn!', 'fa-copy', 'success');
            } else {
                alert('Đã sao chép nội dung văn bản hoá đơn!');
            }
        };

        return ReactDOM.createPortal(
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[9999] flex items-center justify-center p-4 overflow-y-auto animate-fade-in" onClick={onClose}>
                <div className="bg-[#12131a] border border-[#2e3248] rounded-2xl w-full max-w-xl shadow-2xl overflow-hidden flex flex-col my-auto max-h-[92vh]" onClick={e => e.stopPropagation()}>
                    
                    {/* MODAL HEADER TOOLBAR */}
                    <div className="bg-[#1a1c29] px-4 py-3 border-b border-[#2e3248] flex items-center justify-between shrink-0">
                        <div className="flex items-center gap-2.5">
                            <div className="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold">
                                <i className="fas fa-file-invoice text-base"></i>
                            </div>
                            <div>
                                <h3 className="font-extrabold text-white text-sm tracking-wide flex items-center gap-1.5">
                                    <span>{isCTVOrder ? 'HÓA ĐƠN CỘNG TÁC VIÊN' : 'HÓA ĐƠN BÁN LẺ'}</span>
                                    {isCTVOrder && (
                                        <span className="text-[10px] font-bold px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
                                            CTV
                                        </span>
                                    )}
                                </h3>
                                <p className="text-[11px] text-slate-400 font-medium">{mainCode}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button
                                onClick={handlePrintDirectK58}
                                className="px-3 py-1.5 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white rounded-xl text-xs font-black transition shadow-lg flex items-center gap-1.5 cursor-pointer border border-amber-400/30 active:scale-95"
                                title="In hoá đơn trực tiếp ra máy in nhiệt khổ K58 (58mm)"
                            >
                                <i className="fas fa-print"></i>
                                <span>{isCTVOrder ? 'In HĐ CTV (K58)' : 'In Hoá Đơn K58'}</span>
                            </button>
                            <button
                                onClick={handleCopyImage}
                                className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition shadow flex items-center gap-1.5 cursor-pointer border border-blue-400/30"
                                title="Sao chép ảnh hoá đơn để dán vào Zalo/Facebook (Ctrl+V)"
                            >
                                <i className="fas fa-copy"></i>
                                <span>Sao Chép Ảnh</span>
                            </button>
                            <button
                                onClick={handleDownloadImage}
                                className="px-3 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl text-xs font-black transition shadow-lg flex items-center gap-1.5 cursor-pointer border border-emerald-400/30"
                                title="Tải file ảnh PNG về máy"
                            >
                                <i className="fas fa-download"></i>
                                <span>Tải Ảnh PNG</span>
                            </button>
                            <button
                                onClick={onClose}
                                className="px-3.5 py-1.5 bg-rose-500/15 hover:bg-rose-600 text-rose-300 hover:text-white rounded-xl flex items-center gap-1.5 transition cursor-pointer border border-rose-500/30 text-xs font-black active:scale-95 ml-1"
                                title="Đóng (Esc)"
                            >
                                <i className="fas fa-times text-xs font-bold"></i>
                                <span>Đóng</span>
                            </button>
                        </div>
                    </div>

                    {/* MODAL BODY - IMAGE PREVIEW CONTAINER */}
                    <div className="p-5 overflow-y-auto custom-scrollbar flex-1 bg-[#0a0b0e] flex flex-col items-center justify-center">
                        {isGeneratingImg && (
                            <div className="py-12 text-center text-slate-400 text-xs font-bold space-y-2">

                                <p>Đang khởi tạo ảnh {isCTVOrder ? 'Hóa Đơn Cộng Tác Viên' : 'Hóa Đơn Bán Lẻ'}...</p>

                        {!isGeneratingImg && receiptImageUrl && (
                            <div className="flex flex-col items-center space-y-3 w-full">

                        <button

                            className="text-xs text-amber-400 hover:text-amber-300 font-bold flex items-center gap-1 cursor-pointer"
                        >
                            <i className="fas fa-file-alt"></i> Sao Chép Văn Bản Tóm Tắt

                            <button
                                onClick={handlePrintDirectK58}

            </div>,
            document.body

    // ==========================================
    // 2.5. MODAL XEM LỊCH SỬ CHỈNH SỬA ĐƠN HÀNG CÔNG KHAI
    // ==========================================
    function OrderHistoryModal({ order, onClose }) {
        if (!order) return null;
        const rawNote = String(order.note || '');
        const notes = rawNote.split('\n');
        const historyLines = notes.filter(line => line.includes('LỊCH SỬ') || line.includes('APPEAL') || line.includes('Video') || line.trim().startsWith('['));
        const otherNotes = notes.filter(line => !line.includes('LỊCH SỬ') && !line.includes('APPEAL') && !line.includes('Video') && !line.trim().startsWith('[')).join('\n').trim();

        return (
            <div className="fixed inset-0 bg-black/85 z-[99999] flex items-center justify-center p-4 backdrop-blur-md animate-fade-in" onClick={onClose}>

                        <button type="button" onClick={onClose} className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-zinc-800 hover:bg-rose-600 text-zinc-300 hover:text-white flex items-center justify-center transition-all cursor-pointer shadow-lg z-50 shrink-0 border border-white/10" title="Đóng (Esc)">
                            <i className="fas fa-times text-sm font-bold"></i>
                        </button>

                    <div className="space-y-3 max-h-[60vh] overflow-y-auto custom-scrollbar pr-1">

                            <div className="text-gray-400">Trạng thái: <span className="text-emerald-400 font-bold">{order.status}</span></div>

                        {otherNotes && (

                                <div className="text-gray-300 whitespace-pre-wrap">{otherNotes}</div>
                            </div>
                        )}

                        <div className="space-y-2">
                            <div className="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i className="fas fa-stream text-blue-400"></i> Nhật ký thay đổi công khai ({historyLines.length})
                            </div>
                            {historyLines.length === 0 ? (
                                <div className="text-center text-gray-500 text-xs italic py-4 bg-[#0a0a0a] rounded-xl border border-[#222]">Chưa có lịch sử chỉnh sửa chi tiết.</div>
                            ) : (
                                historyLines.map((line, idx) => (
                                    <div key={idx} className="bg-[#0a0a0a] border border-[#2a2a2a] p-3 rounded-xl text-xs text-gray-300 flex items-start gap-2.5 hover:border-blue-500/30 transition-colors">
                                        <i className="fas fa-edit text-amber-400 mt-0.5 shrink-0"></i>
                                        <div className="leading-relaxed font-mono text-[11px] text-gray-200">{line}</div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    <button onClick={onClose} className="w-full py-2.5 bg-[#222] hover:bg-[#333] text-gray-300 font-bold text-xs uppercase rounded-xl transition-all">
                        Đóng
                    </button>
                </div>
            </div>
        );
    }

    // MODAL TRUY VẾT & GÁN HIỆN VẬT XUẤT KHO (SERIAL BỂ KÍNH & KCS LAYOUT)
    // =========================================================================
    function ModalAssignStockItem({
        targetItem, order, erpData, prodItems = [], onClose, pushDeltas, triggerToast, setOptimisticOrder, prods = [], currentUser
    }) {
        const [processing, setProcessing] = React.useState(false);
        const [serialInput, setSerialInput] = React.useState('');
        const [selectedLayoutId, setSelectedLayoutId] = React.useState(null);
        const [stockItems, setStockItems] = React.useState([]);
        const [isLoading, setIsLoading] = React.useState(true);

        const itemName = targetItem?.name || '';
        const isGlass = /bể|kính|terarium|bán cạn|betta/i.test(itemName || targetItem?.type || '');

        // Lấy danh sách hàng tồn khả dụng
        React.useEffect(() => {
            let isMounted = true;
            setIsLoading(true);

            // 1. Quét từ local CSDL trước để hiện tức thì
            const allProds = erpData?.Production || prodItems || [];
            const cleanTargetName = String(itemName).trim().toLowerCase().replace(/[\u2010-\u2015\u2212-]/g, '-').replace(/\s+/g, ' ');
            
            const localMatches = allProds.filter(p => {
                if (!p) return false;
                const pUsed = String(p.usedByOrderCode || '').trim();
                if (pUsed) return false; // Đã bị đơn khác gán
                const pStatus = String(p.status || '').toUpperCase().trim();
                const isDone = pStatus === 'DONE' || pStatus === 'ĐÃ XONG' || pStatus === 'HOÀN KHO ĐẠT' || p.p1_status === 'Done';
                if (!isDone) return false;
                const pName = String(p.name || '').trim().toLowerCase().replace(/[\u2010-\u2015\u2212-]/g, '-').replace(/\s+/g, ' ');
                return pName === cleanTargetName || pName.includes(cleanTargetName) || cleanTargetName.includes(pName);
            }).map(p => {
                let sCode = p.serialCode || '';
                if (!sCode && isGlass) {
                    const numOnly = String(p.id || '').replace(/\D/g, '');
                    sCode = '#' + (numOnly.length >= 4 ? numOnly.slice(-4) : (p.id || '0000').slice(-4));
                }
                return {
                    id: p.id,
                    name: p.name,
                    serialCode: sCode,
                    p1_user: p.phases?.phase1?.user || p.p1_user || '',
                    p1_name: p.phases?.phase1?.name || (isGlass ? 'Cắt Dán' : 'Dựng Khung'),
                    p2_user: p.phases?.phase2?.user || p.p2_user || '',
                    p2_name: p.phases?.phase2?.name || (isGlass ? 'Gọt Keo' : 'Gia Cố'),
                    p1_photo: p.phases?.phase1?.photo || p.p1_photo || '',
                    p2_photo: p.phases?.phase2?.photo || p.p2_photo || '',
                    qc_front_photo: p.qc_front_photo || p.phases?.phase2?.photo || p.p2_photo || p.phases?.phase1?.photo || '',
                    date: p.phases?.phase2?.date || p.phases?.phase1?.date || p.deadline || ''
                };
            });

            setStockItems(localMatches);
            setIsLoading(false);

            // 2. Đồng thời gọi backend để lấy dữ liệu realtime mới nhất
            if (typeof window.runGAS === 'function') {
                window.runGAS('getAvailableStockItems', { sku: itemName, type: isGlass ? 'Bể Kính' : 'Layout' })
                    .then(res => {
                        if (isMounted && res && res.success && Array.isArray(res.items) && res.items.length > 0) {
                            setStockItems(res.items);
                        }
                    })
                    .catch(() => {});
            }

            return () => { isMounted = false; };
        }, [itemName, isGlass, erpData?.Production, prodItems]);

        // Xử lý xác nhận xuất kho
        const handleConfirmAssign = async () => {
            let targetStock = null;
            let targetSerial = '';

            if (isGlass) {
                const cleanInput = serialInput.trim().toUpperCase().replace(/^#/, '');
                if (!cleanInput) {
                    triggerToast('Vui lòng nhập 4 số dưới đáy bể hoặc chọn mã có sẵn!', 'fa-exclamation-triangle', 'warning');
                    return;
                }
                targetSerial = '#' + cleanInput;
                targetStock = stockItems.find(s => String(s.serialCode || '').toUpperCase().replace(/^#/, '') === cleanInput);
                if (!targetStock) {
                    // Tạo một object đại diện nếu người dùng nhập mã thực tế trên đáy bể mà chưa có trong danh sách
                    targetStock = {
                        id: 'PROD_STOCK_' + cleanInput,
                        name: itemName,
                        serialCode: targetSerial,
                        p1_user: 'Thợ Dán (Đáy ' + targetSerial + ')',
                        p2_user: 'Thợ Gọt (Đáy ' + targetSerial + ')'
                    };
                }
            } else {
                if (!selectedLayoutId) {
                    triggerToast('Vui lòng chạm chọn 1 ảnh KCS giống nhất với layout trên tay!', 'fa-exclamation-triangle', 'warning');
                    return;
                }
                targetStock = stockItems.find(s => s.id === selectedLayoutId);
                if (!targetStock) return;
            }

            setProcessing(true);
            try {
                const orderCode = order.orderCode || order.id;
                
                // Gọi API backend khóa lệnh tồn
                if (typeof window.runGAS === 'function') {
                    window.runGAS('assignStockItemToOrder', {
                        prodId: targetStock.id,
                        orderCode: orderCode,
                        serialCode: targetSerial || targetStock.serialCode || ''
                    }).catch(console.error);
                }

                // Cập nhật Optimistic UI cho client ngay lập tức
                const updatedProds = (prods || []).map(p => {
                    if (p.id === targetItem.id || String(p.name).trim().toLowerCase() === String(targetItem.name).trim().toLowerCase()) {
                        return {
                            ...p,
                            serialCode: targetSerial || targetStock.serialCode || '',
                            p1_user: targetStock.p1_user,
                            p2_user: targetStock.p2_user,
                            p1_photo: targetStock.p1_photo,
                            p2_photo: targetStock.p2_photo,
                            qc_front_photo: targetStock.qc_front_photo,
                            usedStockId: targetStock.id,
                            phases: {
                                ...(p.phases || {}),
                                phase1: { ...(p.phases?.phase1 || {}), user: targetStock.p1_user, photo: targetStock.p1_photo, status: 'Done' },
                                phase2: { ...(p.phases?.phase2 || {}), user: targetStock.p2_user, photo: targetStock.p2_photo, status: 'Done' }
                            },
                            _origin: {
                                p1User: targetStock.p1_user,
                                p2User: targetStock.p2_user,
                                p1Name: isGlass ? 'Cắt Dán' : 'Dựng Khung',
                                p2Name: isGlass ? 'Gọt Keo' : 'Gia Cố',
                                serialCode: targetSerial || targetStock.serialCode || '',
                                photo: targetStock.qc_front_photo || targetStock.p2_photo || ''
                            }
                        };
                    }
                    return p;
                });

                // Cập nhật bản ghi Production tồn trong client nếu có
                const updatedStockProd = {
                    ...targetStock,
                    usedByOrderCode: orderCode,
                    usedAt: new Date().toISOString()
                };

                await pushDeltas({
                    prodItems: [
                        ...updatedProds.filter(p => p.id === targetItem.id),
                        updatedStockProd
                    ]
                }, isGlass ? `Đã xác nhận xuất bể Serial ${targetSerial || targetStock.serialCode}!` : `Đã xác nhận xuất layout khớp KCS!`, 'fa-check');

                triggerToast(isGlass ? `Đã gắn mã đáy bể ${targetSerial || targetStock.serialCode} vào đơn!` : `Đã gắn layout KCS của thợ ${targetStock.p1_user} vào đơn!`, 'fa-check-circle', 'success');
                onClose();
            } catch (err) {
                triggerToast('Lỗi gán hiện vật: ' + err.toString(), 'fa-times', 'danger');
            } finally {
                setProcessing(false);
            }
        };

        // NÚT CỨU NGUY: KHÔNG TÌM THẤY HIỆN VẬT TRÊN KỆ (BỊ VỠ/MẤT -> CHUYỂN SẢN XUẤT MỚI)
        const handleReportMissingItem = async () => {
            const confirmMsg = `⚠️ BÁO CÁO THẤT LẠC / HỎNG HIỆN VẬT TRÊN KỆ:\n\nBạn xác nhận không tìm thấy sản phẩm [${itemName}] trên kệ kho (hoặc bị vỡ/hỏng)?\n\nHệ thống sẽ hủy trạng thái xuất kho có sẵn và tạo lệnh xưởng mới cho đơn hàng [${order.orderCode || order.id}] vào mục "CHỜ SẢN XUẤT" để thợ dán/dựng lại ngay lập tức.`;
            if (!window.confirm(confirmMsg)) return;

            setProcessing(true);
            try {
                const nowTimeStr = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                const currentNote = String(order.note || '');
                const missingNote = `[Kho báo thiếu hiện vật kệ lúc ${nowTimeStr} - Ưu tiên xưởng sản xuất mới]`;
                const targetOrderCode = String(order.orderCode || order.id || '').trim();
                const isGlassItem = /bể|hồ|tank|be |ho |kính/i.test(String(targetItem.name || ''));

                // Cập nhật mảng accessories để đồng bộ cờ hasProduction
                let updatedAccessories = order.accessories;
                if (typeof updatedAccessories === 'string') {
                    try {
                        const parsedAcc = JSON.parse(updatedAccessories);
                        if (Array.isArray(parsedAcc)) {
                            let matched = false;
                            parsedAcc.forEach(a => {
                                if (String(a.name || '').trim().toLowerCase() === String(targetItem.name || '').trim().toLowerCase()) {
                                    a.hasProduction = true;
                                    matched = true;
                                }
                            });
                            if (!matched) {
                                parsedAcc.push({ name: targetItem.name, quantity: 1, price: 0, hasProduction: true });
                            }
                            updatedAccessories = JSON.stringify(parsedAcc);
                        }
                    } catch (err) {
                        console.warn("Lỗi parse accessories:", err);
                    }
                }

                const updatedOrder = {
                    ...order,
                    status: 'Chờ Sản Xuất',
                    hasProduction: true,
                    accessories: updatedAccessories,
                    note: currentNote ? `${missingNote} | ${currentNote}` : missingNote
                };

                // Đảm bảo ID lệnh sản xuất chuẩn, không để ID tạm acc_prod_
                const prodId = (!targetItem.id || String(targetItem.id).startsWith('acc_prod_')) 
                    ? ('PROD_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5))
                    : targetItem.id;

                const workerPhases = {
                    phase1: { name: (isGlassItem ? 'Cắt Dán' : 'Dựng Khung'), status: 'Pending', user: '', start: '', endTime: '', photo: '', reward_vnd: 0 },
                    phase2: { name: (isGlassItem ? 'Gọt Keo' : 'Gia Cố'), status: 'Pending', user: '', start: '', endTime: '', photo: '', reward_vnd: 0 }
                };

                const updatedTargetProd = {
                    ...targetItem,
                    id: prodId,
                    orderId: targetOrderCode,
                    type: isGlassItem ? 'Bể Kính' : 'Layout',
                    name: targetItem.name,
                    status: 'Pending',
                    fulfilledFromStock: false,
                    p1_name: isGlassItem ? 'Cắt Dán' : 'Dựng Khung',
                    p1_status: 'Pending',
                    p1_user: '',
                    p1_start: '',
                    p1_endTime: '',
                    p1_photo: '',
                    p1_reward_vnd: 0,
                    p2_name: isGlassItem ? 'Gọt Keo' : 'Gia Cố',
                    p2_status: 'Pending',
                    p2_user: '',
                    p2_start: '',
                    p2_endTime: '',
                    p2_photo: '',
                    p2_reward_vnd: 0,
                    phases: workerPhases,
                    qc_status: '',
                    qc_front_photo: '',
                    qc_side_photo: '',
                    qc_note: '',
                    serialCode: '',
                    usedByOrderCode: '',
                    usedAt: '',
                    deadline: order.deadline || targetItem.deadline || '',
                    note: `[LÀM MỚI] Kệ kho báo thất lạc - Ưu tiên sản xuất mới cho đơn`
                };

                if (setOptimisticOrder) setOptimisticOrder(updatedOrder);

                await pushDeltas({
                    orders: [updatedOrder],
                    prodItems: [updatedTargetProd]
                }, 'Đã tạo lệnh xưởng & chuyển đơn sang Chờ Sản Xuất!', 'fa-bolt');

                triggerToast(`Đã tạo lệnh xưởng cho đơn ${order.orderCode || order.id}!`, 'fa-bolt', 'success');
                onClose();
            } catch (e) {
                triggerToast('Lỗi cập nhật: ' + e.toString(), 'fa-times', 'danger');
            } finally {
                setProcessing(false);
            }
        };

        return (
            <div className="fixed inset-0 z-[999999] bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 animate-fade-in select-none" onClick={onClose}>
                <div className="bg-[#121214] border border-white/[0.15] rounded-3xl p-4 sm:p-6 max-w-lg w-full shadow-[0_0_50px_rgba(0,0,0,0.8)] space-y-4 max-h-[92vh] flex flex-col relative" onClick={e => e.stopPropagation()}>
                    
                    {/* HEADER */}
                    <div className="flex items-start justify-between border-b border-white/[0.08] pb-3 shrink-0">
                        <div className="flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 border ${isGlass ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'}`}>
                                <i className={`fas ${isGlass ? 'fa-barcode text-lg' : 'fa-camera-retro text-lg'}`}></i>
                            </div>
                            <div className="min-w-0">
                                <h3 className="text-sm sm:text-base font-black uppercase text-white tracking-wider truncate">
                                    {isGlass ? 'Xác Thực Mã Serial Đáy Bể' : 'Chọn Layout Khớp Ảnh KCS Kho'}
                                </h3>
                                <p className="text-[10.5px] text-zinc-400 truncate mt-0.5">
                                    Đơn: <span className="font-mono text-amber-400 font-bold">{order.orderCode || order.id}</span> • {itemName}
                                </p>
                            </div>
                        </div>
                        <button type="button" onClick={onClose} className="px-3.5 py-1.5 bg-rose-500/15 hover:bg-rose-600 text-rose-300 hover:text-white rounded-xl flex items-center gap-1.5 transition-all cursor-pointer shadow-md z-50 shrink-0 border border-rose-500/30 text-xs font-black active:scale-95" title="Đóng (Esc)">
                            <i className="fas fa-times text-sm font-bold"></i>
                            <span>Đóng</span>
                        </button>
                    </div>

                    {/* BODY CONTENT */}
                    <div className="flex-1 overflow-y-auto space-y-4 pr-1 min-h-0">
                        {isGlass ? (
                            /* ===== GIAO DIỆN BỂ KÍNH (SERIAL CODE) ===== */
                            <div className="space-y-4">
                                <div className="p-3 bg-amber-500/10 border border-amber-500/20 rounded-2xl text-amber-200 text-xs leading-relaxed flex items-start gap-2.5">
                                    <i className="fas fa-info-circle text-amber-400 text-sm mt-0.5 shrink-0"></i>
                                    <div>
                                        Nhấc chiếc bể kính trên tay, kiểm tra <b>4 số viết bằng bút lông ở góc đáy bể</b> và nhập vào ô bên dưới (hoặc bấm chọn nhanh từ danh sách kho có sẵn):
                                    </div>
                                </div>

                                {/* INPUT NHẬP 4 SỐ ĐÁY BỂ */}
                                <div className="space-y-1.5 text-center">
                                    <label className="text-[11px] font-black uppercase text-zinc-300 tracking-wider">
                                        Nhập 4 Số Dưới Đáy Bể
                                    </label>
                                    <div className="relative max-w-xs mx-auto">
                                        <input
                                            type="text"
                                            value={serialInput}
                                            onChange={(e) => {
                                                const val = e.target.value.replace(/[^0-9A-Za-z#]/g, '').toUpperCase();
                                                setSerialInput(val.startsWith('#') ? val : (val ? '#' + val : ''));
                                            }}
                                            placeholder="#____"
                                            maxLength={6}
                                            autoFocus
                                            className="w-full text-center text-3xl font-black font-mono tracking-widest py-3 px-4 bg-[#18181b] border-2 border-amber-400/60 focus:border-amber-400 rounded-2xl text-white outline-none shadow-inner transition-colors placeholder:text-zinc-600"
                                        />
                                    </div>
                                </div>

                                {/* DANH SÁCH MÃ SERIAL CÓ SẴN TRONG KHO */}
                                <div className="space-y-2 pt-2 border-t border-white/[0.06]">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider">
                                            Mã Serial Khả Dụng Trong Kho ({stockItems.length})
                                        </span>
                                        {isLoading && <i className="fas fa-spinner fa-spin text-zinc-500 text-xs"></i>}
                                    </div>

                                    {stockItems.length === 0 ? (
                                        <div className="text-center py-4 text-xs text-zinc-500 bg-[#16161a] rounded-xl border border-white/[0.04]">
                                            Chưa quét thấy mã serial nào của SKU này trong kho. Bạn có thể tự gõ 4 số trực tiếp từ đáy bể.
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1">
                                            {stockItems.map((item, sIdx) => {
                                                const isSel = serialInput && item.serialCode && serialInput.replace(/^#/, '') === String(item.serialCode).replace(/^#/, '');
                                                return (
                                                    <div
                                                        key={item.id || sIdx}
                                                        onClick={() => setSerialInput(item.serialCode || '')}
                                                        className={`p-2.5 rounded-xl border cursor-pointer transition-all flex items-center justify-between gap-2 ${
                                                            isSel
                                                                ? 'bg-amber-500/20 border-amber-400 text-white shadow-md ring-1 ring-amber-400'
                                                                : 'bg-[#18181b] border-white/[0.06] hover:border-amber-400/50 text-zinc-300'
                                                        }`}
                                                    >
                                                        <div className="min-w-0">
                                                            <div className="font-mono font-black text-sm text-amber-300 flex items-center gap-1.5">
                                                                <i className="fas fa-barcode text-xs opacity-70"></i>
                                                                <span>{item.serialCode}</span>
                                                            </div>
                                                            <div className="text-[10px] text-zinc-400 truncate mt-0.5">
                                                                Dán: <b className="text-zinc-200">{item.p1_user?.split(' ').pop() || 'Dương'}</b> • Gọt: <b className="text-zinc-200">{item.p2_user?.split(' ').pop() || 'Dương'}</b>
                                                            </div>
                                                        </div>
                                                        {isSel && <i className="fas fa-check-circle text-amber-400 text-sm shrink-0"></i>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            /* ===== GIAO DIỆN LAYOUT (VISUAL MATCHING KCS PHOTO) ===== */
                            <div className="space-y-3">
                                <div className="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl text-emerald-200 text-xs leading-relaxed flex items-start gap-2.5">
                                    <i className="fas fa-hand-sparkles text-emerald-400 text-sm mt-0.5 shrink-0"></i>
                                    <div>
                                        Layout là độc bản! Cầm cây layout trên tay, đối chiếu và <b>chạm chọn ảnh KCS giống nhất</b> trong kho bên dưới:
                                    </div>
                                </div>

                                {stockItems.length === 0 ? (
                                    <div className="text-center py-8 text-xs text-zinc-500 bg-[#16161a] rounded-2xl border border-white/[0.04] space-y-2">
                                        <i className="fas fa-images text-2xl text-zinc-600 block"></i>
                                        <span>Kho chưa có ảnh KCS lưu sẵn cho SKU này.</span>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-72 overflow-y-auto pr-1">
                                        {stockItems.map((stk, lIdx) => {
                                            const isSelected = selectedLayoutId === stk.id;
                                            const img = stk.qc_front_photo || stk.p2_photo || stk.p1_photo;
                                            return (
                                                <div
                                                    key={stk.id || lIdx}
                                                    onClick={() => setSelectedLayoutId(stk.id)}
                                                    className={`group relative rounded-2xl overflow-hidden border cursor-pointer transition-all flex flex-col ${
                                                        isSelected
                                                            ? 'border-emerald-400 ring-2 ring-emerald-400 bg-emerald-950/30 shadow-lg shadow-emerald-950/50'
                                                            : 'border-white/[0.08] hover:border-white/[0.2] bg-[#18181b]'
                                                    }`}
                                                >
                                                    <div className="relative w-full h-28 sm:h-32 bg-zinc-950 flex items-center justify-center overflow-hidden">
                                                        {img ? (
                                                            <img
                                                                src={img}
                                                                alt="KCS"
                                                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                                                loading="lazy"
                                                            />
                                                        ) : (
                                                            <i className="fas fa-cube text-zinc-700 text-2xl"></i>
                                                        )}
                                                        {isSelected && (
                                                            <div className="absolute top-2 right-2 w-6 h-6 rounded-full bg-emerald-500 text-zinc-950 flex items-center justify-center text-xs font-black shadow-md">
                                                                <i className="fas fa-check"></i>
                                                            </div>
                                                        )}
                                                        {img && (
                                                            <button
                                                                type="button"
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    if (typeof window.previewImage === 'function') {
                                                                        window.previewImage(img, 'Ảnh Hiện Vật Trên Kệ');
                                                                    } else if (typeof openSafeImageTab === 'function') {
                                                                        openSafeImageTab(img);
                                                                    } else {
                                                                        window.open(img, '_blank');
                                                                    }
                                                                }}
                                                                className="absolute bottom-1.5 right-1.5 w-6 h-6 rounded-lg bg-black/60 text-white hover:bg-emerald-600 flex items-center justify-center text-[10px] transition-colors"
                                                                title="Xem ảnh phóng to"
                                                            >
                                                                <i className="fas fa-search-plus"></i>
                                                            </button>
                                                        )}
                                                    </div>
                                                    <div className="p-2 text-[10px] space-y-0.5">
                                                        <div className="text-zinc-300 font-bold truncate">
                                                            Khung: <b className="text-amber-400">{stk.p1_user?.split(' ').pop() || 'N/A'}</b>
                                                        </div>
                                                        <div className="text-zinc-400 truncate">
                                                            Gia cố: <b className="text-sky-400">{stk.p2_user?.split(' ').pop() || 'N/A'}</b>
                                                        </div>
                                                        {stk.date && (
                                                            <div className="text-[9px] text-zinc-500 font-mono">
                                                                {stk.date}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* FOOTER ACTIONS */}
                    <div className="pt-3 border-t border-white/[0.08] space-y-2 shrink-0">
                        <button
                            type="button"
                            onClick={handleConfirmAssign}
                            disabled={processing || (isGlass ? (!serialInput || serialInput.length < 4) : !selectedLayoutId)}
                            className={`w-full py-3 rounded-2xl font-black text-xs uppercase tracking-wider transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2 cursor-pointer ${
                                (isGlass ? (serialInput && serialInput.length >= 4) : selectedLayoutId)
                                    ? (isGlass
                                        ? 'bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 hover:brightness-110 text-zinc-950 shadow-amber-950/40 border border-amber-300/50'
                                        : 'bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:brightness-110 text-white shadow-emerald-950/40 border border-emerald-400/50')
                                    : 'bg-zinc-800 text-zinc-500 border border-white/[0.04] cursor-not-allowed'
                            }`}
                        >
                            {processing ? (
                                <><i className="fas fa-spinner fa-spin"></i> ĐANG GHI NHẬN...</>

    function RFReturnLineEditor({ line, result, received, busy, canWarehouse, canFinance, submit }) {
        const [good, setGood] = React.useState('');
        const [scrap, setScrap] = React.useState('0');
        const [missing, setMissing] = React.useState('0');
        const [reason, setReason] = React.useState('');
        const [repair, setRepair] = React.useState(false);
        const [reference, setReference] = React.useState('');
        const done = result?.action === 'DONE';
        const valid = good !== '' && [good, scrap, missing].every(x => Number.isFinite(Number(x)) && Number(x) >= 0) && Math.abs(Number(good) + Number(scrap) + Number(missing) - line.quantity) < 0.000001;
        const inputClass = 'w-full rounded-lg bg-[#18181b] border border-white/[0.06] px-2 py-2 text-xs';
        return <div className="py-3 space-y-2 border-b border-white/[0.06]">
            <div className="flex justify-between gap-2 text-xs"><strong>{line.name}</strong><span className="text-zinc-400 shrink-0">SL {line.quantity}</span></div>
            {done ? <p className="text-xs text-emerald-400">Đã xử lý: đạt {result.good}, hỏng {result.scrap}, thiếu {result.missing}. {result.by}</p> : <>
                {result?.action === 'REPAIR' && <p className="text-xs text-amber-300">Đang sửa · {result.repairId}. Chỉ nhập sau khi lệnh sửa đã hoàn tất KCS.</p>}
                {!received && <p className="text-xs text-zinc-400">Chờ kho xác nhận đã nhận kiện.</p>}
                {canWarehouse && received && <fieldset disabled={busy} className="min-w-0 space-y-2">
                    <div className="grid grid-cols-3 gap-2">
                        {[['Đạt', good, setGood], ['Hỏng', scrap, setScrap], ['Thiếu', missing, setMissing]].map(([label, value, change]) => <label className="text-xs text-zinc-400" key={label}>{label}<input aria-label={label + ' ' + line.name} type="number" min="0" max={line.quantity} step="any" value={value} onChange={e => change(e.target.value)} className={inputClass} /></label>)}

                    }}>{repair ? 'Tạo lệnh sửa chữa' : result?.action === 'REPAIR' ? 'Xác nhận sau sửa & nhập kho' : 'Duyệt dòng hàng'}</button>

                            <p>Chỉ dùng phần sau nếu kho đã ghi nhận trước đây. Không tạo lại phiếu nhập/hủy.</p>
                            <div className="grid grid-cols-3 gap-2">{[['Đạt cũ',good,setGood],['Hỏng cũ',scrap,setScrap],['Thiếu cũ',missing,setMissing]].map(([label,value,change]) => <label key={label}>{label}<input type="number" min="0" max={line.quantity} value={value} onChange={e=>change(e.target.value)} className={inputClass}/></label>)}</div>

    }

    function RFReturnStation({ order, prods = [], accessories = [], packings = [], currentUser, pushDeltas, triggerToast, onCopy, onSaved }) {
        const [expanded, setExpanded] = React.useState(false);
        const [tab, setTab] = React.useState('claim');
        const [busy, setBusy] = React.useState(false);
        const inFlight = React.useRef(false);
        const [evidence, setEvidence] = React.useState('');
        const [claim, setClaim] = React.useState('');
        const [amount, setAmount] = React.useState('');
        const [error, setError] = React.useState('');
        const [imagePreviews, setImagePreviews] = React.useState({});
        const fileInput = React.useRef(null);
        const uploadGroup = React.useRef('OTHER');
        const chooseEvidence = group => { uploadGroup.current = group; fileInput.current?.click(); };
        let wf = {}, corrupt = false;
        try { wf = typeof order.returnWorkflow === 'string' ? JSON.parse(order.returnWorkflow || '{}') : (order.returnWorkflow || {}); } catch (e) { corrupt = true; }
        const role = localStorage.getItem('rf_role') || '';
        const boss = role === 'TỐI CAO' || localStorage.getItem('rf_boss') === 'true';
        const canWarehouse = boss || ['QUẢN LÝ KHO VẬN', 'KHO VẬN'].includes(role);
        const canFinance = boss || ['KẾ TOÁN', 'KIỂM TOÁN', 'QUẢN LÝ KIỂM TOÁN'].includes(role);
        const canSales = canWarehouse || canFinance || ['BÁN HÀNG', 'QUẢN LÝ BÁN HÀNG'].includes(role);
        const returnProds = prods.filter(p => !String(p.id).startsWith('RET_REPAIR_'));
        const represented = {};
        returnProds.forEach(p => { represented[String(p.name).trim()] = (represented[String(p.name).trim()] || 0) + Number(p.quantity || 1); });
        const lines = [...accessories.map((a, i) => {
            const key = String(a.name).trim(), covered = Math.min(Number(a.quantity || 1), represented[key] || 0);
            represented[key] = (represented[key] || 0) - covered;
            return { key: 'acc:' + i, name: a.name, quantity: Number(a.quantity || 1) - covered };
        }).filter(l => l.quantity > 0), ...returnProds.map(p => ({ key: 'prod:' + p.id, name: p.name, quantity: Number(p.quantity || 1), production: true }))];
        const processed = lines.filter(l => wf.items?.[l.key]?.action === 'DONE').length;
        const claimLabels = { UNREVIEWED: 'Chưa xác định', PENDING: 'Chờ sàn', WON: 'Sàn chấp thuận', LOST: 'Sàn từ chối', NOT_REQUIRED: 'Không cần khiếu nại' };
        const warehouseLabel = wf.warehouse === 'NOT_APPLICABLE' ? 'Không trả hàng' : wf.warehouse === 'DONE' ? 'Đã xử lý kho' : wf.receivedAt ? `Đã kiểm ${processed}/${lines.length}` : 'Chưa nhận kiện';
        const ready = ['DONE', 'NOT_APPLICABLE'].includes(wf.warehouse) && ['WON', 'LOST', 'NOT_REQUIRED'].includes(wf.claim);
        const canClose = ready && wf.settlement === 'CONFIRMED';
        const retDate = wf.receivedAt ? new Date(String(wf.receivedAt).replace(' ', 'T') + (/[Z+-]\d\d:?\d\d$/.test(wf.receivedAt) ? '' : '+07:00')) : null;
        const hours = retDate && Number.isFinite(retDate.getTime()) ? (Date.now() - retDate.getTime()) / 3600000 : null;
        const submit = async (action, fields = {}) => {
            if (inFlight.current || corrupt) return;
            inFlight.current = true; setBusy(true); setError('');
            try {
                const res = await pushDeltas({ returnCommand: { orderId: order.id, version: wf.version || 0, operationId: 'RET_' + Date.now() + '_' + Math.random().toString(36).slice(2), action, ...fields } }, 'Đã lưu hồ sơ hoàn.', 'fa-check');
                if (!res?.success) throw new Error(res?.message || 'Chưa xác nhận lưu. Tải lại dữ liệu trước khi thử lại.');
                const saved = res.data?.orders?.[0];
                if (saved) onSaved(saved);
                if (!['ATTACH_IMAGE','ATTACH_FILE'].includes(action)) setEvidence('');
                if (action === 'ATTACH_IMAGE' || action === 'ATTACH_FILE') {
                    const updated = JSON.parse(saved?.returnWorkflow || '{}');
                    const attached = updated.attachments?.[updated.attachments.length - 1];
                    const file = fields.file || fields.image;
                    if (attached && file && /^image\//.test(file.mime)) setImagePreviews(prev => ({ ...prev, [attached.id]: `data:${file.mime};base64,${file.base64}` }));
                }
                if (action === 'NO_RETURN') setTab('claim');
                if (action === 'RECEIVE') setTab('warehouse');
            } catch (e) { setError(e.message); }
            finally { inFlight.current = false; setBusy(false); }
        };
        const uploadEvidence = async (event) => {
            const file = event.target.files?.[0]; event.target.value = '';
            if (!file) return;
            const extensions = { jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',pdf:'application/pdf',mp4:'video/mp4',mov:'video/quicktime',mpeg:'video/mpeg',mpg:'video/mpeg',avi:'video/x-msvideo' };
            const mime = file.type === 'video/avi' ? 'video/x-msvideo' : file.type || extensions[file.name.split('.').pop().toLowerCase()];
            if (!Object.values(extensions).includes(mime)) { setError('Chọn JPG/JPEG/PNG/PDF hoặc MP4/MOV/MPEG/AVI.'); return; }
            const max = mime.startsWith('video/') ? 25 : 5;
            if (file.size > max * 1024 * 1024) { setError('File này tối đa ' + max + ' MB.'); return; }
            try {
                const data = await new Promise((resolve,reject) => { const reader=new FileReader(); reader.onload=()=>resolve(String(reader.result)); reader.onerror=()=>reject(new Error('Không đọc được file.')); reader.readAsDataURL(file); });
                await submit('ATTACH_FILE',{group:uploadGroup.current,file:{name:file.name,mime,base64:data.split(',')[1]}});
            } catch(e) { setError(e.message); }
        };
        const loadImage = async (attachment, download) => {
            if (inFlight.current) return;
            inFlight.current = true; setBusy(true); setError('');
            try {
                let data = imagePreviews[attachment.id];
                if (!data) {
                    const res = await pushDeltas({ returnCommand: { orderId: order.id, operationId: 'IMG_' + Date.now() + '_' + Math.random().toString(36).slice(2), action: attachment.packingId ? 'DOWNLOAD_PACKING' : 'DOWNLOAD_FILE', attachmentId: attachment.id, packingId: attachment.packingId, part: attachment.part } });
                    if (!res?.success || !res.data?.download) throw new Error(res?.message || 'Không tải được ảnh.');
                    const file = res.data.download;
                    data = 'data:' + file.mime + ';base64,' + file.base64;
                    if (/^image\//.test(file.mime)) setImagePreviews(prev => ({ ...prev, [attachment.id]: data }));
                }
                if (download) {
                    const link = document.createElement('a'); link.href = data; link.download = attachment.name; document.body.appendChild(link); link.click(); link.remove();
                }
            } catch (e) { setError(e.message); }
            finally { inFlight.current = false; setBusy(false); }
        };
        const inputClass = 'w-full bg-[#18181b] border border-white/[0.06] rounded-lg px-3 py-2 text-xs';

                <div className="text-xs text-[#d4af37]">{canClose ? 'Đủ điều kiện đóng hồ sơ' : !wf.receivedAt && wf.warehouse !== 'NOT_APPLICABLE' ? 'Tiếp theo: xác nhận có nhận hàng hoàn hay không' : wf.warehouse === 'PENDING' || !wf.warehouse ? 'Tiếp theo: kiểm từng dòng hàng' : !ready ? 'Tiếp theo: ghi nhận kết quả khiếu nại' : 'Tiếp theo: kế toán đối chiếu quyết toán'}</div>
            </button>
