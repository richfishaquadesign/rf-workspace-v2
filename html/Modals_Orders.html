            {(error || corrupt) && <p role="alert" className="text-xs text-rose-400">{error || 'Hồ sơ lỗi định dạng. Cần kiểm tra dữ liệu.'}</p>}
            {expanded && <>

                    <input ref={fileInput} type="file" accept=".jpg,.jpeg,.png,.pdf,.mp4,.mov,.mpeg,.mpg,.avi" aria-label="Chọn file bằng chứng Shopee" onChange={uploadEvidence} className="hidden" />
                    {tab === 'warehouse' && <RFReturnEvidenceGroup group="UNBOXING" workflow={wf} imagePreviews={imagePreviews} upload={chooseEvidence} load={loadImage} submit={submit}/>}
                    {tab === 'claim' && <>

                        <details className="text-xs"><summary className="cursor-pointer py-2">Ghi nhận kết quả sàn / trường hợp không trả hàng</summary><div className="space-y-3 py-2">

                        {!wf.receivedAt && !Object.keys(wf.items || {}).length && <details className="text-xs text-zinc-400"><summary className="cursor-pointer py-2">Trường hợp không có hàng trả về</summary><div className="space-y-2 py-2"><p>Bổ sung bằng chứng ở trên trước khi xác nhận.</p><button type="button" disabled={!evidence.trim()} onClick={() => { if (window.confirm('Sàn xác nhận hoàn tiền không trả hàng? Kho sẽ giữ nguyên; hồ sơ vẫn chờ đối soát tiền.')) submit('NO_RETURN', { evidence }); }} className="block py-2 text-amber-300">Hoàn tiền không trả hàng</button><button type="button" disabled={!evidence.trim()} onClick={() => { if (window.confirm('Xác nhận khách đã nhận hàng theo bằng chứng?')) submit('DELIVERED', { evidence }); }} className="block py-2 text-emerald-400">Khách đã nhận hàng thành công</button></div></details>}
                        </div></details>
                    </>}
                    {tab === 'warehouse' && <>
                        {wf.warehouse === 'NOT_APPLICABLE' ? <p className="text-xs text-zinc-400">Đã ghi nhận không có hàng trả về. Không tạo nhập kho hoặc xuất hủy.</p> : <>
                            {!wf.receivedAt && <><label className="block text-xs text-zinc-400">Mã biên nhận / ghi chú nhận kiện (nếu có)<input value={evidence} onChange={e => setEvidence(e.target.value)} className={inputClass} /></label><button type="button" disabled={!canWarehouse || (!evidence.trim() && !(wf.attachments || []).some(a => rfReturnClaimGroup_(a) === 'UNBOXING'))} onClick={() => submit('RECEIVE', { evidence })} className="w-full py-2 text-xs font-bold text-[#d4af37] disabled:opacity-40">Kho xác nhận đã nhận kiện</button></>}

                            {lines.map(line => <RFReturnLineEditor key={line.key + ':' + (wf.items?.[line.key]?.action || '')} line={line} result={wf.items?.[line.key]} received={!!wf.receivedAt} busy={busy} canWarehouse={canWarehouse} canFinance={canFinance} submit={submit} />)}
                        </>}
                    </>}
                    {tab === 'money' && <>
                        <p className="text-xs text-zinc-400">{ready ? 'Kho và khiếu nại đã có kết quả. Đối chiếu khoản thực nhận trên kỳ quyết toán trước khi xác nhận.' : 'Chờ hoàn tất kho và kết quả khiếu nại.'}</p>
                        {canFinance ? <><label className="block text-xs text-zinc-400">Tiền thực nhận sau quyết toán (VNĐ)<input type="number" min="0" step="1" value={amount} onChange={e => setAmount(e.target.value)} className={inputClass} /></label><label className="block text-xs text-zinc-400">Mã kỳ / phiếu quyết toán<input value={evidence} onChange={e => setEvidence(e.target.value)} className={inputClass} /></label><p className="text-xs text-zinc-400">Số này lưu làm căn cứ đối chiếu; doanh thu và các phí tiếp tục lấy từ phân hệ đối soát.</p><button type="button" disabled={!ready || amount === '' || Number(amount) < 0 || !evidence.trim()} onClick={() => { if (window.confirm('Đã đối chiếu số tiền thực nhận với kỳ quyết toán?')) submit('SETTLE', { amount, evidence }); }} className="w-full py-2 text-xs font-bold text-[#d4af37] disabled:opacity-40">Xác nhận đã đối chiếu quyết toán</button>{wf.settlement === 'CONFIRMED' && <p className="text-xs text-emerald-400">Đã xác nhận {Number(wf.settlementAmount).toLocaleString('vi-VN')}đ · {wf.settlementReference}</p>}</> : <p className="text-xs text-zinc-400">Kế toán/kiểm toán hoặc Tối Cao xác nhận phần tiền.</p>}
                    </>}
                    {canClose && <button type="button" onClick={() => { if (window.confirm('Đóng hồ sơ: kho, khiếu nại và đối soát đều hoàn tất?')) submit('CLOSE'); }} className="w-full py-3 text-xs font-bold text-emerald-400">Đóng hồ sơ hoàn</button>}
                </fieldset>
                {busy && <p role="status" className="text-xs text-[#d4af37]">Đang xác nhận với máy chủ…</p>}
                {!!wf.history?.length && <details className="text-xs text-zinc-400"><summary className="cursor-pointer">Lịch sử xử lý ({wf.history.length})</summary><ul className="space-y-2 mt-2">{wf.history.slice(-8).reverse().map((h, i) => <li key={i}>{h.at} · {h.by} · {({ RECEIVE: 'Nhận kiện', CLAIM: 'Khiếu nại', ITEM: 'Kiểm hàng', NO_RETURN: 'Không trả hàng', SETTLE: 'Đối chiếu tiền', CLOSE: 'Đóng hồ sơ', DELIVERED: 'Khách đã nhận', VERIFY_SOURCE: 'Đối chiếu nguồn xuất', ADOPT_ITEM: 'Kế thừa kho cũ', ATTACH_IMAGE: 'Đính kèm ảnh', ATTACH_FILE: 'Đính kèm file', MOVE_ATTACHMENT: 'Phân nhóm bằng chứng', ADD_PACKING_EVIDENCE: 'Gắn ảnh đóng gói', SAVE_CLAIM_DRAFT: 'Lưu hồ sơ khiếu nại', SUBMIT_CLAIM: 'Ghi nhận đã gửi sàn', EXCLUDE_ATTACHMENT: 'Loại file khỏi bộ nộp', RESTORE_ATTACHMENT: 'Khôi phục file vào bộ nộp' })[h.action] || h.action}{h.lineKey ? ' · ' + h.lineKey : ''}</li>)}</ul></details>}
            </>}
        </section>;
    }

    function OrderCardV2({
        attendance, order, prods, pack, packings, erpProducts, erpData, isAdmin, currentUser, pushDeltas,
        prodItems, userConfigs, triggerToast, isSelected, onToggleSelect, kpiConfig, idx_num,
        handleCancelOrder, handleConfirmStockIn, openReturnModal, onEditOrder, filterStatus, orders
    }) {
        const [optimisticOrder, setOptimisticOrder] = React.useState(null);
        const [optimisticPack, setOptimisticPack] = React.useState(null);
        const [sosTarget, setSosTarget] = React.useState(null);
        const [assignStockTarget, setAssignStockTarget] = React.useState(null);
        const actionBtnRef = React.useRef(null);
        const [showActionMenu, setShowActionMenu] = React.useState(false);
        const [menuPos, setMenuPos] = React.useState({ top: 0, right: 0 });
        const [confirmAction, setConfirmAction] = React.useState(null);

        const handleOpenMenu = (e) => {
            e.stopPropagation();
            if (actionBtnRef.current) {
                const rect = actionBtnRef.current.getBoundingClientRect();
                const spaceBelow = window.innerHeight - rect.bottom;
                const top = spaceBelow < 320 ? Math.max(10, rect.top - 310) : rect.bottom + 6;
                const right = Math.max(12, window.innerWidth - rect.right);
                setMenuPos({ top, right });
            }
            setShowActionMenu(prev => !prev);
        };

        React.useEffect(() => {
            setOptimisticOrder(null);
            setCheckedItems([]);
            setGoodsFile(null);
            setBoxFile(null);
            setWhFile(null);
            setShowActionMenu(false);
            setConfirmAction(null);
        }, [order?.status, order?.isCarriedToWH, order?.id]);
        React.useEffect(() => { setOptimisticPack(null); }, [pack?.status, pack?.id, pack?.photo]);

        const _order = optimisticOrder || order;
        const _pack = optimisticPack || pack;

        const isBossRole = localStorage.getItem('rf_boss') === 'true';
        const currentRole = localStorage.getItem('rf_role') || '';
        const isBoss = isBossRole || currentRole === 'TỐI CAO' || Boolean(isAdmin);
        const isCTV = currentRole === 'CTV';
        const isOwnOrder = _order.createdBy === currentUser || _order.sale === currentUser || _order.updatedBy === currentUser || _order.responsibleUser === currentUser || String(_order.channel || '').toUpperCase().includes('CỘNG TÁC VIÊN') || String(_order.channel || '').toUpperCase() === 'CTV';
        const canEdit = isBoss || currentRole === 'BÁN HÀNG' || currentRole === 'QUẢN LÝ BÁN HÀNG' || currentRole === 'KẾ TOÁN' || (isCTV && isOwnOrder);
        const canCancel = isBoss || currentRole === 'BÁN HÀNG' || currentRole === 'QUẢN LÝ BÁN HÀNG' || currentRole === 'KẾ TOÁN';

        const [goodsFile, setGoodsFile] = React.useState(null);
        const [boxFile, setBoxFile] = React.useState(null);
        const [whFile, setWhFile] = React.useState(null);
        const [processing, setProcessing] = React.useState(false);
        const [checkedItems, setCheckedItems] = React.useState([]);
        const [isExpanded, setIsExpanded] = React.useState(false);
        const [showDetailModal, setShowDetailModal] = React.useState(false);
        const [editRespUser, setEditRespUser] = React.useState(_order.responsibleUser || _order.updatedBy || '');
        React.useEffect(() => {
            setEditRespUser(_order.responsibleUser || _order.updatedBy || '');
        }, [_order.responsibleUser, _order.updatedBy, _order.id]);

        const availableStaff = React.useMemo(() => {
            let list = [];
            if (Array.isArray(userConfigs)) {
                list = userConfigs.map(u => typeof u === 'string' ? u : (u['Tên Nhân Sự'] || u.name || u.user)).filter(Boolean);
            } else if (userConfigs && Array.isArray(userConfigs.users)) {
                list = userConfigs.users.filter(Boolean);
            } else if (userConfigs && userConfigs.pins && typeof userConfigs.pins === 'object') {
                list = Object.values(userConfigs.pins).map(p => p.name || p['Tên Nhân Sự'] || p.user).filter(Boolean);
            } else if (Array.isArray(erpData?.Config_NhanSu)) {

            }
            if (!list.includes('Rich Fish (Xưởng)')) list.unshift('Rich Fish (Xưởng)');
            return Array.from(new Set(list));
        }, [userConfigs, erpData]);

        const [showInvoiceModal, setShowInvoiceModal] = React.useState(false);
        const [showReconcile, setShowReconcile] = React.useState(false);
        const [showGHNModal, setShowGHNModal] = React.useState(false);
        const [showHistoryModal, setShowHistoryModal] = React.useState(false);
        const [importingAcc, setImportingAcc] = React.useState(null);

        const handleQuickImportAccessory = async (accName, missingQty, costPrice) => {
            if (processing || importingAcc) return;
            try {
                setImportingAcc(accName);
                const itemsData = [{ name: accName, qty: missingQty, price: Number(costPrice || 0) }];
                const stockLogs = [{
                    id: 'IE_QUICK_' + Date.now(),
                    type: 'Nhập',
                    target: 'Bổ sung thiếu kho',
                    totalAmount: missingQty * Number(costPrice || 0),
                    date: typeof getLocalISODate === 'function' ? getLocalISODate().replace('T', ' ').slice(0, 19) : new Date().toISOString().replace('T', ' ').slice(0, 19),
                    note: `Nhập nhanh phụ kiện thiếu cho Đơn ${_order.orderCode}`,
                    itemsData: JSON.stringify(itemsData)
                }];

                const prodList = erpProducts || (typeof erpData !== 'undefined' ? (erpData.Products || erpData.products) : []) || [];
                const cleanAcc = String(accName || '').trim().toLowerCase().replace(/\s+/g, ' ');
                let pMatch = prodList.find(x => String(x.name || '').trim().toLowerCase().replace(/\s+/g, ' ') === cleanAcc);
                if (!pMatch && typeof getProductInfo === 'function') {
                    pMatch = getProductInfo(accName);
                }

                let productUpdates = [];
                if (pMatch && pMatch.id) {
                    productUpdates.push({
                        ...pMatch,
                        id: pMatch.id,
                        name: pMatch.name || accName,
                        quantity: Math.max(Number(pMatch.quantity || 0) + missingQty, missingQty)
                    });
                } else {
                    const newProd = {
                        id: 'PROD_' + Date.now(),
                        sku: 'PK_' + Date.now().toString().slice(-6),
                        name: accName,
                        unit: 'Cái',
                        category: 'PHỤ KIỆN',
                        sub_category: 'Phụ kiện',
                        costPrice: Number(costPrice || 0),
                        price: Number(costPrice || 0) * 1.5,
                        quantity: missingQty,
                        minStock: 0,
                        maxStock: 100
                    };
                    productUpdates.push(newProd);
                }
                
                await pushDeltas({ ImportExport: stockLogs, Products: productUpdates }, `Đã nhập bù ${missingQty} ${accName}!`, 'fa-download');
                triggerToast(`Đã nhập bù thành công ${missingQty} ${accName}!`, 'fa-check', 'success');
            } catch (e) {
                triggerToast('Lỗi nhập nhanh: ' + e.message, 'fa-times', 'danger');
            } finally {
                setImportingAcc(null);
            }
        };

        const accountsData = erpData?.Accounts || [];
        const fullCode = order?.orderCode || '';
        let mCode = fullCode;
        if (!order?.shippingCode) {
            if (fullCode.includes(' | MVĐ: ')) mCode = fullCode.split(' | MVĐ: ')[0];
            else if (fullCode.includes('|MVĐ:')) mCode = fullCode.split('|MVĐ:')[0];
        }
        mCode = mCode.replace(/[|/\\]+$/, '').trim();

        // 🛡️ CHỐNG ĐÚP TIỀN ĐƠN BÁN LẺ (DOUBLE INFLOW PREVENTION):
        // Kiểm tra xem đơn hàng đã có bản ghi giao dịch thu tiền trong bảng Transactions chưa
        const existingOrderTxs = (erpData?.Transactions || erpData?.transactions || []).filter(tx => 
            tx.type === 'Thu' && (
                (mCode && (String(tx.title || '').includes(mCode) || String(tx.note || '').includes(mCode) || String(tx.orderCode || '').includes(mCode))) ||
                (order?.id && (String(tx.note || '').includes(order.id) || String(tx.title || '').includes(order.id)))
            )
        );
        const hasExistingPaidTx = existingOrderTxs.length > 0;
        const paidAmtFromTxs = existingOrderTxs.reduce((sum, tx) => sum + Number(tx.amount || 0), 0);

        const [recForm, setRecForm] = React.useState(() => {
            const total = Number(order?.cod || order?.revenue || 0);
            const remaining = Math.max(0, total - paidAmtFromTxs);
            return {
                amount: remaining,
                accountId: (accountsData.find(a => (a.accountName || a.name) === 'Công Ty') || accountsData[0])?.id || '',
                createTx: !hasExistingPaidTx && remaining > 0
            };
        });

        const fmtImg = (url, size = 'sm') => {
            if (!url || typeof url !== 'string') return '';
            return typeof rfOptimizeImageUrl === 'function' ? rfOptimizeImageUrl(url, size) : url.trim();
        };

        const getProductInfo = (name) => {
            if (!name) return null;
            const prodList = erpProducts || (typeof erpData !== 'undefined' ? (erpData.Products || erpData.products) : []) || [];
            if (!prodList || prodList.length === 0) return null;

            const rawName = String(name).trim();
            const rawLower = rawName.toLowerCase();

            // Danh sách ảnh phụ kiện chuẩn tuyệt đối (Poka-yoke)
            const TRUE_SAND_IMG = 'https://down-vn.img.susercontent.com/file/vn-11134207-81ztc-mpgaenv8fqj2fd.webp';
            const TRUE_BONGLOC_IMG = 'https://cf.shopee.vn/file/vn-11134207-81ztc-mmr3ua2d68zk8c';
            const TRUE_DECAN_IMG = 'https://byvn.net/WZ2X';

            // Nhận diện nếu mặt hàng đang xét là phụ kiện / tiêu hao / vật liệu
            const isRawAcc = /^(100g|200g|300g|500g|1kg|2kg|5kg|\d+g|\d+kg|gói|bịch|chai|hộp|túi|lọ|keo|rễ|rêu|cát|sạn|sỏi|phân|lũa vụn|đá vụn|bông lọc|decan|decal)/i.test(rawLower) ||
                rawLower.includes('cát trắng') || rawLower.includes('bông lọc') || rawLower.includes('rêu giả') || rawLower.includes('đèn rọi') || rawLower.includes('decan');

            // 1. Khớp chính xác 100% theo tên (ưu tiên sản phẩm có ảnh/realImage)
            let match = prodList.find(x => String(x.name || '').trim().toLowerCase() === rawLower && (x.image || x.realImage));
            if (!match) match = prodList.find(x => String(x.name || '').trim().toLowerCase() === rawLower);
            if (match && (match.image || match.realImage)) {
                let imgToUse = match.image || match.realImage;
                let realImgToUse = match.realImage || match.image;

                                _p1Name: p.phases?.phase1?.name || origin?.p1Name || (p.type === 'Bể Kính' ? 'Cắt Dán' : 'Dựng Khung'),
                                _p2Name: p.phases?.phase2?.name || origin?.p2Name || (p.type === 'Bể Kính' ? 'Gọt Keo' : 'Gia Cố')
                            };
                        });

                        const hasStaff = allProdsWithOrigin.some(p => p._p1User || p._p2User) || Boolean(packUser) || Boolean(whUser);
                        if (!hasStaff) return null;

                        return (
                            <div className="border-t border-white/[0.08] pt-2.5 mb-2 flex flex-col gap-1 text-[10.5px]">
                                {allProdsWithOrigin.map((p, pIdx) => {
                                    const rawP1 = p._p1User || '';
                                    const rawP2 = p._p2User || '';
                                    // TRIỆT TIÊU NHÃN THỢ ẢO 'Kho Hàng' (bị cắt thành 'Hàng')
                                    const isP1Real = rawP1 && !rawP1.includes('Kho Hàng') && rawP1 !== 'Hàng';
                                    const isP2Real = rawP2 && !rawP2.includes('Kho Hàng') && rawP2 !== 'Hàng';
                                    const p1User = isP1Real ? rawP1.split(' ').pop() : null;
                                    const p2User = isP2Real ? rawP2.split(' ').pop() : null;
                                    const isStockItem = p._origin?.fulfilledFromStock === true || String(p._origin?.fulfilledFromStock).toUpperCase() === 'TRUE';

                                    if (!p1User && !p2User && !isStockItem) return null;

                                    return (
                                        <div key={'staff_' + pIdx} className="flex flex-wrap items-center gap-x-3 gap-y-1 text-zinc-300">
                                            {isStockItem && !p1User && !p2User ? (
                                                <span className="text-[9px] font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-2 py-0.5 rounded-lg">
                                                    <i className="fas fa-warehouse mr-1"></i>Xuất từ kho có sẵn
                                                </span>
                                            ) : (
                                                <>
                                                    <span className="text-zinc-400 font-bold">Sản Xuất:</span>
                                                    {p1User && <span>{p._p1Name}: <b className="text-[#f59e0b] font-black">{p1User}</b></span>}
                                                    {p2User && <span>{p._p2Name}: <b className="text-[#3b82f6] font-black">{p2User}</b></span>}
                                                </>
                                            )}
                                            {p._origin?.serialCode && (
                                                <span className="font-mono text-amber-300 font-bold bg-amber-400/15 px-1.5 py-0.2 rounded border border-amber-400/30 text-[9px]">
                                                    {p._origin.serialCode}
                                                </span>
                                            )}
                                        </div>
                                    );
                                })}
                                {(packUser || whUser) && (
                                    <div className="flex flex-wrap gap-x-4 gap-y-1 pt-1 text-zinc-300">
                                        {packUser && <span>Đóng gói: <b className="text-[#10b981] font-black">{packUser.split(' ').pop()}</b></span>}
                                        {whUser && <span>Chở kho: <b className="text-[#a78bfa] font-black">{whUser.split(' ').pop()}</b></span>}
                                    </div>
                                )}
                            </div>
                        );
                    })()}

                    {isDone && canEdit && (
                        <div className="mb-3">
                            <button onClick={() => setShowReconcile(!showReconcile)} className="w-full py-2.5 bg-[#d4af37]/10 text-[#d4af37] border border-[#d4af37]/30 hover:bg-[#d4af37]/20 font-black text-[10px] uppercase rounded-xl transition-colors shadow-sm">
                                <i className="fas fa-check-double mr-1.5"></i> ĐỐI SOÁT THÀNH CÔNG
                            </button>
                            {showReconcile && (
                                <div className="bg-[#0a0a0a] border border-[#333] rounded-xl p-3 animate-fade-in flex flex-col gap-2 mt-2 shadow-inner">
                                    <div>
                                        <label className="text-[9px] text-gray-500 font-bold uppercase block mb-1">Số tiền thực nhận (VNĐ)</label>
                                        <input type="number" value={recForm.amount} onChange={e => setRecForm({ ...recForm, amount: e.target.value })} className="w-full bg-[#141414] border border-[#333] text-[#34d399] font-black p-2 rounded-lg text-sm outline-none focus:border-[#d4af37]" placeholder="Nhập số tiền..." />
                                    </div>
                                    <div>
                                        <label className="text-[9px] text-gray-500 font-bold uppercase block mb-1">Tài khoản tiền vào</label>
                                        <select value={recForm.accountId} onChange={e => setRecForm({ ...recForm, accountId: e.target.value })} className="w-full bg-[#141414] border border-[#333] text-gray-300 font-bold p-2 rounded-lg text-[11px] outline-none focus:border-[#d4af37]" disabled={!recForm.createTx || hasExistingPaidTx}>
                                            {accountsData.map(a => <option key={a.id} value={a.id}>{a.accountName || a.name}</option>)}
                                        </select>
                                    </div>
                                    {hasExistingPaidTx ? (
                                        <div className="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-lg mt-1 flex items-start gap-2">
                                            <i className="fas fa-shield-check text-amber-400 text-sm mt-0.5 shrink-0"></i>
                                            <div className="flex-1">
                                                <div className="text-[10.5px] font-black text-amber-300 uppercase">ĐÃ CÓ PHIẾU THU NGÂN HÀNG TỰ ĐỘNG ({paidAmtFromTxs.toLocaleString('vi-VN')} đ)</div>
                                                <div className="text-[9px] text-amber-200/80 mt-0.5 leading-tight">
                                                    Đơn hàng này đã có giao dịch thu tiền trong hệ thống. Hệ thống đã <b>TỰ ĐỘNG KHÓA</b> tạo phiếu thu mới để chống nhân đôi doanh thu.
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="bg-rose-500/10 border border-rose-500/20 p-2 rounded-lg mt-1">
                                            <label className="flex items-start gap-2 cursor-pointer">
                                                <input type="checkbox" checked={recForm.createTx} onChange={e => setRecForm({ ...recForm, createTx: e.target.checked })} className="w-4 h-4 mt-0.5 accent-rose-500 rounded cursor-pointer" />
                                                <div className="flex-1">
                                                    <div className="text-[11px] font-black text-rose-400">TẠO PHIẾU THU VÀO TÀI KHOẢN</div>
                                                    <div className="text-[9px] text-rose-400/80 mt-0.5 leading-tight">Bỏ chọn nếu khách chuyển khoản và hệ thống đã tự quét tạo phiếu thu (tránh nhân đôi doanh thu).</div>
                                                </div>
                                            </label>
                                        </div>
                                    )}
                                    <div className="flex gap-2 mt-1">
                                        <button onClick={() => setShowReconcile(false)} className="flex-[1] py-2 bg-[#222] text-gray-400 font-bold text-[10px] rounded-lg">HUỶ</button>
                                        <button onClick={() => {
                                            const amt = Number(recForm.amount);
                                            if (recForm.createTx && amt < 0) return triggerToast('Số tiền không hợp lệ', 'fa-times', 'danger');

                                            const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
                                            const newOrder = { ..._order, status: 'Hoàn Thành' };

                                            if (recForm.createTx && amt > 0) {
                                                if (!recForm.accountId) return triggerToast('Vui lòng chọn tài khoản', 'fa-times', 'danger');
                                                const newTx = {
                                                    id: 'TX_RECONCILE_' + Date.now(),
                                                    type: 'Thu',
                                                    category: 'Doanh Thu Bán Hàng',
                                                    amount: amt,
                                                    fromAccount: '',
                                                    toAccount: recForm.accountId,
                                                    title: `Đơn hàng ${mainOrderCode}`,
                                                    date: safeDateFull.replace('T', ' ').slice(0, 16),
                                                    note: `Kênh: ${_order.channel} | Khách: ${_order.customer}`,
                                                    payerName: _order.channel,
                                                    isAuto: true
                                                };
                                                setOptimisticOrder(newOrder);
                                                setShowReconcile(false);
                                                pushDeltas({ orders: [newOrder], Transactions: [newTx] }, 'Đã đối soát và tạo phiếu thu!', 'fa-check-double').catch(() => { });
                                            } else {
                                                setOptimisticOrder(newOrder);
                                                setShowReconcile(false);
                                                pushDeltas({ orders: [newOrder] }, 'Đã chuyển trạng thái Hoàn Thành (Không sinh phiếu thu)!', 'fa-check-double').catch(() => { });
                                            }
                                        }} className="flex-[2] py-2 bg-[#d4af37] hover:bg-[#7c3aed] text-white font-black text-[10px] rounded-lg shadow-sm">
                                            {recForm.createTx && Number(recForm.amount) > 0 ? 'XÁC NHẬN & TẠO PHIẾU' : 'CHỈ ĐỔI TRẠNG THÁI'}
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {(() => {
                        const hasBottomAction = !isReturn && (
                            (isBuKho && handleConfirmStockIn && _order.status !== 'Đã nhập kho') ||
                            (isReadyPack && isPacking && !isPackOwner)
                        );
                        if (!hasBottomAction) return null;
                        return (
                            <div className="mt-1 pt-3 border-t border-[#222] flex gap-2">
                                {isBuKho ? (
                                    handleConfirmStockIn && _order.status !== 'Đã nhập kho' && (
                                        prods.every(p => String(p.status || '').toUpperCase() === 'DONE' || String(p.status || '').toUpperCase() === 'ĐÃ XONG') ?
                                            <button onClick={() => handleConfirmStockIn(_order)} className="flex-1 py-2.5 bg-[#10b981] text-white text-[10px] font-black uppercase tracking-wide rounded-xl active:scale-95 transition-all shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:bg-[#059669]">NHẬP KHO BÙ LỆNH NÀY</button> :
                                            <button disabled className="flex-1 py-2.5 bg-[#1a1a1a] text-[#555] text-[10px] font-black uppercase tracking-wider rounded-xl border border-[#333] cursor-not-allowed">ĐANG SẢN XUẤT</button>
                                    )
                                ) : (
                                    <>
                                        {isReadyPack && isPacking && !isPackOwner && (
                                            <div className="w-full py-2 text-[10px] font-black text-[#fbbf24] bg-[#fbbf24]/10 border border-[#fbbf24]/30 rounded-xl text-center uppercase tracking-wider flex items-center justify-center gap-2">
                                                <i className="fas fa-spinner fa-spin text-xs"></i><span>{currentPackingTask?.user?.split(' ').pop()} ĐANG GÓI...</span>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        );
                    })()}



                    {showInvoiceModal && (
                        <OrderInvoiceModal
                            order={_order}
                            prods={effectiveProds}
                            accessories={effectiveAccessories}
                            erpProducts={erpProducts || erpData?.Products || []}
                            onClose={() => setShowInvoiceModal(false)}
                            triggerToast={triggerToast}
                        />
                    )}
                </div>
            </div>
        );
    }

    // ==========================================
    // 4. COMPONENT QUÉT NHÃN VẬN ĐƠN TỰ ĐỘNG (BƠM ĐƠN TRỰC TIẾP GIỐNG EXCEL)
    // ==========================================
    function ScanLabelModal({ onClose, pushDeltas, existingOrders = [], products = [], triggerToast }) {
        const [imageFile, setImageFile] = React.useState(null);
        const [preview, setPreview] = React.useState('');
        const [isProcessing, setIsProcessing] = React.useState(false);
        const [isSubmitting, setIsSubmitting] = React.useState(false);
        const [parsedOrder, setParsedOrder] = React.useState(null);
        const [manualMatchIndex, setManualMatchIndex] = React.useState(null);
        const [productSearch, setProductSearch] = React.useState('');

        const handleSelectProduct = (selectedProd) => {
            if (manualMatchIndex === null || !parsedOrder) return;
            const updatedItems = [...parsedOrder.items];
            updatedItems[manualMatchIndex] = {
                ...updatedItems[manualMatchIndex],
                name: selectedProd.name,
                matchedProd: selectedProd
            };
            setParsedOrder({
                ...parsedOrder,
                items: updatedItems
            });
            setManualMatchIndex(null);
            setProductSearch('');
            triggerToast(`Đã khớp thủ công với: ${selectedProd.name}`, 'fa-link', 'success');
        };

        const formatMoney = (val) => Math.round(Number(val || 0)).toLocaleString('vi-VN');

        const handleCapture = (e) => {
            const file = e.target.files[0];
            if (file) {
                setImageFile(file);
                const reader = new FileReader();
                reader.onload = (ev) => setPreview(ev.target.result);
                reader.readAsDataURL(file);
            }
        };

        const handlePasteClick = async () => {
            try {
                if (!navigator.clipboard || !navigator.clipboard.read) {
                    triggerToast('Trình duyệt không hỗ trợ nút dán ảnh trực tiếp, vui lòng bấm phím Ctrl+V (hoặc Command+V) để dán!', 'fa-exclamation', 'warning');
                    return;
                }
                const clipboardItems = await navigator.clipboard.read();
                for (const clipboardItem of clipboardItems) {
                    const validTypes = clipboardItem.types.filter(type => type.startsWith('image/') || type === 'application/pdf');
                    if (validTypes.length > 0) {
                        const blob = await clipboardItem.getType(validTypes[0]);
                        setImageFile(blob);
                        const reader = new FileReader();
                        reader.onload = (ev) => setPreview(ev.target.result);
                        reader.readAsDataURL(blob);
                        triggerToast('Đã nhận tài liệu từ bộ nhớ tạm!', 'fa-check', 'success');
                        return;
                    }
                }
                triggerToast('Không tìm thấy tệp hợp lệ trong bộ nhớ tạm!', 'fa-exclamation', 'warning');
            } catch (err) {
                triggerToast('Vui lòng cấp quyền xem bộ nhớ tạm hoặc dùng phím Ctrl+V để dán!', 'fa-times', 'danger');
            }
        };

        React.useEffect(() => {
            const handleGlobalPaste = (e) => {
                const items = (e.clipboardData || e.originalEvent?.clipboardData || window.clipboardData)?.items;
                if (!items) return;
                for (let index in items) {
                    const item = items[index];
                    if (item.kind === 'file' && (item.type.startsWith('image/') || item.type === 'application/pdf')) {
                        const blob = item.getAsFile();
                        if (blob) {
                            setImageFile(blob);
                            const reader = new FileReader();
                            reader.onload = (ev) => setPreview(ev.target.result);
                            reader.readAsDataURL(blob);
                            triggerToast('Đã dán tài liệu thành công!', 'fa-check', 'success');
                            e.preventDefault();
                        }
                    }
                }
            };
            window.addEventListener('paste', handleGlobalPaste);
            return () => window.removeEventListener('paste', handleGlobalPaste);
        }, []);

        const processImage = async () => {
            if (!imageFile) return;
            setIsProcessing(true);
            try {
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(imageFile);
                });

                triggerToast('Đang quét và mổ xẻ dữ liệu...', 'fa-spinner fa-spin', 'info');

                let textResult = "";
                if (typeof runGAS === 'function') {
                    try {
                        textResult = await runGAS('processOCR', base64Data);
                    } catch (e) {
                        textResult = "";
                    }
                }

                if (!textResult) {
                    setIsProcessing(false);
                    triggerToast('Không thể quét được dữ liệu từ ảnh (mờ hoặc lỗi). Vui lòng thử lại!', 'fa-exclamation-triangle', 'error');
                    return;
                }

                // BỘ LỌC THÔNG MINH (ĐỌC TỪNG DÒNG)
                const lines = textResult.split('\n').map(l => l.trim()).filter(l => l);
                let draft = { orderCode: '', trackingId: '', customer: '', address: '', phone: '', retailTotal: 0, items: [] };

                let isReadingCustomer = false;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];

                    // 1. Mã Vận Đơn (Bắt SPX, GHN, J&T... hỗ trợ dấu cách/gạch ngang)
                    const trackMatch = line.match(/(SPX[\s-]*[A-Z0-9]+|GYX[\s-]*[A-Z0-9]+|JT[\s-]*[A-Z0-9]+|GHN[\s-]*[A-Z0-9]+)/i);
                    if (trackMatch) draft.trackingId = trackMatch[0].replace(/[^A-Z0-9]/gi, '').toUpperCase();

                    // 2. Mã Đơn Hàng Shopee (Bắt chuẩn format 6 số ngày tháng + 8,9 chữ/số, hỗ trợ dấu cách/gạch ngang)
                    const orderMatch = line.match(/\b([0-9]{6}[\s-]*[A-Z0-9]{8,9})\b/);
                    if (orderMatch) draft.orderCode = orderMatch[1].replace(/[^A-Z0-9]/gi, '').toUpperCase();

                    // 3. Tiền Thu
                    if (line.includes('VND') || line.includes('Tiền thu')) {
                        const moneyMatch = line.match(/([0-9]{1,3}(,[0-9]{3})*|[0-9]+)\s*VND/i);
                        if (moneyMatch) draft.retailTotal = parseInt(moneyMatch[1].replace(/,/g, ''));
                    }

                    // 4. Số điện thoại (Loại trừ số của shop)
                    const phoneMatch = line.match(/(?:84|0[3|5|7|8|9])([0-9]{8})\b/);
                    if (phoneMatch && !line.includes('945445497') && !line.includes('Từ:')) {
                        draft.phone = phoneMatch[0].replace(/^84/, '0');
                    }

                    // 5. Tên Khách & Địa chỉ
                    if (/^(Đến:|To:)$/i.test(line)) {
                        isReadingCustomer = true;
                        if (lines[i + 1]) draft.customer = lines[i + 1].replace(/^Đến:\s*/i, '');
                        if (lines[i + 2]) draft.address = lines[i + 2];
                    } else if (/^Đến:\s*(.+)/i.test(line)) {
                        draft.customer = line.replace(/^Đến:\s*/i, '').trim();
                        if (lines[i + 1] && !lines[i + 1].includes('Nội dung hàng')) draft.address = lines[i + 1];
                    }

                    // 6. Hàng hoá (Bắt đầu bằng số thứ tự "1.", "2." ...)
                    if (/^\d+\.\s/.test(line)) {
                        // Lấy số lượng
                        let qty = 1;
                        const qtyMatch = line.match(/(?:SL|Số lượng)[:\s]*(\d+)/i);
                        if (qtyMatch) qty = parseInt(qtyMatch[1], 10);

                        // Gọt rác tên Shopee (Bỏ số đếm, bỏ mọi thứ sau dấu '|' hoặc dấu phẩy)
                        let rawName = line.replace(/^\d+\.\s/, '');
                        let cleanName = rawName.split(/\||,/)[0].trim();

                        // Trích xuất SKU từ dấu ngoặc vuông nếu có [SKU]
                        let extractedSku = '';
                        const bracketMatch = line.match(/\[(.*?)\]/);
                        if (bracketMatch) {
                            const parts = bracketMatch[1].trim().split(/\s+/).filter(Boolean);
                            extractedSku = parts[parts.length - 1] || bracketMatch[1].trim();
                        }

                        // Dò với kho hàng thực tế (ƯU TIÊN THEO SKU KHO HÀNG)
                        let finalName = cleanName;
                        let matchedProd = null;
                        if (products && products.length > 0) {
                            if (extractedSku) {
                                const extClean = extractedSku.trim().toUpperCase();
                                const extAlphanum = extClean.replace(/[^A-Z0-9]/g, '');
                                matchedProd = products.find(p => {
                                    const pSku = String(p.sku || '').trim().toUpperCase();
                                    return pSku === extClean || (extAlphanum.length >= 3 && pSku.replace(/[^A-Z0-9]/g, '') === extAlphanum);
                                });
                            }

                            if (!matchedProd) {
                                const searchStr = cleanName.toLowerCase();
                                // Bước 1: Khớp tên chính xác 100%
                                matchedProd = products.find(p => p.name && p.name.toLowerCase() === searchStr);
                            }

                            if (!matchedProd) {
                                // Bước 2: Khớp chuỗi con xếp tên dài nhất lên trước
                                const sortedProds = [...products].sort((a, b) => (b.name || '').length - (a.name || '').length);
                                matchedProd = sortedProds.find(p => p.name && p.name.length > 3 && searchStr.includes(String(p.name).toLowerCase()));
                            }

                            if (matchedProd) {
                                finalName = matchedProd.name;
                            }
                        }

                        draft.items.push({ name: finalName, qty: qty, sku: (matchedProd && matchedProd.sku) ? matchedProd.sku : extractedSku, matchedProd: matchedProd });
                    }
                }

                // Fallback nếu Regex lỗi không tìm thấy tên khách
                if (!draft.customer) draft.customer = 'Khách Quét Mã (Cần check lại)';

                // Kiểm tra trùng lặp
                const baseCode = draft.orderCode;
                const existing = (existingOrders || []).find(o => {
                    const oBase = (o.orderCode || '').split(' | MVĐ: ')[0].trim().toLowerCase();
                    return oBase === baseCode.toLowerCase();
                });

                let isDuplicate = false;
                let isUpdate = false;
                let existingId = null;
                let existingRecord = null;

                if (existing) {
                    existingId = existing.id;
                    existingRecord = existing;
                    const existingTrack = (existing.orderCode || '').split(' | MVĐ: ')[1] || '';
                    const existingCustomer = existing.customer || '';
                    const existingRevenue = Number(existing.revenue || 0);

                    const hasNewTrack = draft.trackingId && !existingTrack;
                    const hasNewCustomer = (draft.customer && draft.customer !== 'Khách') && (!existingCustomer || existingCustomer === 'Khách');
                    const hasNewRevenue = draft.retailTotal > 0 && existingRevenue === 0;

                    if (hasNewTrack || hasNewCustomer || hasNewRevenue) {
                        isUpdate = true;
                    } else {
                        isDuplicate = true;
                    }
                }

                setParsedOrder({
                    ...draft,
                    isDuplicate,
                    isUpdate,
                    existingId,
                    existingRecord
                });

                triggerToast(`Bóc tách chuẩn ${draft.items.length} món hàng!`, 'fa-check', 'success');
            } catch (err) {
                triggerToast('Lỗi phân tích ảnh!', 'fa-times', 'danger');
            }
            setIsProcessing(false);
        };

        const submitOrder = async () => {
            if (!parsedOrder) return;
            if (parsedOrder.isDuplicate) {
                alert('Đơn hàng này đã tồn tại trên hệ thống!');
                return;
            }

            setIsSubmitting(true);
            const activeUser = localStorage.getItem('rf_user') || 'Hệ thống';

            try {
                let newOrders = [];
                let newProdItems = [];
                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate().replace('T', ' ') : new Date().toISOString().slice(0, 16).replace('T', ' ');
                const finalOrderCode = parsedOrder.trackingId ? `${parsedOrder.orderCode} | MVĐ: ${parsedOrder.trackingId}` : parsedOrder.orderCode;

                if (parsedOrder.isUpdate && parsedOrder.existingRecord) {
                    newOrders.push({
                        id: parsedOrder.existingId,
                        orderCode: finalOrderCode,
                        channel: parsedOrder.existingRecord.channel || 'Shopee',
                        customer: (parsedOrder.customer && parsedOrder.customer !== 'Khách') ? parsedOrder.customer : (parsedOrder.existingRecord.customer || 'Khách'),
                        createdAt: parsedOrder.existingRecord.createdAt || safeDateFull,
                        deadline: parsedOrder.existingRecord.deadline,
                        date: parsedOrder.existingRecord.date || safeDateFull.split(' ')[0],
                        status: parsedOrder.existingRecord.status || 'Sẵn Sàng Đóng Gói',
                        accessories: parsedOrder.existingRecord.accessories || '[]',

                        let matchedItem = prodInfo.matchedProd;
                        let realStockQty = matchedItem ? Number(matchedItem.quantity || 0) : 0;

                        if (!prodInfo.isProd) {
                            accessories.push({ name: item.name, quantity: item.qty, price: 0 });

                            const orderQty = Number(item.qty || 1);
                            const isGlass = prodInfo.isGlass;

                                { phase1: { name: 'Dựng Khung', status: 'Pending' }, phase2: { name: 'Gia Cố', status: 'Pending' } };

                            let currentAvailable = realStockQty;
                            if (prodInfo.isBeLeSize) {
                                const prodId = 'PROD_' + Date.now() + Math.random().toString(36).substr(2, 5) + '_' + itemIdx + '_0';
                                if (currentAvailable >= orderQty) {

                                        name: item.name,
                                        note: `Bể lẻ size có sẵn ở kho (Tạo 1 lệnh bù kho x${orderQty})`,
                                        status: 'Pending', fulfilledFromStock: true,
                                        phases: workerPhases,
                                        deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : defaultDeadline
                                    });
                                } else {
                                    orderStatus = 'Chờ Sản Xuất';
                                    newProdItems.push({

                                        phases: workerPhases,
                                        deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Shopee') : defaultDeadline
                                    });
                                }
                            } else {
                                for (let q = 0; q < orderQty; q++) {
                                    const prodId = 'PROD_' + Date.now() + Math.random().toString(36).substr(2, 5) + '_' + itemIdx + '_' + q;
                                    if (currentAvailable > 0) {
                                        newProdItems.push({
                                            id: prodId, orderId: orderId,
                                            type: isGlass ? 'Bể Kính' : 'Layout',
                                            name: item.name,
                                            note: `Sản xuất bù kho cho đơn ${parsedOrder.orderCode || ''} (Cái ${q + 1}/${orderQty})`,
                                            status: 'Pending', fulfilledFromStock: true,
                                            phases: workerPhases,
                                            deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : defaultDeadline
                                        });
                                        currentAvailable--;
                                    } else {
                                        orderStatus = 'Chờ Sản Xuất';
                                        newProdItems.push({
                                            id: prodId, orderId: orderId,
                                            type: isGlass ? 'Bể Kính' : 'Layout',
                                            name: item.name,
                                            note: `Sản xuất mới cho đơn ${parsedOrder.orderCode || ''} (Cái ${q + 1}/${orderQty})`,
                                            status: 'Pending', fulfilledFromStock: false,
                                            phases: workerPhases,
                                            deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Shopee') : defaultDeadline
                                        });
                                    }
                                }
                            }
                        }

                const data = await window.safeFetchJSON("https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/v2\/shipping-order\/available-services", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Token": currentToken },
                    body: JSON.stringify({ shop_id: Number(currentShopId), from_district: Number(fromDist), to_district: Number(toDistId) })
                });
                if (data && data.code === 200 && Array.isArray(data.data) && data.data.length > 0) {
                    setAvailableServices(data.data);
                    setSelectedService(String(data.data[0].service_type_id || data.data[0].service_id || 2));
                } else {
                    // Fallback mặc định dịch vụ Chuẩn
                    setAvailableServices([{ service_type_id: 2, short_name: "Giao Hàng Chuẩn (Mặc định)" }, { service_type_id: 1, short_name: "Giao Hàng Nhanh" }]);
                    setSelectedService("2");
                }
            } catch (e) { 
                setAvailableServices([{ service_type_id: 2, short_name: "Giao Hàng Chuẩn (Mặc định)" }, { service_type_id: 1, short_name: "Giao Hàng Nhanh" }]);
                setSelectedService("2");
            }
        };

        React.useEffect(() => {
            if (!selectedProv || !selectedDist || !selectedWard) return;
            const pName = provinces.find(p => String(p.ProvinceID) === String(selectedProv))?.ProvinceName || "";
            const dName = districts.find(d => String(d.DistrictID) === String(selectedDist))?.DistrictName || "";
            const wName = wards.find(w => String(w.WardCode) === String(selectedWard))?.WardName || "";

            let parts = String(order.address || "").split(',');
            let street = parts[0];
            if (parts.length > 3) {
                street = parts.slice(0, parts.length - 3).join(',').trim();
            } else if (parts.length > 1) {
                street = parts[0].trim();
            } else {
                street = (order.address || '').trim();
            }

            const generated = `${street}, ${wName}, ${dName}, ${pName}`;
            setFinalAddress(generated);
        }, [selectedProv, selectedDist, selectedWard, provinces, districts, wards]);

        React.useEffect(() => {
            const init = async () => {
                try {
                    let configToken = apiToken;
                    let configShopId = shopId;
                    try {
                        const conf = await new Promise((resolve) => {
                            google.script.run.withSuccessHandler(resolve).withFailureHandler(() => resolve(null)).getGHNConfig();
                        });
                        if (conf && conf.token) {
                            configToken = conf.token;
                            configShopId = conf.shopId;
                            setApiToken(configToken);
                            setShopId(configShopId);
                        }
                    } catch (e) { console.error("Lỗi lấy cấu hình GHN:", e); }

                    const headers = { "Content-Type": "application/json", "Token": configToken, "ShopId": configShopId };

                    let sId = configShopId;
                    try {
                        const shopData = await window.safeFetchJSON("https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/v2\/shop\/all", { headers: headers });
                        if (shopData.code === 200 && shopData.data && shopData.data.shops) {
                            const targetShop = shopData.data.shops.find(s => String(s._id) === sId);
                            setShops(targetShop ? [targetShop] : shopData.data.shops.filter(s => String(s._id) === sId));
                            if (!targetShop && shopData.data.shops.length > 0) setShops(shopData.data.shops);
                            else if (!targetShop) setShops([{ _id: sId, name: sId + " - Richfish Aquarium" }]);
                        } else {
                            setShops([{ _id: sId, name: sId + " - Richfish Aquarium" }]);
                        }
                    } catch (e) { setShops([{ _id: sId, name: sId + " - Richfish Aquarium" }]); }

                    try {
                        const shiftData = await window.safeFetchJSON("https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/v2\/shift\/date", { headers: headers });
                        if (shiftData && shiftData.code === 200 && Array.isArray(shiftData.data) && shiftData.data.length > 0) {
                            setShifts(shiftData.data);
                            const now = new Date();
                            let defaultIdx = (now.getHours() >= 12 && shiftData.data.length > 1) ? 1 : 0;
                            if (now.getHours() >= 18 && shiftData.data.length > 2) defaultIdx = 2;
                            else if (now.getHours() >= 18) defaultIdx = shiftData.data.length - 1;
                            setSelectedShift(String(shiftData.data[defaultIdx].id));
                        }
                    } catch (e) { console.error("Lỗi lấy ca GHN:", e); }

                    const provData = await window.safeFetchJSON("https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/master-data\/province", { headers: headers });
                    let provs = provData.data || [];
                    setProvinces(provs);

                    const addr = String(order.address || "");
                    let matchedProv = null;
                    for (let p of provs) {
                        const pName = norm(p.ProvinceName);
                        const pExt = p.NameExtension ? p.NameExtension.map(e => norm(e)) : [];
                        if (norm(addr).includes(pName) || pExt.some(e => norm(addr).includes(e))) {
                            matchedProv = p; break;
                        }
                    }

                    if (matchedProv) {
                        setSelectedProv(matchedProv.ProvinceID);
                        const distData = await window.safeFetchJSON(`https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/master-data\/district?province_id=${matchedProv.ProvinceID}`, { headers: headers });
                        let dists = distData.data || [];
                        setDistricts(dists);

                        let matchedDist = null;
                        for (let d of dists) {
                            const dName = norm(d.DistrictName);
                            const dExt = d.NameExtension ? d.NameExtension.map(e => norm(e)) : [];
                            if (norm(addr).includes(dName) || dExt.some(e => norm(addr).includes(e))) {
                                matchedDist = d; break;
                            }
                        }

                        if (matchedDist) {
                            setSelectedDist(matchedDist.DistrictID);
                            fetchServices(matchedDist.DistrictID, configShopId, configToken);

                            const wardData = await window.safeFetchJSON(`https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/master-data\/ward?district_id=${matchedDist.DistrictID}`, { headers: headers });
                            let wrds = wardData.data || [];
                            setWards(wrds);

                            let matchedWard = null;
                            for (let w of wrds) {
                                const wName = norm(w.WardName);
                                const wExt = w.NameExtension ? w.NameExtension.map(e => norm(e)) : [];
                                if (norm(addr).includes(wName) || wExt.some(e => norm(addr).includes(e))) {
                                    matchedWard = w; break;
                                }
                            }
                            if (matchedWard) {
                                setSelectedWard(matchedWard.WardCode);
                            }
                        }
                    }
                } catch (e) {
                    console.error(e);
                    triggerToast("Lỗi tải dữ liệu GHN", "fa-exclamation-triangle", "warning");
                }
                setLoading(false);
            };
            init();
        }, []);

        const handleCreate = async () => {
            let phoneClean = String(customerPhone || '').replace(/[^0-9]/g, '');
            if (phoneClean.startsWith('84')) phoneClean = '0' + phoneClean.slice(2);
            if (!phoneClean.startsWith('0') && phoneClean.length === 9) phoneClean = '0' + phoneClean;

            if (!phoneClean || phoneClean.length < 10) {
                triggerToast("Số điện thoại người nhận chưa hợp lệ (cần đủ 10 số bắt đầu bằng 0)!", "fa-phone", "warning");
                return;
            }
            if (!selectedProv || !selectedDist || !selectedWard) {
                triggerToast("Vui lòng chọn đầy đủ Tỉnh/Thành, Quận/Huyện, Phường/Xã!", "fa-map-marker-alt", "warning");
                return;
            }

            setSubmitting(true);
            try {
                let weightTotal = Number(formData.weight) || 200;
                let validItems = prods && prods.length > 0 ? prods.map(p => {
                    let w = Math.floor(weightTotal / prods.length);
                    if (w < 10) w = 10;
                    return {
                        name: String(p.name || 'Sản phẩm Rich Fish').substring(0, 50).trim(),
                        quantity: Math.max(1, Number(p.qty) || 1),
                        weight: w
                    };
                }) : [{ name: "Sản phẩm Rich Fish", quantity: 1, weight: Math.max(10, weightTotal) }];

                const body = {
                    payment_type_id: Number(formData.paymentTypeId) || 2,
                    note: String(order.note || "Hàng dễ vỡ, xin nhẹ tay").substring(0, 100),
                    required_note: formData.noteCode || "CHOTHUHANG",
                    to_name: String(customerName || order.customer || 'Khách Hàng').trim().substring(0, 50),
                    to_phone: phoneClean,
                    to_address: finalAddress || order.address,
                    to_ward_code: String(selectedWard),
                    to_district_id: Number(selectedDist),
                    cod_amount: Number(formData.cod) || 0,
                    weight: weightTotal,
                    length: Number(formData.length) || 10,
                    width: Number(formData.width) || 10,
                    height: Number(formData.height) || 10,
                    insurance_value: Math.min(Number(formData.insurance) || 0, 5000000),
                    service_type_id: Number(selectedService) || 2,
                    items: validItems
                };
                
                if (selectedShift) {
                    body.pick_shift = [Number(selectedShift)];
                }

                console.log("=== GHN PAYLOAD ===", JSON.stringify(body));
                const h = { "Content-Type": "application/json", "Token": apiToken, "ShopId": shopId };
                
                let data = await window.safeFetchJSON("https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/v2\/shipping-order\/create", {
                    method: "POST", headers: h, body: JSON.stringify(body)
                });
                console.log("=== GHN RESPONSE ===", JSON.stringify(data));

                if (data && data.code === 400 && data.message && data.message.toLowerCase().includes("client_order_code")) {
                    body.client_order_code = String(order.id) + "_" + Date.now().toString().slice(-4);
                    data = await window.safeFetchJSON("https:\/\/online-gateway.ghn.vn\/shiip\/public-api\/v2\/shipping-order\/create", { method: "POST", headers: h, body: JSON.stringify(body) });
                }

                if (data && (data.code === 200 || data.data?.order_code) && data.data?.order_code) {
                    let newOrderCode = order.orderCode || '';
                    if (newOrderCode.includes(' | MVĐ: ')) newOrderCode = newOrderCode.split(' | MVĐ: ')[0];
                    else if (newOrderCode.includes('|MVĐ:')) newOrderCode = newOrderCode.split('|MVĐ:')[0];
                    newOrderCode = newOrderCode + ' | MVĐ: ' + data.data.order_code;

                    const updatedOrder = { 
                        ...order, 
                        customer: customerName || order.customer,
                        phone: phoneClean,
                        address: finalAddress || order.address,
                        orderCode: newOrderCode, 
                        shippingCode: data.data.order_code, 
                        cod: Number(formData.cod) 
                    };
                    pushDeltas({ orders: [updatedOrder] }, `Tạo đơn GHN thành công! Vận đơn: ${data.data.order_code}`, "fa-check").then(() => {
                        if (typeof showCopyModal === 'function') {
                            const msg = `Dạ Rich Fish Aquarium gửi anh/chị mã vận đơn GHN: ${data.data.order_code}. Anh/chị theo dõi hành trình đơn hàng trên app giúp shop nhé!`;
                            showCopyModal(msg);
                        }
                    }).catch(() => { });
                    onClose();
                } else {
                    let errMsg = data?.message || data?.code_message_value || "Tạo đơn GHN thất bại";
                    if (String(errMsg).includes("to_phone")) errMsg = "Số điện thoại không hợp lệ trong hệ thống GHN!";
                    if (String(errMsg).includes("to_ward_code")) errMsg = "Chưa chọn Phường/Xã hoặc Phường/Xã không tồn tại!";
                    if (String(errMsg).includes("pick_shift")) errMsg = "Ca lấy hàng không hợp lệ, vui lòng chọn lại ca!";
                    throw new Error(errMsg);
                }
            } catch (e) {
                console.error("Lỗi tạo đơn GHN:", e);
                triggerToast(e.message || "Lỗi khi đẩy đơn sang GHN!", "fa-times", "danger");
            }
            setSubmitting(false);
        };

        if (loading) return (
            <div className="fixed inset-0 z-[999] bg-black/80 flex items-center justify-center p-4 backdrop-blur-md">
                <div className="bg-[#141414] border border-[#333] p-8 rounded-2xl flex flex-col items-center gap-4">
                    <i className="fas fa-spinner fa-spin text-orange-500 text-3xl"></i>
                    <div className="text-white font-bold text-sm">Đang đọc hiểu địa chỉ & kết nối GHN...</div>
                </div>
            </div>
        );

        return (
            <div className="fixed inset-0 z-[999] bg-black/85 flex flex-col items-center justify-center p-4 backdrop-blur-md animate-fade-in" onClick={onClose}>
                <div className="bg-[#121214] w-full max-w-lg rounded-[24px] border border-[#333] shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-slide-up" onClick={e => e.stopPropagation()}>
                    {/* Header */}
                    <div className="p-4 border-b border-[#27272a] bg-gradient-to-r from-orange-900/40 to-[#18181b] flex justify-between items-center shrink-0">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-full bg-orange-500/20 flex items-center justify-center border border-orange-500/30">
                                <i className="fas fa-truck text-orange-500 text-sm"></i>
                            </div>
                            <div>
                                <h3 className="font-black text-[14px] text-white uppercase tracking-widest leading-tight">Đẩy Đơn GHN (Giao Hàng Nhanh)</h3>
                                <div className="text-[10px] text-gray-400 font-bold">Xác nhận tạo vận đơn nhanh</div>
                            </div>
                        </div>
                        <button type="button" onClick={onClose} className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-zinc-800 hover:bg-rose-600 text-zinc-300 hover:text-white flex items-center justify-center transition-all cursor-pointer shadow-lg z-50 shrink-0 border border-white/10" title="Đóng (Esc)">
                            <i className="fas fa-times text-sm font-bold"></i>
                        </button>
                    </div>

                    {/* Body */}
                    <div className="p-5 overflow-y-auto custom-scrollbar flex-1 space-y-5">
                        {/* Customer Info */}
                        <div className="bg-[#111] border border-[#222] p-4 rounded-xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-16 h-16 bg-orange-500/10 rounded-bl-[100%]"></div>
                            <div className="text-[10px] font-black text-orange-500 mb-2 uppercase tracking-widest"><i className="fas fa-user mr-1"></i> Thông tin Người Nhận (Có thể chỉnh sửa)</div>
                            <div className="grid grid-cols-2 gap-3 mb-3">
                                <div>
                                    <label className="text-[9px] text-gray-500 font-bold block mb-1">Họ tên người nhận</label>
                                    <input 
                                        type="text"
                                        value={customerName} 
                                        onChange={e => setCustomerName(e.target.value)} 
                                        className="w-full bg-[#121214] border border-[#333] rounded-lg px-2.5 py-1.5 text-[11.5px] font-bold text-white outline-none focus:border-orange-500" 
                                        placeholder="Nhập tên người nhận"
                                    />
                                </div>
                                <div>
                                    <label className="text-[9px] text-gray-500 font-bold block mb-1">Số điện thoại</label>
                                    <input 
                                        type="text"
                                        value={customerPhone} 
                                        onChange={e => setCustomerPhone(e.target.value)} 
                                        className="w-full bg-[#121214] border border-[#333] rounded-lg px-2.5 py-1.5 text-[11.5px] font-bold text-white outline-none focus:border-orange-500" 
                                        placeholder="VD: 0987654321"
                                    />
                                </div>
                            </div>
                            <div>
                                <label className="text-[9px] text-gray-500 font-bold block mb-1">Địa chỉ giao hàng GHN</label>
                                <input value={finalAddress} onChange={e => setFinalAddress(e.target.value)} className="w-full bg-[#121214] border border-[#333] rounded-lg px-2.5 py-2 text-[11px] font-bold text-white outline-none focus:border-orange-500" />
                            </div>
                        </div>

                        {/* Address Mapping */}
                        <div className="space-y-3">
                            <div className="text-[10px] font-black text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                <i className="fas fa-map-marker-alt"></i> Phân tích địa chỉ GHN
                                {selectedWard && selectedDist && selectedProv && <span className="text-emerald-500"><i className="fas fa-check-circle"></i> Tự động khớp</span>}
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <select value={selectedProv} onChange={e => { setSelectedProv(e.target.value); fetchDistricts(e.target.value, { "Content-Type": "application/json", "Token": apiToken, "ShopId": shopId }); }} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2 text-[11px] font-bold text-white outline-none focus:border-orange-500">
                                    <option value="">- Chọn Tỉnh/Thành -</option>
                                    {provinces.map(p => <option key={p.ProvinceID} value={p.ProvinceID}>{p.ProvinceName}</option>)}
                                </select>
                                <select value={selectedDist} onChange={e => { setSelectedDist(e.target.value); fetchWards(e.target.value, { "Content-Type": "application/json", "Token": apiToken, "ShopId": shopId }); }} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2 text-[11px] font-bold text-white outline-none focus:border-orange-500" disabled={!selectedProv}>
                                    <option value="">- Chọn Quận/Huyện -</option>
                                    {districts.map(d => <option key={d.DistrictID} value={d.DistrictID}>{d.DistrictName}</option>)}
                                </select>
                                <select value={selectedWard} onChange={e => setSelectedWard(e.target.value)} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2 text-[11px] font-bold text-white outline-none focus:border-orange-500" disabled={!selectedDist}>
                                    <option value="">- Chọn Phường/Xã -</option>
                                    {wards.map(w => <option key={w.WardCode} value={w.WardCode}>{w.WardName}</option>)}
                                </select>
                            </div>
                        </div>

                        {/* Package Info */}
                        <div className="space-y-3">
                            <div className="text-[10px] font-black text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                <i className="fas fa-box-open"></i> Cấu hình kiện hàng
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-[10px] text-gray-400 font-bold block mb-1">Cửa hàng (ShopId)</label>
                                    <select value={shopId} onChange={e => { setShopId(e.target.value); if(selectedDist) fetchServices(selectedDist, e.target.value, apiToken); }} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2.5 text-[12px] font-bold text-white outline-none focus:border-orange-500">
                                        {shops.map(s => <option key={s._id} value={s._id}>{s.name || s._id}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[10px] text-gray-400 font-bold block mb-1">Người trả phí Ship</label>
                                    <select value={formData.paymentTypeId} onChange={e => setFormData({ ...formData, paymentTypeId: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2.5 text-[12px] font-bold text-white outline-none focus:border-orange-500">
                                        <option value={1}>Shop trả (Người gửi)</option>
                                        <option value={2}>Khách trả (Người nhận)</option>
                                    </select>
                                </div>
                                <div className="col-span-2 bg-[#121214] border border-orange-500/30 rounded-xl p-3">
                                    <label className="text-[10px] text-orange-400 font-black uppercase tracking-wider flex items-center gap-1.5 mb-1.5"><i className="fas fa-shipping-fast text-orange-500"></i> Gói cước GHN</label>
                                    <select value={selectedService} onChange={e => setSelectedService(e.target.value)} className="w-full bg-[#121214] border border-orange-500/40 rounded-lg px-3 py-2.5 text-[12px] font-bold text-white outline-none focus:border-orange-500">
                                        {availableServices.length > 0 ? availableServices.map(s => <option key={s.service_type_id || s.service_id} value={s.service_type_id || s.service_id}>{s.short_name || 'Giao Hàng Nhanh'}</option>) : <option value="2">Giao Hàng Chuẩn (Mặc định)</option>}
                                    </select>
                                </div>
                                <div className="col-span-2 bg-[#121214] border border-orange-500/30 rounded-xl p-3">
                                    <label className="text-[10px] text-orange-400 font-black uppercase tracking-wider flex items-center gap-1.5 mb-1.5"><i className="fas fa-calendar-check text-orange-500"></i> Ca lấy hàng</label>
                                    <select value={selectedShift} onChange={e => setSelectedShift(e.target.value)} className="w-full bg-[#121214] border border-orange-500/40 rounded-lg px-3 py-2.5 text-[12px] font-bold text-white outline-none focus:border-orange-500">
                                        {shifts.length > 0 ? shifts.map((s, idx) => <option key={s.id + '_' + idx} value={String(s.id)}>{s.title || `Ca #${s.id}`}</option>) : <option value="">Tự động theo lịch GHN</option>}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[10px] text-gray-400 font-bold block mb-1">Trọng lượng (gram)</label>
                                    <input type="number" value={formData.weight} onChange={e => setFormData({ ...formData, weight: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-3 py-2.5 text-[12px] font-bold text-white outline-none focus:border-orange-500 text-center" />
                                </div>
                                <div>
                                    <label className="text-[10px] text-gray-400 font-bold block mb-1">Kích thước (D-R-C cm)</label>
                                    <div className="flex gap-1">
                                        <input type="number" value={formData.length} onChange={e => setFormData({ ...formData, length: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-1 py-2.5 text-[11px] font-bold text-white outline-none focus:border-orange-500 text-center" />
                                        <input type="number" value={formData.width} onChange={e => setFormData({ ...formData, width: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-1 py-2.5 text-[11px] font-bold text-white outline-none focus:border-orange-500 text-center" />
                                        <input type="number" value={formData.height} onChange={e => setFormData({ ...formData, height: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-1 py-2.5 text-[11px] font-bold text-white outline-none focus:border-orange-500 text-center" />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[10px] text-emerald-500 font-bold block mb-1">Tiền Thu Hộ (COD)</label>
                                    <input type="number" value={formData.cod} onChange={e => setFormData({ ...formData, cod: e.target.value })} className="w-full bg-[#111] border border-emerald-500/50 rounded-lg px-3 py-2.5 text-[13px] font-black text-emerald-400 outline-none focus:border-emerald-500 text-center shadow-[0_0_10px_rgba(16,185,129,0.1)]" />
                                </div>
                                <div>
                                    <label className="text-[10px] text-gray-400 font-bold block mb-1">Ghi chú bắt buộc</label>
                                    <select value={formData.noteCode} onChange={e => setFormData({ ...formData, noteCode: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2.5 text-[11px] font-bold text-white outline-none focus:border-orange-500">
                                        <option value="CHOTHUHANG">Cho thử hàng</option>
                                        <option value="CHOXEMHANGKHONGTHU">Cho xem hàng, ko thử</option>
                                        <option value="KHONGCHOXEMHANG">Không cho xem hàng</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Footer */}

                            {submitting ? <><i className="fas fa-spinner fa-spin"></i> ĐANG ĐẨY ĐƠN GHN...</> : <><i className="fas fa-paper-plane"></i> XÁC NHẬN TẠO ĐƠN GHN</>}
