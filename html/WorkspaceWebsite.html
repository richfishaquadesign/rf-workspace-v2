<style>
#rf-website-dialog {
  width: 100vw;
  height: 100vh;
  max-width: 100vw;
  max-height: 100vh;
  margin: 0;
  padding: 0;
  border: none;
  border-radius: 0;
  background: #080d0a;
  color: #e9eee9;
  position: fixed;
  inset: 0;
  z-index: 999999;
  display: none;
  flex-direction: column;
}
#rf-website-dialog[open] {
  display: flex;
}
#rf-website-dialog::backdrop {
  background: rgba(0, 0, 0, 0.9);
}
.rf-ws-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 48px;
  padding: 0 12px;
  background: #0c1410;
  border-bottom: 1px solid #1f2e24;
  box-sizing: border-box;
  flex-shrink: 0;
  user-select: none;
}
.rf-ws-brand-area {
  display: flex;
  align-items: center;
  gap: 10px;
}
.rf-ws-btn-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  color: #86efac;
  background: #14281e;
  border: 1px solid #28543b;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.rf-ws-btn-back:hover {
  background: #1c3b2c;
  color: #bbf7d0;
  border-color: #387653;
}
.rf-ws-brand-title {
  font-size: 14px;
  font-weight: 600;
  color: #f0fdf4;
  letter-spacing: -0.2px;
}
.rf-ws-brand-tag {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 999px;
  background: #1e3a2b;
  color: #86efac;
  border: 1px solid #2b573e;
}
.rf-ws-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.rf-ws-btn-tool {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 500;
  color: #cbd5e1;
  background: #141e18;
  border: 1px solid #28372d;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.rf-ws-btn-tool:hover {
  background: #1f2d24;
  color: #f8fafc;
  border-color: #3f5546;
}
.rf-ws-btn-tool:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.rf-ws-btn-tool.sync-btn {
  color: #7dd3fc;
  border-color: #1e3a5f;
  background: #0f1e2e;
}
.rf-ws-btn-tool.sync-btn:hover {
  background: #162c45;
  color: #bae6fd;
}
.rf-ws-frame-wrapper {
  position: relative;
  flex: 1;
  width: 100%;
  height: calc(100vh - 48px);
  background: #060a08;
  overflow: hidden;
}
#rf-website-iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
.rf-ws-loader {
  position: absolute;
  inset: 0;
  background: #080d0a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #86efac;
  font-size: 14px;
  z-index: 10;
  transition: opacity 0.25s ease;
}
.rf-ws-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #1f3627;
  border-top-color: #22c55e;
  border-radius: 50%;
  animation: rf-spin 0.8s linear infinite;
}
@keyframes rf-spin {
  to { transform: rotate(360deg); }
}
#rf-website-menu-button {
  display: block;
  margin: 10px 14px;
  padding: 10px 14px;
  border: 1px solid #3c5144;
  background: #18251e;
  color: #e9f3e9;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
}
@media (max-width: 640px) {
  .rf-ws-brand-title { display: none; }
  .rf-ws-btn-tool span { display: none; }
}
</style>

<dialog id="rf-website-dialog" aria-labelledby="rf-website-heading">
  <div class="rf-ws-topbar">
    <div class="rf-ws-brand-area">
      <button type="button" class="rf-ws-btn-back" id="rf-website-back-btn" title="Đóng và quay lại Workspace Pro">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Workspace Pro</span>
      </button>
      <span class="rf-ws-brand-title" id="rf-website-heading">Website RF Aqua</span>
      <span class="rf-ws-brand-tag">Visual Editor V1.3</span>
    </div>
    <div class="rf-ws-actions">
      <button type="button" class="rf-ws-btn-tool sync-btn" id="rf-website-sync-prod" title="Đồng bộ giá & ảnh từ bảng Kho hàng Products">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        <span>Đồng bộ kho</span>
      </button>
      <button type="button" class="rf-ws-btn-tool" id="rf-website-reload-btn" title="Tải lại trang Visual Editor">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>
        <span>Tải lại</span>
      </button>
      <button type="button" class="rf-ws-btn-tool" id="rf-website-open-external" title="Mở tab mới trên trình duyệt (dành cho máy tính)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
        <span>Tab mới ↗</span>
      </button>
      <button type="button" class="rf-ws-btn-tool" id="rf-website-close-btn" title="Đóng" style="color:#f87171;border-color:#4a2020">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>
  <div class="rf-ws-frame-wrapper">
    <div class="rf-ws-loader" id="rf-website-loader">
      <div class="rf-ws-spinner"></div>
      <div>Đang kết nối Visual Editor V1.3…</div>
    </div>
    <iframe id="rf-website-iframe" title="Website RF Aqua - Visual Editor V1.3" allow="clipboard-read; clipboard-write"></iframe>
  </div>
</dialog>

<script>
(function(){
  const EDITOR_URL = 'https://rf-aquarium.vercel.app/quan-tri?pin=RF2026@';

  function sessionValue(key){
    let value = '';
    try { value = localStorage.getItem(key) || ''; } catch(e){}
    if (!value) {
      const match = document.cookie.match(new RegExp('(?:^|; )' + key + '=([^;]*)'));
      if (match) value = match[1];
    }
    return value;
  }

  function notify(msg, type = 'info') {
    if (typeof window.triggerToast === 'function') {
      const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-times-circle' : 'fa-info-circle');
      window.triggerToast(msg, icon, type === 'error' ? 'danger' : type);
    } else {
      alert(msg);
    }
  }

  const dialog = document.getElementById('rf-website-dialog');
  const iframe = document.getElementById('rf-website-iframe');
  const loader = document.getElementById('rf-website-loader');
  const backBtn = document.getElementById('rf-website-back-btn');
  const closeBtn = document.getElementById('rf-website-close-btn');
  const reloadBtn = document.getElementById('rf-website-reload-btn');
  const openExternalBtn = document.getElementById('rf-website-open-external');
  const syncBtn = document.getElementById('rf-website-sync-prod');

  function isSupremeRole() {
    const role = String(sessionValue('rf_role')).trim().toUpperCase();
    const pin = String(sessionValue('rf_pin')).trim();
    return role === 'TỐI CAO' || pin === '226868';
  }

  function openEditorModal() {
    if (!isSupremeRole()) {
      notify('Chỉ phân quyền TỐI CAO mới được truy cập Tinh Chỉnh Web!', 'error');
      return;
    }
    if (!iframe.src || iframe.src === 'about:blank' || iframe.src === window.location.href || iframe.src.indexOf('pin=') === -1) {
      loader.style.display = 'flex';
      iframe.src = EDITOR_URL;
    }
    dialog.showModal();
  }
  window.openWebsiteEditorModal = openEditorModal;

  function closeEditorModal() {
    dialog.close();
  }

  iframe.addEventListener('load', () => {
    loader.style.display = 'none';
  });

  if (backBtn) backBtn.onclick = closeEditorModal;
  if (closeBtn) closeBtn.onclick = closeEditorModal;

  if (reloadBtn) {
    reloadBtn.onclick = () => {
      loader.style.display = 'flex';
      iframe.src = EDITOR_URL;
    };
  }

  if (openExternalBtn) {
    openExternalBtn.onclick = () => {
      window.open(EDITOR_URL, '_blank');
    };
  }

  if (syncBtn) {
    syncBtn.onclick = async () => {
      const pin = sessionValue('rf_pin');
      if (!pin) {
        notify('Vui lòng đăng nhập RF Workspace Pro!', 'error');
        return;
      }
      syncBtn.disabled = true;
      notify('Đang đối soát giá & sản phẩm từ bảng Kho hàng Products...', 'info');

      try {
        await new Promise((resolve, reject) => {
          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
              .withSuccessHandler(res => {
                notify('Đã đồng bộ ' + (res?.updatedCount || 0) + ' sản phẩm từ Kho hàng lên website!', 'success');
                resolve(res);
              })
              .withFailureHandler(err => {
                notify('Lỗi đồng bộ: ' + (err?.message || err), 'error');
                reject(err);
              })
              .rfWebsiteManage(pin, 'syncProductsFromInventory', {});
          } else {
            notify('Môi trường cục bộ: Đã gửi tín hiệu đồng bộ kho.', 'info');
            resolve();
          }
        });
      } finally {
        syncBtn.disabled = false;
      }
    };
  }

  // Nút Tinh Chỉnh Web đã được tích hợp trực tiếp vào danh sách menu chính (V6.2)
  const legacyBtn = document.getElementById('rf-website-menu-button');
  if (legacyBtn) legacyBtn.remove();
})();
</script>
