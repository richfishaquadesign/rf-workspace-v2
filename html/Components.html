    try {

        return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
        console.error("FATAL PARSE ERROR: ", e);
        throw new Error("FATAL_DATA_CORRUPTION");
    }
};

const getDrivePreviewUrl = (url) => {
    if (!url) return '';

    if (match) return ('https:\x2F\x2Fdrive.google.com/file/d/' + match[0] + '/preview');
    return url;
};

// PERF: Chuyển đổi Google Drive URL sang thumbnail proxy nhẹ hơn ~10-20x
// size: 'sm' (120px), 'md' (300px), 'lg' (600px), 'full' (ảnh gốc)
window.rfOptimizeImageUrl = (url, size = 'sm') => {
    if (!url || typeof url !== 'string') return '';
    const str = url.trim();
    
    // Đã là thumbnail proxy rồi thì không cần convert lại
    if (str.includes('lh3.googleusercontent.com/d/')) return str;
    
    // Nếu là postimg, imgur, hoặc URL ngoài thì giữ nguyên
    if (!str.includes('drive.google.com') && !str.includes('googleusercontent.com')) return str;
    
    // Extract Google Drive file ID
    let fileId = null;
    const patterns = [
        /\/d\/([a-zA-Z0-9_-]{20,})/,         // /file/d/ID/...
        /id=([a-zA-Z0-9_-]{20,})/,            // ?id=ID
        /[-\w]{25,}/                            // raw ID fallback
    ];
    for (const p of patterns) {
        const m = str.match(p);
        if (m) { fileId = m[1] || m[0]; break; }
    }
    if (!fileId) return str;
    
    // Chuyển sang lh3 proxy với kích thước nhỏ
    const sizeMap = { sm: 'w120-h120', md: 'w300-h300', lg: 'w600-h600', full: 'w0' };
    const sizeParam = sizeMap[size] || sizeMap.sm;
    return `https:\x2F\x2Flh3.googleusercontent.com/d/${fileId}=${sizeParam}`;
};

});

window.resizeImage = (file, maxWidth = 800, maxHeight = 800, initialQuality = 0.5) => {
    return new Promise((resolve, reject) => {
        if (!file || !file.type.match(/image.*/)) return reject(new Error("Not an image"));
        const reader = new FileReader();
        reader.onload = (e) => {
            const image = new Image();
            image.onload = () => {
                let width = image.width; let height = image.height;
                if (width > height && width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                else if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(image, 0, 0, width, height);
                
                let quality = initialQuality;
                let dataUrl = canvas.toDataURL('image/jpeg', quality);
                
                // Google Sheets cell limit is 50,000 chars. We aim for < 45,000.
                while (dataUrl.length > 45000 && quality > 0.1) {
                    quality -= 0.1;
                    dataUrl = canvas.toDataURL('image/jpeg', Math.max(0.1, quality));
                }
                
                while (dataUrl.length > 45000 && width > 100) {
                    width = Math.round(width * 0.7);
                    height = Math.round(height * 0.7);
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(image, 0, 0, width, height);
                    dataUrl = canvas.toDataURL('image/jpeg', quality);
                }
                
                resolve(dataUrl);
            };
            image.onerror = reject;
            image.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
};

const Avatar = React.memo(function Avatar({ name, userConfigs, className="" }) { 
    const [hasError, setHasError] = React.useState(false);
    let id = null;
    try {
        if (userConfigs && name) {
            const cleanName = String(name).trim().toLowerCase();
            const sourceMap = userConfigs.avatars ? userConfigs.avatars : userConfigs;
            if (sourceMap[name]) {
                id = sourceMap[name];
            } else {
                const nameParts = cleanName.split(/[\s.]+/).filter(Boolean);
                const mainName = nameParts[nameParts.length - 1];
                const firstLetter = nameParts[0]?.[0];
                const matchedKey = Object.keys(sourceMap).find(key => {
                    const keyParts = String(key).trim().toLowerCase().split(/[\s.]+/).filter(Boolean);
                    return keyParts[keyParts.length - 1] === mainName && keyParts[0]?.[0] === firstLetter;
                });
                if (matchedKey) id = sourceMap[matchedKey];
            }
        }
    } catch(e) {}

    let cleanId = id;
    if (id && String(id).includes('drive.google.com')) {
        const match = String(id).match(/[-\w]{25,}/);
        if (match) cleanId = match[0];
    }

    if (cleanId && !hasError) { 
        const isFullUrl = String(cleanId).startsWith('http://') || String(cleanId).startsWith('https://');
        const imgSrc = isFullUrl ? cleanId : ('https:\x2F\x2Flh3.googleusercontent.com/d/' + cleanId + '=w120-h120');
        return <img src={imgSrc} className={`object-cover rounded-full shadow-sm bg-[#18181c] ${className}`} alt={name} onError={() => setHasError(true)} />;
    } 
    return <div className={`flex items-center justify-center rounded-full bg-[#18181c] text-zinc-500 border border-white/[0.08] ${className}`}><i className="fas fa-user text-[11px]"></i></div>;
});

const RFImageLightboxModal = React.memo(function RFImageLightboxModal({ src, title = "Xem Ảnh", subTitle = "", onClose }) {
    const [zoom, setZoom] = React.useState(1);
    const [isLoading, setIsLoading] = React.useState(true);
    const [hasError, setHasError] = React.useState(false);
    const [imgSrc, setImgSrc] = React.useState(() => {
        if (!src) return '';
        if (typeof getDirectImageUrl === 'function') {
            const cdn = getDirectImageUrl(src, 'w1600');
            return cdn || src;
        }
        return src;
    });

    React.useEffect(() => {
        setZoom(1);
        setIsLoading(true);
        setHasError(false);
        if (src) {
            const cdn = typeof getDirectImageUrl === 'function' ? getDirectImageUrl(src, 'w1600') : src;
            setImgSrc(cdn || src);
        }
    }, [src]);

    React.useEffect(() => {
        const handleKeyDown = (e) => {
            if (e.key === 'Escape') {
                onClose && onClose();
            }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
    }, [onClose]);

    if (!src) return null;

    const safeDriveUrl = typeof getSafeDriveViewUrl === 'function' ? getSafeDriveViewUrl(src) : src;
    const isDriveImg = src.includes('drive.google.com') || src.includes('googleusercontent.com');

// 📸 COMPONENT: MODAL XEM 5 GÓC CHỤP LAYOUT (STUDIO MULTI-ANGLE VIEWER)
// Tích Hợp Chống Chặn Mixed Content (HTTPS / HTTP) & Nút 1-Chạm Mở Trực Tiếp

const Layout5AngleViewerModal = React.memo(function Layout5AngleViewerModal() {
    const [isOpen, setIsOpen] = React.useState(false);
    const [currentLayout, setCurrentLayout] = React.useState(null);
    const [activeAngleKey, setActiveAngleKey] = React.useState('front');
    const [isAutoRotating, setIsAutoRotating] = React.useState(false);
    const [zoom, setZoom] = React.useState(1);
    const [pan, setPan] = React.useState({ x: 0, y: 0 });
    const [isDragging, setIsDragging] = React.useState(false);
    const [dragStart, setDragStart] = React.useState({ x: 0, y: 0 });
    const [showWebData, setShowWebData] = React.useState(false);
    const [copiedTooltip, setCopiedTooltip] = React.useState(false);
    const [imgErrors, setImgErrors] = React.useState({});

    // Reset zoom và pan khi chuyển góc
    const selectAngle = React.useCallback((key) => {
        setActiveAngleKey(key);
        setIsAutoRotating(false);
        setZoom(1);
        setPan({ x: 0, y: 0 });
        setIsDragging(false);
    }, []);

    // Điều khiển Zoom đa cấp (1x -> 4x, bước 0.5x)
    const handleZoomIn = React.useCallback((e) => {
        if (e) e.stopPropagation();
        setZoom(prev => Math.min(4, +(prev + 0.5).toFixed(1)));
    }, []);

    const handleZoomOut = React.useCallback((e) => {
        if (e) e.stopPropagation();
        setZoom(prev => {
            const next = Math.max(1, +(prev - 0.5).toFixed(1));
            if (next <= 1) setPan({ x: 0, y: 0 });
            return next;
        });
    }, []);

    const handleResetZoom = React.useCallback((e) => {
        if (e) e.stopPropagation();
        setZoom(1);
        setPan({ x: 0, y: 0 });
        setIsDragging(false);
    }, []);

    const handleToggleZoomQuick = React.useCallback((e) => {
        if (e) e.stopPropagation();
        setZoom(prev => {
            if (prev > 1) {
                setPan({ x: 0, y: 0 });
                return 1;
            }
            return 2.5;
        });
    }, []);

    // Kéo rê (Pan) khi zoom > 1
    const handleMouseDown = React.useCallback((e) => {
        if (zoom <= 1) return;
        setIsDragging(true);
        setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
    }, [zoom, pan]);

    const handleMouseMove = React.useCallback((e) => {
        if (!isDragging || zoom <= 1) return;
        setPan({
            x: e.clientX - dragStart.x,
            y: e.clientY - dragStart.y
        });
    }, [isDragging, zoom, dragStart]);

    const handleMouseUp = React.useCallback(() => {
        setIsDragging(false);
    }, []);

    const handleTouchStart = React.useCallback((e) => {
        if (zoom <= 1 || !e.touches || e.touches.length !== 1) return;
        const touch = e.touches[0];
        setIsDragging(true);
        setDragStart({ x: touch.clientX - pan.x, y: touch.clientY - pan.y });
    }, [zoom, pan]);

    const handleTouchMove = React.useCallback((e) => {
        if (!isDragging || zoom <= 1 || !e.touches || e.touches.length !== 1) return;
        const touch = e.touches[0];
        setPan({
            x: touch.clientX - dragStart.x,
            y: touch.clientY - dragStart.y
        });
    }, [isDragging, zoom, dragStart]);

    const handleTouchEnd = React.useCallback(() => {
        setIsDragging(false);
    }, []);

    const handleWheel = React.useCallback((e) => {
        if (!e.deltaY) return;
        e.preventDefault();
        if (e.deltaY < 0) {
            handleZoomIn();
        } else {
            handleZoomOut();
        }
    }, [handleZoomIn, handleZoomOut]);

    React.useEffect(() => {
        const handler = (e) => {
            const target = e.detail;
            if (!target) return;
            const data = (target.angles && target.angleList) ? target : (typeof window.findLayoutAngles === 'function' ? window.findLayoutAngles(target) : null);
            if (data) {
                setCurrentLayout(data);
                setActiveAngleKey('front');
                setIsAutoRotating(false);
                setZoom(1);
                setPan({ x: 0, y: 0 });
                setShowWebData(false);
                setImgErrors({});
                setIsOpen(true);
            }
        };
        window.addEventListener('openLayout5Angles', handler);
        return () => window.removeEventListener('openLayout5Angles', handler);
    }, []);

    React.useEffect(() => {
        if (!isAutoRotating || !isOpen || !currentLayout) return;
        const keys = ['front', 'distant', 'left', 'right', 'top'];
        const timer = setInterval(() => {
            setActiveAngleKey(prev => {
                const idx = keys.indexOf(prev);
                return keys[(idx + 1) % keys.length];
            });
            setZoom(1);
            setPan({ x: 0, y: 0 });
        }, 2400);
        return () => clearInterval(timer);
    }, [isAutoRotating, isOpen, currentLayout]);

    React.useEffect(() => {
        if (!isOpen) return;
        const keyHandler = (e) => {
            if (e.key === 'Escape') {
                setIsOpen(false);
            } else if (e.key === '1') {
                selectAngle('front');
            } else if (e.key === '2') {
                selectAngle('distant');
            } else if (e.key === '3') {
                selectAngle('left');
            } else if (e.key === '4') {
                selectAngle('right');
            } else if (e.key === '5') {
                selectAngle('top');
            } else if (e.key === 'ArrowRight') {
                const keys = ['front', 'distant', 'left', 'right', 'top'];
                setActiveAngleKey(prev => keys[(keys.indexOf(prev) + 1) % keys.length]);
                setZoom(1);
                setPan({ x: 0, y: 0 });
            } else if (e.key === 'ArrowLeft') {
                const keys = ['front', 'distant', 'left', 'right', 'top'];
                setActiveAngleKey(prev => keys[(keys.indexOf(prev) - 1 + keys.length) % keys.length]);
                setZoom(1);
                setPan({ x: 0, y: 0 });
            } else if (e.key === '+' || e.key === '=') {
                handleZoomIn();
            } else if (e.key === '-' || e.key === '_') {
                handleZoomOut();
            } else if (e.key === '0') {
                handleResetZoom();
            } else if (e.key === ' ' && e.target === document.body) {
                e.preventDefault();
                setIsAutoRotating(prev => !prev);
            }
        };
        window.addEventListener('keydown', keyHandler);
        return () => window.removeEventListener('keydown', keyHandler);
    }, [isOpen, selectAngle, handleZoomIn, handleZoomOut, handleResetZoom]);

    if (!isOpen || !currentLayout) return null;

    const angleKeys = ['front', 'distant', 'left', 'right', 'top'];
    const activeAngle = currentLayout.angles[activeAngleKey] || currentLayout.angles.front;
    const currentIdx = angleKeys.indexOf(activeAngleKey) + 1;
    const isCurrentBlocked = !!imgErrors[activeAngleKey];

    const handleCopyCurrentLink = () => {
        if (activeAngle?.url) {
            navigator.clipboard.writeText(activeAngle.url);
            setCopiedTooltip(true);
            setTimeout(() => setCopiedTooltip(false), 2000);
        }
    };

    const handleCopyAll5Links = () => {
        const payload = {
            layoutName: currentLayout.name,
            subCategory: currentLayout.subCategory,
            angles: {
                front: currentLayout.angles.front.url,
                distant: currentLayout.angles.distant.url,
                left: currentLayout.angles.left.url,
                right: currentLayout.angles.right.url,
                top: currentLayout.angles.top.url
            }
        };
        navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
        setCopiedTooltip(true);
        setTimeout(() => setCopiedTooltip(false), 2000);
    };

    const handleDownloadCurrentPhoto = () => {
        if (activeAngle?.url) {
            const a = document.createElement('a');
            a.href = activeAngle.url;
            a.download = activeAngle.filename || `${currentLayout.name}_${activeAngleKey}.jpg`;

    return ReactDOM.createPortal(
        <div

            >

                <div className="flex items-center gap-2.5 sm:gap-3 min-w-0 flex-1">

                        <i className="fas fa-cube text-base sm:text-lg"></i>
                    </div>
                    <div className="min-w-0 flex-1">

                            <span className="text-zinc-400 font-mono text-[10.5px]">Phím [1-5] chuyển góc, [+/-] phóng to/thu nhỏ, [Space] xoay</span>

                <div 
                    className={`w-full h-full flex items-center justify-center relative p-2 overflow-hidden ${zoom > 1 ? (isDragging ? 'cursor-grabbing' : 'cursor-grab') : 'cursor-default'}`}
                    onMouseDown={handleMouseDown}
                    onMouseMove={handleMouseMove}
                    onMouseUp={handleMouseUp}
                    onMouseLeave={handleMouseUp}
                    onTouchStart={handleTouchStart}
                    onTouchMove={handleTouchMove}
                    onTouchEnd={handleTouchEnd}
                    onDoubleClick={handleToggleZoomQuick}
                >
                    {isCurrentBlocked ? (
                        <div className="max-w-md w-full p-6 rounded-2xl bg-[#141418]/95 border border-amber-500/30 text-center space-y-4 backdrop-blur-xl shadow-2xl">
                            <div className="w-14 h-14 mx-auto rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-2xl shadow-inner">
                                <i className="fas fa-shield-halved"></i>
                            </div>
                            <div>
                                <h4 className="text-white font-bold text-sm">Trình Duyệt Chặn Ảnh Nội Bộ (Mixed Content)</h4>
                                <p className="text-zinc-400 text-xs mt-1 leading-relaxed">
                                    Trang web HTTPS chặn tải trực tiếp ảnh từ máy chủ xưởng HTTP (<span className="text-amber-400 font-mono">127.0.0.1:8000</span>).
                                </p>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-2 justify-center pt-1">
                                <button 
                                    type="button"
                                    onClick={handleOpenInNewTab}
                                    className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-zinc-950 font-black text-xs flex items-center justify-center gap-2 shadow-lg hover:brightness-110 active:scale-95 transition-all cursor-pointer"
                                >
                                    <i className="fas fa-external-link-alt"></i>
                                    <span>Mở Xem Thẻ Mới (Góc {activeAngle?.label})</span>
                                </button>
                                <button 
                                    type="button"
                                    onClick={() => {
                                        setImgErrors(prev => ({ ...prev, [activeAngleKey]: false }));
                                    }}
                                    className="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-zinc-300 font-bold text-xs flex items-center justify-center gap-2 border border-white/10 transition-all cursor-pointer"
                                >
                                    <i className="fas fa-rotate-right"></i>
                                    <span>Thử Lại</span>
                                </button>
                            </div>
                        </div>
                    ) : (
                        <img 
                            src={activeAngle?.url} 
                            alt={`${currentLayout.name} - ${activeAngle?.label}`}
                            onError={() => setImgErrors(prev => ({ ...prev, [activeAngleKey]: true }))}
                            onLoad={() => setImgErrors(prev => ({ ...prev, [activeAngleKey]: false }))}
                            draggable={false}
                            style={{
                                transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`,
                                transformOrigin: 'center center',
                                transition: isDragging ? 'none' : 'transform 0.2s cubic-bezier(0.2, 0, 0.2, 1)'
                            }}
                            className="max-h-full max-w-full object-contain rounded-2xl border border-white/[0.08] shadow-[0_15px_50px_rgba(0,0,0,0.9)] select-none pointer-events-auto"
                            title="Nhấp đúp để phóng to/thu nhỏ nhanh. Giữ chuột/ngón tay kéo để soi mấu nối, rễ, keo."
                        />
                    )}

                    {/* Badge Góc Chụp ở góc dưới bên trái */}
                    <div className="absolute bottom-3 left-3 bg-black/80 backdrop-blur-md border border-white/10 px-3 py-1.5 rounded-xl text-xs text-zinc-200 flex items-center gap-2 shadow-lg pointer-events-none">
                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span className="font-bold text-[#d4af37]">{activeAngle?.label}</span>
                        <span className="text-zinc-500 hidden sm:inline">|</span>
                        <span className="font-mono text-[11px] text-zinc-400 truncate max-w-[160px] sm:max-w-xs hidden sm:inline">{activeAngle?.filename}</span>
                    </div>

                    {/* 🔥 THANH CÔNG CỤ ZOOM ĐA CẤP NỔI (FLOATING ZOOM BAR) */}
                    {!isCurrentBlocked && (
                        <div 
                            className="absolute bottom-3 right-3 flex items-center gap-1.5 bg-black/85 backdrop-blur-md border border-white/15 px-2 py-1.5 rounded-2xl shadow-2xl z-20"
                            onClick={e => e.stopPropagation()}
                        >
                            {/* Nút Zoom Out (-) */}
                            <button 
                                type="button"
                                onClick={handleZoomOut}
                                disabled={zoom <= 1}
                                className={`w-9 h-9 rounded-xl flex items-center justify-center text-sm font-bold transition-all ${
                                    zoom <= 1 
                                        ? 'text-zinc-600 bg-white/[0.02] cursor-not-allowed' 
                                        : 'text-zinc-200 hover:text-white bg-white/10 hover:bg-white/20 active:scale-90 cursor-pointer'
                                }`}
                                title="Thu nhỏ (-)"
                            >
                                <i className="fas fa-minus text-xs"></i>
                            </button>

                            {/* Badge Hiển Thị Mức Zoom Hiện Tại */}
                            <button 
                                type="button"
                                onClick={handleResetZoom}
                                className="px-2.5 h-9 rounded-xl bg-white/[0.06] hover:bg-white/[0.12] text-amber-400 font-mono font-bold text-xs flex items-center justify-center transition-all cursor-pointer min-w-[56px]"
                                title="Bấm để đưa về 100% (1x)"
                            >
                                {Math.round(zoom * 100)}%
                            </button>

                            {/* Nút Zoom In (+) */}
                            <button 
                                type="button"
                                onClick={handleZoomIn}
                                disabled={zoom >= 4}
                                className={`w-9 h-9 rounded-xl flex items-center justify-center text-sm font-bold transition-all ${
                                    zoom >= 4 
                                        ? 'text-zinc-600 bg-white/[0.02] cursor-not-allowed' 
                                        : 'text-zinc-200 hover:text-white bg-white/10 hover:bg-white/20 active:scale-90 cursor-pointer'
                                }`}
                                title="Phóng to (+)"
                            >
                                <i className="fas fa-plus text-xs"></i>
                            </button>

                            {/* Nút Reset 1x nếu đang zoom */}
                            {zoom > 1 && (
                                <button 
                                    type="button"
                                    onClick={handleResetZoom}
                                    className="h-9 px-2.5 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-[11px] font-bold flex items-center gap-1 transition-all cursor-pointer active:scale-90"
                                    title="Đặt lại kích thước gốc"
                                >
                                    <i className="fas fa-rotate-left text-xs"></i>
                                    <span className="hidden sm:inline">1x</span>
                                </button>
                            )}
                        </div>
                    )}

                    {/* Gợi ý kéo rê khi đang phóng to */}
                    {zoom > 1 && (
                        <div className="absolute top-3 inset-x-0 mx-auto w-fit bg-black/80 backdrop-blur-md border border-amber-500/30 px-3.5 py-1 rounded-full text-[11px] text-amber-300 font-medium flex items-center gap-1.5 shadow-xl pointer-events-none animate-pulse">
                            <i className="fas fa-hand-pointer text-xs"></i>
                            <span>Giữ chuột / vuốt ngón tay để kéo rê soi chi tiết</span>
                        </div>
                    )}
                </div>
            </div>

            {/* 3. BOTTOM THUMBNAIL STRIP (5 GÓC CHỤP TRỰC QUAN CHO THỢ) */}
            <div 
                className="pt-2 border-t border-white/[0.08] shrink-0 z-10"
                onClick={e => e.stopPropagation()}
            >
                <div className="flex items-center justify-center gap-2 sm:gap-3 overflow-x-auto py-1 no-scrollbar">
                    {angleKeys.map((key, idx) => {
                        const ang = currentLayout.angles[key];
                        const isSelected = activeAngleKey === key;
                        const isBlockedThumb = !!imgErrors[key];
                        return (
                            <div 
                                key={key}
                                onClick={() => selectAngle(key)}
                                className={`w-16 h-16 sm:w-20 sm:h-20 rounded-xl sm:rounded-2xl overflow-hidden cursor-pointer transition-all relative border-2 ${
                                    isSelected 
                                        ? 'border-[#d4af37] ring-4 ring-[#d4af37]/35 scale-105 shadow-[0_0_20px_rgba(212,175,55,0.45)]' 
                                        : 'border-white/10 opacity-60 hover:opacity-100 hover:border-white/30'
                                }`}
                                title={`Góc ${idx + 1}: ${ang.label}`}
                            >
                                {isBlockedThumb ? (
                                    <div className="w-full h-full flex flex-col items-center justify-center bg-zinc-900/90 text-amber-400 text-center p-1">
                                        <i className={`fas ${ang.icon} text-base mb-1`}></i>
                                        <span className="text-[8px] font-mono text-zinc-400">Góc {key}</span>
                                    </div>
                                ) : (
                                    <img 
                                        src={ang.url} 
                                        alt={ang.label} 
                                        className="w-full h-full object-cover" 
                                        loading="lazy"
                                        onError={() => setImgErrors(prev => ({ ...prev, [key]: true }))}
                                    />
                                )}
                                <div className={`absolute bottom-0 inset-x-0 py-0.5 text-center text-[9px] font-bold uppercase truncate px-1 ${
                                    isSelected ? 'bg-[#d4af37] text-zinc-950 font-black' : 'bg-black/80 text-zinc-300'
                                }`}>
                                    {ang.shortLabel} [{idx + 1}]
                                </div>
                            </div>
                        );
                    })}
                </div>
            </div>

            {/* 4. WEBSITE INTEGRATION DRAWER POPUP */}
            {showWebData && (
                <div 
                    className="fixed inset-x-4 bottom-4 sm:inset-x-auto sm:right-6 sm:bottom-6 sm:w-[480px] bg-[#121215] border border-indigo-500/40 rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.9)] p-4 text-xs z-50 animate-slide-up space-y-3"
                    onClick={e => e.stopPropagation()}
                >
                    <div className="flex items-center justify-between border-b border-white/10 pb-2.5">
                        <div className="flex items-center gap-2">
                            <i className="fas fa-globe text-indigo-400 text-sm"></i>
                            <span className="font-bold text-white uppercase tracking-wider text-[11px]">
                                Đồng Bộ Kho Với Website (5 Góc)
                            </span>
                        </div>
                        <button 
                            onClick={() => setShowWebData(false)}
                            className="text-zinc-400 hover:text-white cursor-pointer w-7 h-7 flex items-center justify-center rounded-lg hover:bg-white/5"
                        >
                            <i className="fas fa-times"></i>
                        </button>
                    </div>

                    <div className="space-y-2 text-zinc-300">
                        <p className="text-[11px] leading-relaxed">
                            Hệ thống tự động đồng bộ 5 góc chụp qua API hoặc File tĩnh để nhúng trực tiếp vào Website bán hàng:
                        </p>
                        
                        {/* Box URL API */}
                        <div className="p-2.5 rounded-xl bg-black/60 border border-white/[0.08] font-mono text-[10.5px] space-y-1.5">
                            <div className="flex items-center justify-between text-zinc-400 text-[9.5px] font-bold uppercase">
                                <span>API Endpoint:</span>
                                <span className="text-emerald-400">ONLINE</span>
                            </div>
                            <div className="text-indigo-300 truncate select-all">
                                {('http:' + '/' + '/127.0.0.1:8000/api/layouts/') + encodeURIComponent(currentLayout.name)}
                            </div>
                        </div>

                        {/* 5 Đường dẫn ảnh Web */}
                        <div className="max-h-36 overflow-y-auto space-y-1 p-2 rounded-xl bg-black/40 border border-white/[0.06] text-[10px] font-mono">
                            {angleKeys.map(k => (
                                <div key={k} className="flex items-center justify-between gap-2 py-0.5 border-b border-white/[0.04]">
                                    <span className="text-[#d4af37] font-bold uppercase shrink-0">{k}:</span>
                                    <span className="text-zinc-400 truncate flex-1">{currentLayout.angles[k].relativePath}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="flex items-center gap-2 pt-1">
                        <button 
                            onClick={handleCopyAll5Links}
                            className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[11px] flex items-center justify-center gap-1.5 transition-all shadow-md cursor-pointer active:scale-95"
                        >
                            <i className="fas fa-copy"></i>
                            <span>Sao Chép JSON 5 Góc</span>
                        </button>
                        <a 
                            href={'http:' + '/' + '/127.0.0.1:8000/api/layouts/export/csv'}
                            download="export_layouts_website_sync.csv"
                            className="py-2.5 px-3 rounded-xl bg-white/[0.06] hover:bg-white/[0.1] text-zinc-200 font-bold text-[11px] flex items-center justify-center gap-1.5 border border-white/10 cursor-pointer"
                        >
                            <i className="fas fa-file-csv text-emerald-400"></i>
                            <span>Tải CSV</span>
                        </a>
                    </div>
                </div>
            )}
        </div>,
        document.body
    );
});

// Đăng ký toàn cục
window.Layout5AngleViewerModal = Layout5AngleViewerModal;
window.openLayout5AngleViewer = function(target) {
    window.dispatchEvent(new CustomEvent('openLayout5Angles', { detail: target }));
};
</script>
