// Helper chuẩn hóa danh sách dụng cụ trạm
function normalizeTools(rawTools, defaultWsUser = '') {
  if (!rawTools) return [];
  let parsed = rawTools;
  if (typeof rawTools === 'string') {
    try {
      parsed = JSON.parse(rawTools);
    } catch(e) {
      parsed = rawTools.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
    }
  }
  if (!Array.isArray(parsed)) return [];
  return parsed.map((item, idx) => {
    if (typeof item === 'string') {
      return {
        id: 'TOOL_' + idx + '_' + Date.now(),
        name: item,
        qty: 1,
        status: 'Tốt',
        user: defaultWsUser || '',
        conditionPct: 100,
        value: 0
      };
    }
    const condVal = (item.conditionPct !== undefined && item.conditionPct !== null && item.conditionPct !== '') ? Number(item.conditionPct) : 100;
    return {
      id: item.id || ('TOOL_' + idx + '_' + Date.now()),
      name: item.name || 'Dụng cụ ' + (idx + 1),
      qty: parseInt(item.qty) || 1,
      status: item.status || 'Tốt',
      user: (item.user || item.assignedUser || defaultWsUser || '').trim(),
      conditionPct: isNaN(condVal) ? 100 : Math.min(100, Math.max(0, condVal)),
      value: Math.max(0, parseInt(item.value) || 0),
      depreciation: item.depreciation || 'Không khấu hao'
    };
  });
}

  const [traceResult, setTraceResult] = React.useState(null);
  const [hasSearched, setHasSearched] = React.useState(false);

  const handleSearchSerial = (queryOverride) => {
    const q = (queryOverride !== undefined ? queryOverride : searchSerialQuery).trim().toLowerCase();
    setHasSearched(true);
    if (!q) {
      setTraceResult(null);
      return;
    }

    // 1. Tìm trong lệnh sản xuất Production (theo id, orderId, name)
    const matchedProd = prodItems.find(p => {
      const pid = String(p.id || '').toLowerCase();
      const oid = String(p.orderId || '').toLowerCase();
      const pname = String(p.name || '').toLowerCase();
      return pid === q || oid === q || pid.includes(q) || oid.includes(q) || pname.includes(q);
    });

    // 2. Tìm đơn hàng tương ứng trong Orders
    const orderIdToFind = matchedProd ? (matchedProd.orderId || matchedProd.id) : q;
    const matchedOrder = orders.find(o => {
      const oid = String(o.id || '').toLowerCase();
      const oCode = String(o.orderCode || '').toLowerCase();
      return oid === orderIdToFind || oCode === orderIdToFind || oCode.includes(q);
    });

    // 3. Tìm thông tin đóng gói trong Packings
    const targetOrderId = matchedOrder ? matchedOrder.id : (matchedProd ? matchedProd.orderId : q);
    const matchedPacking = packings.find(pk => {
      return String(pk.orderId || '').toLowerCase() === String(targetOrderId).toLowerCase() ||
             (matchedOrder && String(pk.orderId || '').toLowerCase() === String(matchedOrder.orderCode || '').toLowerCase());
    });

    if (!matchedProd && !matchedOrder && !matchedPacking) {
      setTraceResult(null);
      return;
    }

    setTraceResult({
      prod: matchedProd,
      order: matchedOrder,
      packing: matchedPacking
    });
  };

    }
    const confirmed = window.confirm(`Bạn có chắc chắn muốn xóa "${stationName || 'trạm này'}" khỏi danh sách phân công trách nhiệm không?\nToàn bộ máy móc thiết bị và thông tin phân công của trạm sẽ bị gỡ bỏ khỏi hệ thống.`);
    if (!confirmed) return;

    // Cập nhật Optimistic UI ngay lập tức
    setDeletedStationIds(prev => {
      const next = [...new Set([...prev, stationId])];
      try { localStorage.setItem('rf_deleted_workstations', JSON.stringify(next)); } catch(e){}
      return next;
    });

    try {
      if (typeof pushData === 'function') {
        await pushData({
          Workspaces: [{
            id: stationId,
            name: stationName,
            status: 'DELETED',
            isDeleted: true
          }],
          deletes: {
            Workspaces: [stationId]
          }

                            className="w-full bg-[#18181b] border border-white/[0.08] rounded px-1 py-1 text-xs text-white text-center font-mono font-bold outline-none focus:border-[#d4af37]"
                          />
                        </div>
                        <div className="col-span-3">
                          <input
                            type="number"
                            min="0"
                            step="10000"
                            value={t.value !== undefined ? t.value : 0}
                            onChange={(e) => handleToolChange(idx, 'value', e.target.value)}
                            placeholder="0"
                            title="Giá tiền / Đơn giá thiết bị (VNĐ)"
                            className="w-full bg-[#18181b] border border-white/[0.08] rounded px-2 py-1 text-xs text-amber-400 font-mono font-bold text-right outline-none focus:border-[#d4af37]"
                          />
                        </div>
                        <div className="col-span-2 flex items-center gap-1">
                          <input
                            type="number"
                            min="0"
                            max="100"
                            value={t.conditionPct !== undefined ? t.conditionPct : 100}
                            onChange={(e) => handleToolChange(idx, 'conditionPct', e.target.value)}
                            className="w-full bg-[#18181b] border border-white/[0.08] rounded px-1 py-1 text-xs text-emerald-400 text-center font-mono font-bold outline-none focus:border-[#d4af37]"
                          />
                          <span className="text-zinc-500 text-xs font-mono">%</span>
                        </div>
                        <div className="col-span-1 text-center">
                          <button
                            type="button"
                            onClick={() => handleRemoveTool(idx)}
                            title="Xóa thiết bị này khỏi trạm"
                            className="w-7 h-7 rounded text-rose-400 hover:bg-rose-500/20 flex items-center justify-center transition-colors cursor-pointer mx-auto"
                          >
                            <i className="fas fa-trash-alt text-xs"></i>
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            {/* Footer hành động */}
            <div className="flex items-center justify-between gap-2 pt-3 border-t border-white/[0.06] shrink-0">
              <div>
                {!stationEditModal.isNew && canManageWorkstations && (
                  <button 
                    type="button"
                    onClick={() => handleDeleteStation(stationEditModal.form.id, stationEditModal.form.name)}
                    className="px-3.5 py-2 rounded-xl text-xs font-bold text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 transition-all cursor-pointer flex items-center gap-1.5 active:scale-95 shadow-xs"
                    title="Xóa toàn bộ khu vực làm việc / trạm này khỏi hệ thống"
                  >
                    <i className="fas fa-trash-alt text-xs"></i>
                    <span>Xóa Trạm Này</span>
                  </button>
                )}
              </div>
              <div className="flex items-center gap-2">
                <button 
                  type="button"
                  onClick={() => setStationEditModal(prev => ({ ...prev, isOpen: false }))} 
                  className="px-4 py-2 rounded-xl text-xs font-bold text-zinc-400 hover:bg-[#27272a] transition-colors cursor-pointer"
                >
                  Hủy
                </button>
                <button 
                  type="button"
                  onClick={handleSaveStationConfig}
                  className="px-5 py-2 rounded-xl text-xs font-black text-black bg-gradient-to-r from-[#d4af37] to-[#f0ca5e] hover:brightness-110 transition-all cursor-pointer shadow-md active:scale-95 flex items-center gap-1.5"
                >
                  <i className="fas fa-check"></i>
                  <span>Lưu Cấu Hình & Phân Công</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

    </div>
  );
});

window.WorkspaceTab = WorkspaceTab;
window.WorkspacesTab = WorkspaceTab;
</script>
