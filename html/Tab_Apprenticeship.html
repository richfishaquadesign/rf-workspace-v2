,"distant":"https://lh3.googleusercontent.com/d/17dgcJRh6rlN3uuYvEom-aF-43Ig370EV=w1600","left":"https://lh3.googleusercontent.com/d/1sFpYegTS-WI6tM8kPFUklVwg7wnVgZFA=w1600","right":"https://lh3.googleusercontent.com/d/11UHsVleAdqaTUjOV99Po6AUFxhQnpBby=w1600","top":"https://lh3.googleusercontent.com/d/1rjaEu9rqJFVkSoirtBaLMlSmLVZDP1pn=w1600"}},{"n":"Bonsai ver.1","a":{"front":"https://lh3.googleusercontent.com/d/19y4KrfUuddU8DRz_JBvBJhQB9TxyK1-l=w1600","distant":"https://lh3.googleusercontent.com/d/18Nw-p-_c_CA8A_IY9yHCjGupqHoV_S-k=w1600","left":"https://lh3.googleusercontent.com/d/1YzAk1dgkRUrhITv_WmNQwvUXmLPVFvTz=w1600","right":"https://lh3.googleusercontent.com/d/19y4KrfUuddU8DRz_JBvBJhQB9TxyK1-l=w1600","top":"https://lh3.googleusercontent.com/d/16n5DY76ex_O81pP5o2Yw-siPnxzpylal=w1600"}}];
function RFVisualTrainingEngine({
  order,
  activeImageIndex,
  setActiveImageIndex,
  onSaveAnnotations,
  currentUser,
  canEdit = true,
  erpProducts = [],
  onDeleteOrder,
  onOpenLayoutPicker
}) {
  const currentImage = order?.images?.[activeImageIndex] || order?.images?.[0];
  const [annotations, setAnnotations] = React.useState(currentImage?.annotations || []);
  const [activeTool, setActiveTool] = React.useState('select'); // select, freehand, arrow, dimension, material_pin, step_marker, text_note, rework_box
  const [activeLayer, setActiveLayer] = React.useState({
    dimensions: true,
    materials: true,
    guides: true,
    rework: true,
    notes: true
  });
  const [history, setHistory] = React.useState([currentImage?.annotations || []]);
  const [historyIndex, setHistoryIndex] = React.useState(0);

  // Trạng thái vẽ hiện tại
  const [isDrawing, setIsDrawing] = React.useState(false);
  const [drawingPoints, setDrawingPoints] = React.useState([]);
  const [startPoint, setStartPoint] = React.useState(null);
  const [selectedAnnotationId, setSelectedAnnotationId] = React.useState(null);

  // Modal ghim vật tư & ghi chú
  const [pinModalData, setPinModalData] = React.useState(null);
  const [dimModalData, setDimModalData] = React.useState(null);
  const [textModalData, setTextModalData] = React.useState(null);

  // Zoom & Pan
  const [zoomScale, setZoomScale] = React.useState(1.0);
  const [panOffset, setPanOffset] = React.useState({ x: 0, y: 0 });
  const [isPanning, setIsPanning] = React.useState(false);
  const [panStart, setPanStart] = React.useState({ x: 0, y: 0 });

  const containerRef = React.useRef(null);
  const imgRef = React.useRef(null);

  // Cập nhật annotations khi đổi ảnh
  React.useEffect(() => {
    const list = currentImage?.annotations || [];
    setAnnotations(list);
    setHistory([list]);
    setHistoryIndex(0);
    setSelectedAnnotationId(null);
    setZoomScale(1.0);
    setPanOffset({ x: 0, y: 0 });
  }, [currentImage?.id]);

  // Push history
  const pushHistory = (newAnnotations) => {
    const sliced = history.slice(0, historyIndex + 1);
    setHistory([...sliced, newAnnotations]);
    setHistoryIndex(sliced.length);
    setAnnotations(newAnnotations);
    if (onSaveAnnotations && currentImage) {
      onSaveAnnotations(currentImage.id, newAnnotations);
    }
  };

  const handleUndo = () => {
    if (historyIndex > 0) {
      const prev = history[historyIndex - 1];
      setHistoryIndex(historyIndex - 1);
      setAnnotations(prev);
      if (onSaveAnnotations && currentImage) onSaveAnnotations(currentImage.id, prev);
    }
  };

  const handleRedo = () => {
    if (historyIndex < history.length - 1) {
      const next = history[historyIndex + 1];
      setHistoryIndex(historyIndex + 1);
      setAnnotations(next);
      if (onSaveAnnotations && currentImage) onSaveAnnotations(currentImage.id, next);
    }
  };

  // Quy đổi tọa độ chuột/cảm ứng sang hệ tọa độ tương đối Normalized (0 - 1000)
  const getNormalizedCoords = (e) => {
    if (!imgRef.current) return { x: 500, y: 500 };
    const rect = imgRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const relX = (clientX - rect.left) / rect.width;
    const relY = (clientY - rect.top) / rect.height;
    return {
      x: Math.max(0, Math.min(1000, Math.round(relX * 1000))),
      y: Math.max(0, Math.min(1000, Math.round(relY * 1000)))
    };
  };

  // Xử lý sự kiện bắt đầu tương tác chuột / cảm ứng
  const handlePointerDown = (e) => {
    if (activeTool === 'pan') {
      setIsPanning(true);
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      setPanStart({ x: clientX - panOffset.x, y: clientY - panOffset.y });
      return;
    }

    if (!canEdit) return;
    const pt = getNormalizedCoords(e);

    if (activeTool === 'select') {
      // Tìm xem có click trúng annotation nào không
      return;
    }

    if (activeTool === 'freehand') {
      setIsDrawing(true);
      setDrawingPoints([pt]);
    } else if (activeTool === 'arrow' || activeTool === 'dimension' || activeTool === 'rework_box') {
      setIsDrawing(true);
      setStartPoint(pt);
      setDrawingPoints([pt]);
    } else if (activeTool === 'material_pin') {
      setPinModalData({ x: pt.x, y: pt.y });
    } else if (activeTool === 'step_marker') {
      // Đếm số step hiện có
      const currentSteps = annotations.filter(a => a.type === 'step_marker').length;
      const newStep = {
        id: 'ann_step_' + Date.now(),
        imageId: currentImage?.id,
        type: 'step_marker',
        layer: 'guides',
        geometry: { x: pt.x, y: pt.y },
        metadata: { stepNumber: currentSteps + 1, stepTitle: `Khâu ${currentSteps + 1}` },
        createdBy: currentUser || 'Admin',
        createdAt: new Date().toISOString()
      };
      pushHistory([...annotations, newStep]);
    } else if (activeTool === 'text_note') {
      setTextModalData({ x: pt.x, y: pt.y });
    }
  };

  const handlePointerMove = (e) => {
    if (isPanning) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      setPanOffset({ x: clientX - panStart.x, y: clientY - panStart.y });
      return;
    }

    if (!isDrawing) return;
    const pt = getNormalizedCoords(e);
    if (activeTool === 'freehand') {
      setDrawingPoints(prev => [...prev, pt]);
    } else if (activeTool === 'arrow' || activeTool === 'dimension' || activeTool === 'rework_box') {
      setDrawingPoints([startPoint, pt]);
    }
  };

  const handlePointerUp = () => {
    if (isPanning) {
      setIsPanning(false);
      return;
    }

    if (!isDrawing) return;
    setIsDrawing(false);

    if (activeTool === 'freehand' && drawingPoints.length > 2) {
      const newAnn = {
        id: 'ann_fh_' + Date.now(),
        imageId: currentImage?.id,
        type: 'freehand',
        layer: 'guides',
        geometry: { points: drawingPoints },
        metadata: { color: '#f59e0b', strokeWidth: 3 },
        createdBy: currentUser || 'Admin',
        createdAt: new Date().toISOString()
      };
      pushHistory([...annotations, newAnn]);
    } else if (activeTool === 'arrow' && startPoint && drawingPoints.length > 1) {
      const endPt = drawingPoints[1];
      const newAnn = {
        id: 'ann_arr_' + Date.now(),
        imageId: currentImage?.id,
        type: 'arrow',
        layer: 'guides',
        geometry: { x1: startPoint.x, y1: startPoint.y, x2: endPt.x, y2: endPt.y },
        metadata: { text: 'Hướng liên kết / gia cố', color: '#10b981' },
        createdBy: currentUser || 'Admin',
        createdAt: new Date().toISOString()
      };
      pushHistory([...annotations, newAnn]);
    } else if (activeTool === 'dimension' && startPoint && drawingPoints.length > 1) {
      const endPt = drawingPoints[1];
      // Mở modal nhập kích thước
      setDimModalData({ x1: startPoint.x, y1: startPoint.y, x2: endPt.x, y2: endPt.y });
    } else if (activeTool === 'rework_box' && startPoint && drawingPoints.length > 1) {
      const endPt = drawingPoints[1];
      const newAnn = {
        id: 'ann_rw_' + Date.now(),
        imageId: currentImage?.id,
        type: 'rework_box',
        layer: 'rework',
        geometry: {
          x: Math.min(startPoint.x, endPt.x),
          y: Math.min(startPoint.y, endPt.y),
          width: Math.abs(endPt.x - startPoint.x),
          height: Math.abs(endPt.y - startPoint.y)
        },
        metadata: { text: 'Khu vực cần sửa lỗi / kiểm tra lại', severity: 'HIGH', resolved: false },
        createdBy: currentUser || 'Admin',
        createdAt: new Date().toISOString()
      };
      pushHistory([...annotations, newAnn]);
    }

    setDrawingPoints([]);
    setStartPoint(null);
  };

  const handleDeleteAnnotation = (id) => {
    pushHistory(annotations.filter(a => a.id !== id));
    setSelectedAnnotationId(null);
  };

  return (
    <div className="flex flex-col h-full bg-[#0B0B0B] text-zinc-100 rounded-xl border border-zinc-800 overflow-hidden select-none">
      {/* 1. THANH ĐIỀU HƯỚNG GÓC CHỤP & THAO TÁC TRÊN */}
      <div className="flex flex-wrap items-center justify-between px-3 py-2 bg-[#141414] border-b border-zinc-800 gap-2 text-xs">
        {/* Nút chọn góc ảnh */}
        <div className="flex items-center gap-1.5 overflow-x-auto custom-scrollbar py-0.5">
          <span className="text-zinc-500 font-bold uppercase tracking-wider text-[10px] mr-1 hidden sm:inline">Góc ảnh:</span>
          {(order?.images || []).map((img, idx) => {
            const isAct = idx === activeImageIndex;
            const annCount = img.annotations?.length || 0;
            return (
              <button
                key={img.id || idx}
                type="button"
                onClick={() => setActiveImageIndex(idx)}
                className={`px-2.5 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1.5 transition-all whitespace-nowrap ${
                  isAct
                    ? 'bg-zinc-100 text-zinc-900 shadow-md font-black'
                    : 'bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 border border-zinc-800'
                }`}
              >
                <i className={`fas ${
                  img.angle === 'front' ? 'fa-square' :
                  img.angle === 'overview' ? 'fa-cubes' :
                  img.angle === 'left' ? 'fa-arrow-left' :
                  img.angle === 'right' ? 'fa-arrow-right' : 'fa-arrow-up'
                } text-[10px]`}></i>
                <span>{img.label}</span>
                {annCount > 0 && (
                  <span className={`px-1.5 py-0.2 rounded-full text-[9px] font-black ${
                    isAct ? 'bg-zinc-900 text-zinc-100' : 'bg-zinc-800 text-zinc-300'
                  }`}>
                    {annCount}
                  </span>
                )}
              </button>
            );
          })}
        </div>

        {/* Nút Zoom & Layer Visibility */}
        <div className="flex items-center gap-1.5">
          {/* NÚT CHỌN/ĐỔI LAYOUT MẪU VÀ XÓA LỆNH */}
          {onOpenLayoutPicker && canEdit && (
            <button
              type="button"
              onClick={onOpenLayoutPicker}
              className="px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 font-bold text-xs flex items-center gap-1.5 border border-amber-500/40 transition-all cursor-pointer shadow-sm active:scale-95 whitespace-nowrap"
              title="Chọn ảnh layout khác từ kho 91 layout chuẩn xưởng"
            >
              <i className="fas fa-images"></i>
              <span>Đổi Layout Mẫu</span>
            </button>
          )}

          {onDeleteOrder && canEdit && (
            <button
              type="button"
              onClick={onDeleteOrder}
              className="px-2.5 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-bold text-xs flex items-center gap-1 border border-rose-500/30 transition-all cursor-pointer active:scale-95 whitespace-nowrap"
              title="Xóa lệnh học việc này"
            >
              <i className="fas fa-trash-alt"></i>
              <span>Xóa Lệnh</span>
            </button>
          )}

          {/* Zoom controls */}
          <div className="flex items-center bg-zinc-900 rounded-lg border border-zinc-800 p-0.5">
            <button
              type="button"
              onClick={() => setZoomScale(z => Math.max(0.6, Number((z - 0.2).toFixed(1))))}
              className="w-6 h-6 flex items-center justify-center hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 rounded"
              title="Thu nhỏ"
            >
              <i className="fas fa-minus text-[10px]"></i>
            </button>
            <span className="px-2 text-[10px] font-mono font-bold text-zinc-300">
              {Math.round(zoomScale * 100)}%
            </span>
            <button
              type="button"
              onClick={() => setZoomScale(z => Math.min(2.5, Number((z + 0.2).toFixed(1))))}
              className="w-6 h-6 flex items-center justify-center hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 rounded"
              title="Phóng to"
            >
              <i className="fas fa-plus text-[10px]"></i>
            </button>
            <button
              type="button"
              onClick={() => { setZoomScale(1.0); setPanOffset({ x: 0, y: 0 }); }}
              className="w-6 h-6 flex items-center justify-center hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 rounded ml-0.5"
              title="Khôi phục 100%"
            >
              <i className="fas fa-expand text-[10px]"></i>
            </button>
          </div>

          {/* Undo / Redo */}
          {canEdit && (
            <div className="flex items-center bg-zinc-900 rounded-lg border border-zinc-800 p-0.5">
              <button
                type="button"
                disabled={historyIndex <= 0}
                onClick={handleUndo}
                className="w-6 h-6 flex items-center justify-center hover:bg-zinc-800 disabled:opacity-30 disabled:hover:bg-transparent text-zinc-300 rounded"
                title="Hoàn tác (Undo)"
              >
                <i className="fas fa-undo text-[10px]"></i>
              </button>
              <button
                type="button"
                disabled={historyIndex >= history.length - 1}
                onClick={handleRedo}
                className="w-6 h-6 flex items-center justify-center hover:bg-zinc-800 disabled:opacity-30 disabled:hover:bg-transparent text-zinc-300 rounded"
                title="Làm lại (Redo)"
              >
                <i className="fas fa-redo text-[10px]"></i>
              </button>
            </div>
          )}
        </div>
      </div>

      {/* 2. KHÔNG GIAN BÀN VẼ CHÍNH: TOOLBAR TRÁI + CANVAS TRUNG TÂM + SIDEBAR THÔNG TIN PHẢI */}
      <div className="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        {/* TOOLBAR TRÁI (12 CÔNG CỤ CHUYÊN SÂU) */}
        {canEdit && (
          <div className="flex md:flex-col items-center justify-start gap-1 p-2 bg-[#101010] border-b md:border-b-0 md:border-r border-zinc-800 overflow-x-auto md:overflow-y-auto custom-scrollbar z-10 shrink-0">
            <span className="text-[9px] uppercase tracking-wider text-zinc-500 font-bold hidden md:block mb-1">Công cụ</span>

            {[
              { id: 'select', label: 'Chọn', icon: 'fa-mouse-pointer', title: 'Chọn & Xem chi tiết đối tượng' },
              { id: 'pan', label: 'Kéo ảnh', icon: 'fa-hand', title: 'Kéo di chuyển góc nhìn' },
              { id: 'dimension', label: 'Kích thước', icon: 'fa-ruler-combined', title: 'Đo khoảng cách Dài x Rộng x Cao' },
              { id: 'material_pin', label: 'Ghim vật tư', icon: 'fa-map-pin', title: 'Ghim vị trí SKU vật tư thực tế' },
              { id: 'step_marker', label: 'Đánh số khâu', icon: 'fa-list-ol', title: 'Đánh số thứ tự các bước thi công' },
              { id: 'arrow', label: 'Mũi tên', icon: 'fa-location-arrow', title: 'Mũi tên chỉ hướng lắp ghép / viễn cảnh' },
              { id: 'freehand', label: 'Vẽ tự do', icon: 'fa-pencil-alt', title: 'Vẽ phát thảo đường cong, gân đá' },
              { id: 'rework_box', label: 'Lỗi KCS', icon: 'fa-exclamation-triangle', title: 'Khoanh vùng lỗi cần sửa lại' },
              { id: 'text_note', label: 'Ghi chú', icon: 'fa-comment-alt', title: 'Thêm chú thích kỹ thuật' }
            ].map(tool => {
              const isActive = activeTool === tool.id;
              return (
                <button
                  key={tool.id}
                  type="button"
                  title={tool.title}
                  onClick={() => setActiveTool(tool.id)}
                  className={`w-9 h-9 md:w-10 md:h-10 rounded-xl flex flex-col items-center justify-center transition-all shrink-0 ${
                    isActive
                      ? 'bg-zinc-100 text-zinc-900 font-black shadow-lg scale-105'
                      : 'bg-zinc-900/80 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 border border-zinc-800'
                  }`}
                >
                  <i className={`fas ${tool.icon} text-xs md:text-sm`}></i>
                  <span className="text-[8px] font-bold mt-0.5 hidden md:block">{tool.label}</span>
                </button>
              );
            })}

            <div className="w-full h-[1px] bg-zinc-800 my-1 hidden md:block"></div>

            {/* Bật tắt Layer */}
            <span className="text-[9px] uppercase tracking-wider text-zinc-500 font-bold hidden md:block mb-1">Lớp</span>
            <button
              type="button"
              onClick={() => setActiveLayer(l => ({ ...l, dimensions: !l.dimensions }))}
              title="Bật/Tắt Lớp Đo Kích Thước"
              className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-colors ${
                activeLayer.dimensions ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-zinc-900 text-zinc-600'
              }`}
            >
              <i className="fas fa-ruler"></i>
            </button>
            <button
              type="button"
              onClick={() => setActiveLayer(l => ({ ...l, materials: !l.materials }))}
              title="Bật/Tắt Lớp Ghim Vật Tư"
              className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-colors ${
                activeLayer.materials ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-zinc-900 text-zinc-600'
              }`}
            >
              <i className="fas fa-boxes"></i>
            </button>
            <button
              type="button"
              onClick={() => setActiveLayer(l => ({ ...l, rework: !l.rework }))}
              title="Bật/Tắt Lớp Lỗi KCS"
              className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-colors ${
                activeLayer.rework ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40' : 'bg-zinc-900 text-zinc-600'
              }`}
            >
              <i className="fas fa-bug"></i>
            </button>
          </div>
        )}

        {/* CANVAS & SVG OVERLAY KHUNG NHÌN KỸ THUẬT */}
        <div
          ref={containerRef}
          className="flex-1 bg-[#09090b] overflow-hidden flex items-center justify-center p-2 relative touch-none select-none"
          onMouseDown={handlePointerDown}
          onMouseMove={handlePointerMove}
          onMouseUp={handlePointerUp}
          onTouchStart={handlePointerDown}
          onTouchMove={handlePointerMove}
          onTouchEnd={handlePointerUp}
        >
          {/* Vùng ảnh và SVG có thể zoom / pan */}
          <div
            className="relative inline-block transition-transform duration-75 origin-center max-w-full max-h-full shadow-2xl rounded-lg overflow-hidden border border-zinc-800"
            style={{
              transform: `scale(${zoomScale}) translate(${panOffset.x / zoomScale}px, ${panOffset.y / zoomScale}px)`,
              cursor: activeTool === 'pan' ? (isPanning ? 'grabbing' : 'grab') : activeTool === 'select' ? 'default' : 'crosshair'
            }}
          >
            {/* Ảnh gốc kỹ thuật */}
            <img
              ref={imgRef}
              src={currentImage?.url}
              alt={currentImage?.label || 'Ảnh kỹ thuật'}
              className="block max-w-[85vw] max-h-[68vh] md:max-h-[75vh] object-contain pointer-events-none"
              crossOrigin="anonymous"
              draggable="false"
            />

            {/* SVG OVERLAY PHỦ TRÊN ẢNH: viewBox 0 0 1000 1000 để chuẩn hóa tọa độ tương đối */}
            <svg
              className="absolute inset-0 w-full h-full pointer-events-none"
              viewBox="0 0 1000 1000"
              preserveAspectRatio="none"
            >
              <defs>
                {/* Đầu mũi tên */}
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                  <polygon points="0 0, 10 3.5, 0 7" fill="#10b981" />
                </marker>
                <marker id="arrowhead-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                  <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
                </marker>
              </defs>

              {/* 1. LỚP ĐO KÍCH THƯỚC (DIMENSIONS) */}
              {activeLayer.dimensions && annotations.filter(a => a.type === 'dimension').map(ann => {
                const g = ann.geometry;
                const isSel = selectedAnnotationId === ann.id;
                const midX = (g.x1 + g.x2) / 2;
                const midY = (g.y1 + g.y2) / 2;
                return (
                  <g key={ann.id} className="pointer-events-auto cursor-pointer" onClick={() => setSelectedAnnotationId(ann.id)}>
                    {/* Đường gióng phụ */}
                    <line x1={g.x1} y1={g.y1} x2={g.x2} y2={g.y2} stroke="#f59e0b" strokeWidth={isSel ? "4" : "2.5"} strokeDasharray="6,3" />
                    {/* 2 đầu mút */}
                    <circle cx={g.x1} cy={g.y1} r="5" fill="#f59e0b" />
                    <circle cx={g.x2} cy={g.y2} r="5" fill="#f59e0b" />
                    {/* Nhãn số đo */}
                    <rect x={midX - 45} y={midY - 14} width="90" height="24" rx="5" fill="#18181b" stroke="#f59e0b" strokeWidth="1.5" />
                    <text x={midX} y={midY + 3} textAnchor="middle" fill="#fbbf24" fontSize="13" fontWeight="900" fontFamily="monospace">
                      {ann.metadata?.dimensionValue} {ann.metadata?.dimensionUnit || 'cm'}
                    </text>
                  </g>
                );
              })}

              {/* 2. LỚP VẼ MŨI TÊN (ARROWS) */}
              {activeLayer.guides && annotations.filter(a => a.type === 'arrow').map(ann => {
                const g = ann.geometry;
                const isSel = selectedAnnotationId === ann.id;
                return (
                  <g key={ann.id} className="pointer-events-auto cursor-pointer" onClick={() => setSelectedAnnotationId(ann.id)}>
                    <line x1={g.x1} y1={g.y1} x2={g.x2} y2={g.y2} stroke="#10b981" strokeWidth={isSel ? "5" : "3"} markerEnd="url(#arrowhead)" />
                    {ann.metadata?.text && (
                      <text x={(g.x1 + g.x2) / 2} y={(g.y1 + g.y2) / 2 - 8} textAnchor="middle" fill="#34d399" fontSize="12" fontWeight="bold" stroke="#000" strokeWidth="3" paintOrder="stroke">
                        {ann.metadata.text}
                      </text>
                    )}
                  </g>
                );
              })}

              {/* 3. LỚP VẼ TỰ DO (FREEHAND) */}
              {activeLayer.guides && annotations.filter(a => a.type === 'freehand').map(ann => {
                const pts = ann.geometry?.points || [];
                if (pts.length < 2) return null;
                const dStr = pts.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '');
                return (
                  <path
                    key={ann.id}
                    d={dStr}
                    fill="none"
                    stroke={ann.metadata?.color || "#f59e0b"}
                    strokeWidth={ann.metadata?.strokeWidth || 3}
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className="pointer-events-auto cursor-pointer"
                    onClick={() => setSelectedAnnotationId(ann.id)}
                  />
                );
              })}

              {/* 4. LỚP KHOANH VÙNG LỖI KCS (REWORK BOX) */}
              {activeLayer.rework && annotations.filter(a => a.type === 'rework_box').map(ann => {
                const g = ann.geometry;
                const isSel = selectedAnnotationId === ann.id;
                return (
                  <g key={ann.id} className="pointer-events-auto cursor-pointer" onClick={() => setSelectedAnnotationId(ann.id)}>
                    <rect
                      x={g.x}
                      y={g.y}
                      width={g.width}
                      height={g.height}
                      fill="rgba(244, 63, 94, 0.15)"
                      stroke="#f43f5e"
                      strokeWidth={isSel ? "4" : "2.5"}
                      strokeDasharray="8,4"
                      rx="6"
                    />
                    <rect x={g.x} y={g.y - 18} width="80" height="18" rx="4" fill="#f43f5e" />
                    <text x={g.x + 6} y={g.y - 5} fill="#ffffff" fontSize="10" fontWeight="900">
                      LỖI KCS
                    </text>
                  </g>
                );
              })}

              {/* ĐƯỜNG VẼ TRỰC TIẾP KHI ĐANG KÉO CHUỘT */}
              {isDrawing && drawingPoints.length > 1 && (
                activeTool === 'freehand' ? (
                  <path
                    d={drawingPoints.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '')}
                    fill="none"
                    stroke="#f59e0b"
                    strokeWidth="3"
                    strokeLinecap="round"
                  />
                ) : activeTool === 'arrow' || activeTool === 'dimension' ? (
                  <line
                    x1={drawingPoints[0].x}
                    y1={drawingPoints[0].y}
                    x2={drawingPoints[1].x}
                    y2={drawingPoints[1].y}
                    stroke={activeTool === 'arrow' ? "#10b981" : "#f59e0b"}
                    strokeWidth="3"
                    strokeDasharray={activeTool === 'dimension' ? "6,3" : "none"}
                  />
                ) : activeTool === 'rework_box' ? (
                  <rect
                    x={Math.min(drawingPoints[0].x, drawingPoints[1].x)}
                    y={Math.min(drawingPoints[0].y, drawingPoints[1].y)}
                    width={Math.abs(drawingPoints[1].x - drawingPoints[0].x)}
                    height={Math.abs(drawingPoints[1].y - drawingPoints[0].y)}
                    fill="rgba(244, 63, 94, 0.2)"
                    stroke="#f43f5e"
                    strokeWidth="2"
                    strokeDasharray="6,3"
                  />
                ) : null
              )}
            </svg>

            {/* 5. CÁC ĐỐI TƯỢNG DOM GHIM NẰM TRÊN ẢNH (MATERIAL PIN & STEP MARKER) */}
            {activeLayer.materials && annotations.filter(a => a.type === 'material_pin').map(ann => {
              const g = ann.geometry;
              const isSel = selectedAnnotationId === ann.id;
              return (
                <div
                  key={ann.id}
                  onClick={(e) => { e.stopPropagation(); setSelectedAnnotationId(ann.id); }}
                  className="absolute -translate-x-1/2 -translate-y-full cursor-pointer z-20 group"
                  style={{ left: `${g.x / 10}%`, top: `${g.y / 10}%` }}
                >
                  <div className={`flex items-center gap-1 px-2 py-0.5 rounded-full border text-[10px] font-bold shadow-xl transition-transform ${
                    isSel ? 'bg-emerald-400 text-zinc-950 border-white scale-110' : 'bg-zinc-900/90 text-emerald-300 border-emerald-500/60 hover:scale-105'
                  }`}>
                    <i className="fas fa-boxes text-[9px]"></i>
                    <span className="whitespace-nowrap">{ann.metadata?.materialSku || ann.metadata?.materialName}</span>
                    <span className="bg-emerald-950/80 text-emerald-200 px-1 rounded text-[9px] font-mono">
                      {ann.metadata?.materialQty}{ann.metadata?.materialUnit}
                    </span>
                  </div>
                  {/* Chóp ghim nhọn */}
                  <div className="w-0 h-0 border-l-[5px] border-l-transparent border-r-[5px] border-r-transparent border-t-[6px] border-t-emerald-500 mx-auto"></div>
                </div>
              );
            })}

            {/* ĐÁNH SỐ THỨ TỰ (STEP MARKER) */}
            {activeLayer.guides && annotations.filter(a => a.type === 'step_marker').map(ann => {
              const g = ann.geometry;
              const isSel = selectedAnnotationId === ann.id;
              return (
                <div
                  key={ann.id}
                  onClick={(e) => { e.stopPropagation(); setSelectedAnnotationId(ann.id); }}
                  className="absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer z-20"
                  style={{ left: `${g.x / 10}%`, top: `${g.y / 10}%` }}
                >
                  <div className={`w-7 h-7 rounded-full flex items-center justify-center font-black text-xs shadow-lg transition-transform ${
                    isSel ? 'bg-amber-400 text-zinc-950 ring-2 ring-white scale-125' : 'bg-amber-500 text-zinc-950 hover:scale-110'
                  }`}>
                    {ann.metadata?.stepNumber || 1}
                  </div>
                </div>
              );
            })}

            {/* GHI CHÚ KỸ THUẬT (TEXT NOTE) */}
            {activeLayer.notes && annotations.filter(a => a.type === 'text_note').map(ann => {
              const g = ann.geometry;
              const isSel = selectedAnnotationId === ann.id;
              return (
                <div
                  key={ann.id}
                  onClick={(e) => { e.stopPropagation(); setSelectedAnnotationId(ann.id); }}
                  className="absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer z-20 max-w-[180px]"
                  style={{ left: `${g.x / 10}%`, top: `${g.y / 10}%` }}
                >
                  <div className={`p-1.5 rounded-lg border text-[10px] leading-tight shadow-xl backdrop-blur-md ${
                    isSel ? 'bg-zinc-100 text-zinc-900 border-white' : 'bg-zinc-900/90 text-zinc-200 border-zinc-700'
                  }`}>
                    <i className="fas fa-sticky-note text-amber-400 mr-1"></i>
                    <span>{ann.metadata?.text}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* BẢNG THÔNG TIN CHI TIẾT ĐỐI TƯỢNG ĐƯỢC CHỌN (SIDEBAR PHẢI) */}
        {selectedAnnotationId && (() => {
          const item = annotations.find(a => a.id === selectedAnnotationId);
          if (!item) return null;
          return (
            <div className="w-full md:w-64 bg-[#141414] border-t md:border-t-0 md:border-l border-zinc-800 p-3 shrink-0 flex flex-col justify-between text-xs z-10">
              <div>
                <div className="flex items-center justify-between pb-2 border-b border-zinc-800 mb-2">
                  <div className="font-black text-zinc-100 uppercase tracking-wider text-[11px] flex items-center gap-1.5">
                    <i className="fas fa-info-circle text-amber-400"></i>
                    <span>Chi tiết đối tượng</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => setSelectedAnnotationId(null)}
                    className="w-5 h-5 flex items-center justify-center text-zinc-400 hover:text-white"
                  >

dth:40px}.rf-apprentice .layout-thumbs{gap:var(--space-1)}.rf-apprentice figcaption{font-size:9px;padding:var(--space-2) 0}.rf-apprentice .canvas-empty{min-height:280px;padding:var(--space-6)}.rf-apprentice input,.rf-apprentice select,.rf-apprentice textarea{font-size:16px}.rf-apprentice .engine form input,.rf-apprentice .engine form select{font-size:16px}}

`}</style>
    <header className="titlebar">
      <div><span className="eyebrow">RF / TRAINING ATELIER</span><h1>{state.studio ? 'Xưởng đào tạo' : 'Bàn thực hành của bạn'}</h1><p>{state.studio ? 'Chuẩn hóa bài mẫu. Dẫn dắt thực hành. Nghiệm thu tay nghề.' : 'Đọc mẫu chuẩn, thực hiện từng công đoạn và ghi lại kết quả.'}</p></div>
      <div className="actions"><button className="quiet-button" disabled={busy} onClick={() => load(false)} aria-label="Tải lại">↻ <span>Làm mới</span></button>{state.studio && <button className="primary" aria-label="Tạo / giao bài" disabled={busy || !loaded} onClick={openComposer}>+ Giao bài mới</button>}</div>
    </header>
    <div className="navline"><nav className="view-tabs" aria-label="Không gian đào tạo">
      <button role="tab" aria-selected={!formOpen && queueFilter==='all'} onClick={()=>{setFormOpen(false);setLessonOpen(false);setQueueFilter('all');}}>{state.studio?'Lệnh thực hành':'Việc được giao'}</button>
      {state.studio && <button role="tab" aria-selected={formOpen} onClick={openComposer}>Soạn bài mẫu</button>}
      {state.studio && <button role="tab" aria-selected={!formOpen && queueFilter==='review'} onClick={()=>{setFormOpen(false);setLessonOpen(false);setQueueFilter('review');}}>Nghiệm thu {reviewCount>0 && <span className="mono">{reviewCount}</span>}</button>}
    </nav><span className="role-label">{loaded ? (state.studio?'Admin Studio':'Worker Mode')+' · '+state.user : 'Đang xác thực'}</span></div>
    {!loaded && <div className="notice" role="status">Đang xác thực và tải bài thực hành từ máy chủ…</div>}
    {error && <div className="notice" role="alert"><span>!</span><p>{error}</p></div>}
    {loaded && !formOpen && <div className="data-strip" aria-label="Tình hình thực hành"><div><strong>{workingCount.toString().padStart(2,'0')}</strong><span>Đang thực hành</span></div><div><strong>{reviewCount.toString().padStart(2,'0')}</strong><span>Chờ nghiệm thu</span></div><div><strong>{acceptedCount.toString().padStart(2,'0')}</strong><span>Đã hoàn tất</span></div></div>}

    {state.studio && formOpen && <div className="compose-layout">
      <aside className="compose-settings"><form id="rf-assignment-form" onSubmit={async e=>{e.preventDefault();if(!canAssign)return;if(await mutate('create',{assignee:form.assignee,layout:form.layout,productKey:form.productKey,images:templateImages,checklists:checklistBlocks},null)){setFormOpen(false);setQueueFilter('all');}}}>
        <div className="layout-picker"><span className="eyebrow">01 / BÀI MẪU</span><h2>Chọn mẫu thực hành</h2><p className="muted">{RICH_FISH_LAYOUT_CATALOG.length} mẫu · 5 góc ảnh mỗi mẫu</p><input aria-label="Tìm layout mẫu" placeholder="Tìm Rừng, Đảo Bay, Bonsai…" value={layoutQuery} onChange={e=>setLayoutQuery(e.target.value)}/><label>Layout mẫu<select required disabled={busy} value={form.layout} onChange={e=>selectTemplate(e.target.value)}><option value="">Chọn layout mẫu</option>{RICH_FISH_LAYOUT_CATALOG.filter(x=>x.n.toLocaleLowerCase('vi').includes(layoutQuery.toLocaleLowerCase('vi')) || x.n===form.layout).map(x=><option key={x.n}>{x.n}</option>)}</select></label></div>
        <div className="section-block"><span className="eyebrow">02 / NGƯỜI THỰC HIỆN</span><label>Giao cho<select required disabled={busy} value={form.assignee} onChange={e=>setForm({...form,assignee:e.target.value})}><option value="">Chọn nhân viên</option>{people.map(p=><option key={p}>{p}</option>)}</select></label><p className="muted" style={{marginTop:'var(--space-3)'}}>Nhân viên tự hoàn thành 5 bước. Admin nghiệm thu sau báo cáo cuối.</p></div>
        <div className="section-block"><span className="eyebrow">03 / ĐỊNH MỨC TỰ ĐỘNG</span>{resolvingBom ? <p className="muted" role="status">Đang lấy BOM của mẫu…</p> : resolvedBom.selected ? <React.Fragment><h3>{resolvedBom.selected.name}</h3><table className="bom-table"><tbody>{resolvedBom.selected.materials.map((m,i)=><tr key={i}><td>{m.name}</td><td>{m.qty} {m.unit}</td></tr>)}</tbody></table><p className="muted">Định mức từ {resolvedBom.selected.source}. Không trừ kho khi giao bài.</p></React.Fragment> : <p className="muted">{form.layout?'Mẫu này chưa có định mức hợp lệ.':'BOM sẽ tự xuất hiện khi chọn mẫu.'}</p>}</div>
      </form><button className="quiet-button" onClick={()=>setFormOpen(false)}>← Về danh sách</button></aside>
      <div className="compose-main"><div className="compose-toolbar"><div><span className="eyebrow">BÀN SOẠN HƯỚNG DẪN</span><h2>{form.layout || 'Bài mẫu mới'}</h2></div></div>
        {resolvedBom.message && <div className="notice" role="status"><span>!</span><p>{resolvedBom.message}</p></div>}
        {templateNotice && <p className="muted" role="status" style={{marginBottom:'var(--space-4)'}}>{templateNotice}</p>}
        {templateImages.length ? <React.Fragment><div className="layout-thumbs">{templateImages.map((im,i)=><button key={im.id} type="button" aria-pressed={templateIndex===i} onClick={()=>setTemplateIndex(i)}><figure><img src={im.url} alt={im.label}/><figcaption>{im.label}</figcaption></figure></button>)}</div><section className="engine"><div className="panel-title"><h3>Soạn hướng dẫn trên ảnh mẫu</h3><span className="muted">Đo · Đánh dấu · Ghi chú</span></div><RFVisualTrainingEngine key={form.layout} order={{id:'template',images:templateImages}} activeImageIndex={templateIndex} setActiveImageIndex={setTemplateIndex} currentUser={state.user} canEdit={!busy && !resolvingBom} erpProducts={erpProducts} onSaveAnnotations={(id,marks)=>setTemplateImages(prev=>prev.map(im=>im.id===id?{...im,annotations:marks}:im))}/></section></React.Fragment> : <div className="canvas-empty"><span>↖</span><h2>Bắt đầu từ một mẫu chuẩn</h2><p>Chọn layout để mở ảnh 5 góc, tự nạp định mức và soạn hướng dẫn trực tiếp trên ảnh.</p></div>}
        {renderStageEditor()}
        <footer className="compose-footer actions"><button aria-label="Lưu hướng dẫn mẫu" disabled={busy || resolvingBom || !templateImages.length} onClick={saveTemplate}>Lưu hướng dẫn</button><button form="rf-assignment-form" type="submit" className="primary" disabled={!canAssign} title={checklistIssues.length ? 'Giao bài cần đủ nội dung 5 công đoạn' : ''}>Giao bài</button></footer>
      </div>
    </div>}

    {!formOpen && <div className="workspace lesson-flow">{(!lessonOpen || !order) && <aside className="assignment-rail"><div className="rail-heading"><span className="eyebrow">{queueFilter==='review'?'CHỜ NGHIỆM THU':'BÀI THỰC HÀNH'}</span><span className="mono">{visibleOrders.length.toString().padStart(2,'0')}</span></div><nav className="order-list" aria-label="Danh sách bài thực hành">{visibleOrders.map(o=><button className="order-card" key={o.id} disabled={busy} aria-pressed={order?.id===o.id} onClick={()=>openLesson(o.id)}><div className="order-top">{o.images[0]?.url && <img src={o.images[0].url} alt=""/>}<div><strong>{o.layout || o.title}</strong><small>{o.assignee}</small></div></div><div className="progress-bars" aria-hidden="true">{o.steps.map((s,i)=><span key={i} className={s.completed?'done':i===o.step?'current':''}/>)}</div><span className="order-status">{statusLabel(o)} · {o.status==='IN_PROGRESS'?'Mở bài '+(o.step+1):'Xem hồ sơ'} →</span></button>)}</nav>{!visibleOrders.length && <p className="muted">{queueFilter==='review'?'Không có bài chờ duyệt.':'Chưa có bài được giao.'}</p>}</aside>}
      {(lessonOpen && order || !visibleOrders.length) && <main className="detail-panel">
        {!order && <div className="empty-state"><span className="eyebrow">RF APPRENTICESHIP</span><h2>{queueFilter==='review'?'Chưa có bài chờ nghiệm thu':'Một tay nghề tốt bắt đầu từ bài mẫu rõ ràng'}</h2><p>{state.studio?'Chọn layout chuẩn, soạn hướng dẫn trên ảnh và giao cho người thực hiện. Tiến độ và bằng chứng sẽ tập trung tại đây.':'Khi được giao bài, bạn sẽ thấy mẫu, hướng dẫn và công đoạn cần thực hiện tại đây.'}</p>{state.studio && <button className="primary" onClick={openComposer}>Soạn bài đầu tiên</button>}</div>}
        {order && <React.Fragment><button disabled={busy} className="quiet-button lesson-back" onClick={()=>setLessonOpen(false)}>← Danh sách bài học</button><div className="detail-head" ref={lessonHeading} tabIndex={-1}><div><span className="eyebrow">BÀI THỰC HÀNH / {order.id.slice(0,8)}</span><h2>{order.layout || order.title}</h2><p className="muted" style={{marginTop:'var(--space-2)'}}>{order.assignee} <span aria-hidden="true">·</span> {order.status==='IN_PROGRESS'?steps[order.step]:order.status==='AWAITING_REVIEW'?'Đã báo cáo, chờ quyết định cuối':'Hồ sơ đã được nghiệm thu'}</p></div><span className="status-pill">{statusLabel(order)}</span></div>
          {order.status==='IN_PROGRESS' && <div className="step-intro" aria-label="Bài học hiện tại"><span className="step-number">{String(order.step+1).padStart(2,'0')}</span><div><span className="eyebrow">CÔNG ĐOẠN HIỆN TẠI · {order.step+1}/5</span><h2>Bài {order.step+1}: {phaseNames[order.step]}</h2><p className="muted">{steps[order.step]}</p></div></div>}
          <div className="workbench-layout"><div><div className="panel-title"><h3>Mẫu chuẩn & hướng dẫn</h3><span className="muted">{order.images.length} góc ảnh</span></div>{order.images.length>0 && <div className="engine"><RFVisualTrainingEngine key={order.id+':'+order.revision} order={order} activeImageIndex={imageIndex} setActiveImageIndex={setImageIndex} currentUser={state.user} erpProducts={erpProducts} canEdit={state.studio && !busy && order.status!=='ACCEPTED'} onSaveAnnotations={(imageId,items)=>setAnnotations(prev=>({...prev,[imageId]:items}))}/></div>}{state.studio && annotations && <button style={{marginTop:'var(--space-4)'}} disabled={busy} onClick={()=>mutate('annotations',{updates:Object.keys(annotations).map(imageId=>({imageId,annotations:annotations[imageId]}))})}>Lưu đánh dấu / số đo ảnh</button>}</div>
            <aside className="reference-panel"><section className="section-block"><div className="panel-title"><h3>Vật tư & định mức</h3><span className="eyebrow">BOM</span></div>{bomRows.length ? <table className="bom-table"><tbody>{bomRows.map((m,i)=><tr key={i}><td>{m.name}</td><td>{m.qty} {m.unit}</td></tr>)}</tbody></table> : <p className="muted" style={{whiteSpace:'pre-wrap'}}>{order.norms}</p>}<p className="muted" style={{marginTop:'var(--space-3)'}}>Đối chiếu định mức với lượng thực tế trong báo cáo từng bước.</p></section><section className="section-block"><span className="eyebrow">NGUYÊN TẮC THỰC HÀNH</span><h3 style={{marginTop:'var(--space-2)'}}>Tự kiểm tra trước khi báo cáo</h3><p className="muted" style={{marginTop:'var(--space-3)'}}>Hoàn thành checklist, ghi số đo và vật tư thực dùng, chụp ảnh rõ kết quả. Chỉ chuyển bước khi bằng chứng đã đầy đủ.</p><p className="muted" style={{marginTop:'var(--space-3)'}}>Admin nghiệm thu một lần sau công đoạn báo cáo cuối.</p></section></aside>
          </div>
          {order.status==='IN_PROGRESS' && draft && order.assignee===state.user && <section className="section-block" style={{marginTop:'var(--space-6)'}}><h3 style={{marginBottom:'var(--space-4)'}}>Thực hiện & báo cáo bài {order.step+1}</h3><fieldset disabled={busy}><div className="checklist">{draft.checklist.map((text,i)=><label key={i}><input type="checkbox" checked={!!draft.checked[i]} onChange={e=>setDraft({...draft,checked:draft.checklist.map((_,j)=>j===i?e.target.checked:!!draft.checked[j])})}/><span>{text}</span></label>)}</div><div className="input-grid"><label>Số đo thực tế và đơn vị<textarea placeholder="Ghi kích thước đo được, kèm mm hoặc cm…" value={draft.measurements} onChange={e=>setDraft({...draft,measurements:e.target.value})}/></label><label>Nguyên liệu thực tế, lượng dùng và đơn vị<textarea placeholder="Tên vật tư, lượng đã dùng và phần thu hồi…" value={draft.materials} onChange={e=>setDraft({...draft,materials:e.target.value})}/></label></div><label>Ghi chép / báo cáo<textarea placeholder="Kết quả đã đạt, sai lệch so với mẫu và điều cần lưu ý…" value={draft.report} onChange={e=>setDraft({...draft,report:e.target.value})}/></label><label className="evidence-upload"><strong>+ Thêm ảnh kết quả thực hành</strong><span className="muted">Tối đa 5 ảnh mỗi công đoạn · Chụp rõ điểm cần kiểm tra</span><input aria-label="Ảnh thực hành" type="file" accept="image/jpeg,image/png,image/webp" onChange={upload}/></label><div className="evidence-grid">{draft.photos.map(p=><ApprenticeEvidence key={p.id} orderId={order.id} photo={p}/>)}</div><p className="muted" style={{margin:'var(--space-4) 0'}}>{evidenceReady?'Đã đủ thông tin để chuyển công đoạn.':'Cần checklist, số đo, vật tư, báo cáo và ít nhất một ảnh để hoàn thành bước.'}</p><div className="task-actions"><button onClick={()=>mutate('save',{...draft,checked:draft.checklist.map((_,i)=>!!draft.checked[i]),step:order.step})}>Lưu tiến độ</button><button className="primary" disabled={!evidenceReady} onClick={()=>mutate('advance',{...draft,checked:draft.checklist.map((_,i)=>!!draft.checked[i]),step:order.step})}>{order.step===4?'Gửi chờ nghiệm thu':'Hoàn thành bài '+(order.step+1)+' → Mở bài '+(order.step+2)}</button></div></fieldset></section>}
          {order.status==='AWAITING_REVIEW' && <section className="review-panel"><span className="eyebrow">NGHIỆM THU CUỐI</span><h2 style={{marginTop:'var(--space-2)'}}>Chờ Admin nghiệm thu cuối</h2><p className="muted" style={{marginTop:'var(--space-3)'}}>5 công đoạn đã được báo cáo. Đối chiếu ảnh, số đo và vật tư trước khi xác nhận tay nghề.</p>{state.studio && <React.Fragment><label>Nhận xét nghiệm thu<textarea placeholder="Ghi rõ điểm đạt hoặc điều cần sửa…" value={review} onChange={e=>setReview(e.target.value)}/></label><label>Trả về công đoạn<select value={returnStep} onChange={e=>setReturnStep(Number(e.target.value))}>{steps.map((s,i)=><option key={s} value={i}>{i+1}. {s}</option>)}</select></label><div className="actions"><button disabled={busy || !review.trim()} onClick={()=>mutate('review',{accept:false,returnStep,note:review})}>Trả về công đoạn</button><button className="primary" disabled={busy || !review.trim()} onClick={()=>mutate('review',{accept:true,note:review})}>Nghiệm thu đạt</button></div></React.Fragment>}</section>}
          {order.status==='ACCEPTED' && <div className="notice" style={{marginTop:'var(--space-6)'}}>✓ Đã nghiệm thu hoàn tất. Bằng chứng và lịch sử được lưu trong hồ sơ.</div>}
          {order.status!=='ACCEPTED' && <details><summary>Báo sự cố hoặc cần hỗ trợ</summary><label>Nội dung sự cố<textarea placeholder="Nêu công đoạn, vấn đề gặp phải và phần hỗ trợ cần thiết…" value={incident} onChange={e=>setIncident(e.target.value)}/></label><button style={{marginTop:'var(--space-3)'}} disabled={busy || !incident.trim()} onClick={async()=>{if(await mutate('incident',{note:incident}))setIncident('');}}>Gửi sự cố</button></details>}
          <details open={queueFilter==='review'}><summary>Hồ sơ thực hành & ảnh bằng chứng</summary>{order.steps.map((s,i)=> (s.completed || queueFilter==='review') && <section className="section-block" key={i}><div className="panel-title"><h3>{String(i+1).padStart(2,'0')} / {steps[i]}</h3><span className="status-pill">{s.completed?'Hoàn thành':'Chưa hoàn thành'}</span></div><p className="muted" style={{whiteSpace:'pre-wrap'}}>{'Số đo: '+(s.measurements || 'Chưa ghi nhận')+'\nVật tư: '+(s.materials || 'Chưa ghi nhận')+'\nBáo cáo: '+(s.report || 'Chưa có báo cáo')}</p><div className="evidence-grid">{s.photos.map(p=><ApprenticeEvidence key={p.id} orderId={order.id} photo={p}/>)}</div></section>)}</details>
          <details><summary>Lịch sử tiến độ & nghiệm thu · {order.history.length}</summary><div className="timeline">{order.history.slice().reverse().map((h,i)=><div className="timeline-entry" key={i}><time>{new Date(h.at).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'})}</time><strong>{historyLabel[h.action] || h.action}</strong><p>{h.actor} · Công đoạn {h.step+1}{h.note?' · '+h.note:''}</p></div>)}</div></details>
        </React.Fragment>}
      </main>}
    </div>}
    {legacy.length>0 && <details className="legacy-panel"><summary>Dữ liệu cũ trên trình duyệt · {legacy.length} lệnh</summary><p>Các lệnh cũ được giữ nguyên để đối chiếu. Tải bản sao trước khi chuyển vào dữ liệu chung.</p><button onClick={exportLegacy}>Tải bản sao dữ liệu cũ</button></details>}
  </section>;
}
window.ApprenticeshipTab = ApprenticeshipTab;

</script>
